<!-- Onglet Pokémon (composant HTML affiché par ecran_pokemon.py, données dans __DONNEES__).
L'animation d'ouverture et la fiche du Pokédex s'affichent par-dessus toute l'appli, dans la page parente
(window.parent.document) ; la Poké Ball est en 3D (three.js), avec un repli en 2D si three.js ne charge pas. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:transparent;color:#EEF2FA;font-family:Outfit,system-ui,sans-serif;overflow:hidden}
img{image-rendering:pixelated}
button{font-family:inherit}
.carte{background:#1C2740;border-radius:18px;padding:14px;margin:0 0 12px;position:relative;overflow:hidden}
h2{font-size:18px;font-weight:800;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;font-weight:600;color:#9AA7C2;margin-left:auto}
.gris{color:#9AA7C2}.petit{font-size:12px}
.type{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600;color:#fff;margin:2px 3px 0 0;
  text-shadow:0 1px 1px rgba(0,0,0,.35)}

/* ----- Barre d'effort ----- */
#barre{background:radial-gradient(120% 140% at 0% 0%,#3A1830 0%,#1C2740 55%);display:flex;gap:14px;align-items:center}
#barre .filigrane{position:absolute;right:-40px;top:-40px;width:170px;opacity:.07;pointer-events:none}
.anneau{position:relative;width:118px;height:118px;flex:0 0 118px}
.anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
.anneau .centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anneau .v{font-size:28px;font-weight:900;line-height:1}.anneau .s{font-size:11px;color:#9AA7C2}
.anneau .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
#barre .droite{flex:1;min-width:0}
#barre .titre{font-weight:800;font-size:16px}
#barre .manque{font-size:12.5px;color:#C9D3EA;margin:4px 0 6px;line-height:1.45}
#barre .manque b{color:#fff}
.puces{display:flex;flex-wrap:wrap;gap:4px}
.puce{background:rgba(13,19,34,.7);border-radius:9px;padding:2px 8px;font-size:11.5px;color:#C9D3EA}
.puce b{color:#FFCB05}

/* ----- Poké Balls à ouvrir ----- */
#aouvrir{background:radial-gradient(100% 120% at 50% 0%,#2A3F7A 0%,#1C2740 70%);text-align:center;padding:16px 12px}
#aouvrir.vide{display:none}  /* rien à ouvrir : le bloc disparaît */
#aouvrir .titre{font-size:19px;font-weight:900;letter-spacing:.2px}
#aouvrir .rang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.bouton-ball{background:none;border:0;padding:0;cursor:pointer;position:relative;width:64px;height:64px;
  animation:flotte 2.6s ease-in-out infinite}
.bouton-ball svg{width:64px;height:64px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.bouton-ball:after{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);animation:halo 2.6s ease-in-out infinite}
.bouton-ball .q{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:10px;color:#9AA7C2;
  white-space:nowrap}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(0)}
  80%{transform:translateY(0) rotate(-8deg)}88%{transform:translateY(0) rotate(7deg)}}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.gros-bouton{margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#FF4B4B,#D21F2E);box-shadow:0 4px 0 #8E1220,0 8px 20px rgba(210,31,46,.35);
  cursor:pointer;animation:pouls 1.8s ease-in-out infinite}
.gros-bouton:active{transform:translateY(3px);box-shadow:0 1px 0 #8E1220}
@keyframes pouls{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

/* ----- Balls spéciales ----- */
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.speciale{background:#1C2740;border-radius:16px;padding:11px 12px;position:relative;overflow:hidden}
.speciale.ok{box-shadow:inset 0 0 0 2px #4CD3A0}
.speciale .tete{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.speciale .tete .ico{width:32px;height:32px;flex:0 0 32px}
.speciale .gain{font-size:11px;color:#9AA7C2;margin:2px 0 6px;line-height:1.3}
.speciale .ligne{font-size:11px;color:#C9D3EA;margin-top:5px;display:flex;justify-content:space-between;gap:4px}
.jauge{height:6px;background:#0D1322;border-radius:3px;margin-top:3px;overflow:hidden}
.jauge div{height:100%;border-radius:3px;background:#6B8CFF;transition:width 1s ease}
.jauge div.ok{background:#4CD3A0}
.speciale .tampon{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:800;color:#4CD3A0}
.points-serie{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.points-serie i{width:7px;height:7px;border-radius:50%;background:#0D1322}
.points-serie i.on{background:#B57BFF;box-shadow:0 0 6px #B57BFF}
.points-serie i.rate{background:#5A2A38}
.points-serie i.auj{box-shadow:inset 0 0 0 1.5px #B57BFF}
.speciale.defi{grid-column:1/-1;padding-left:84px;min-height:86px;box-shadow:0 0 0 2px var(--c) inset;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,#1C2740),#1C2740 60%)}
.speciale.defi .portrait{position:absolute;left:12px;top:12px;width:60px;height:60px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#fff 0%,var(--c) 80%);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.5)}
.speciale.defi .portrait canvas{width:100%;height:100%;image-rendering:pixelated}
.speciale.defi .ligne b{color:#fff}
/* le badge gagné qui attend d'être pris (à la place d'une Poké Ball) */
.bandeau-test{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:7px 10px;border-radius:10px;
  background:repeating-linear-gradient(135deg,#3A2E05 0 10px,#2A2204 10px 20px);color:#FFE27A;font:800 12.5px Outfit,sans-serif;
  box-shadow:0 0 0 1.5px #FFCB05 inset}
.bandeau-test button{border:0;border-radius:999px;padding:5px 10px;background:#FFCB05;color:#1C2740;font:800 12px Outfit,sans-serif;cursor:pointer}
.zone-test{border-top:1px dashed rgba(255,255,255,.2);padding-top:8px;margin-top:6px}
.zone-test .filtre{margin:6px 6px 0 0}
.badge-attente{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px;border:0;border-radius:14px;cursor:pointer;
  text-align:left;color:#fff;font-family:Outfit,sans-serif;background:radial-gradient(120% 140% at 0% 50%,color-mix(in srgb,var(--c) 55%,#1C2740),#1C2740 70%);
  box-shadow:0 0 0 2px #FFD84A inset,0 0 18px rgba(255,216,74,.35)}
.badge-attente .disque{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 30%,#FFF7CF,#FFD84A 55%,#C08A00);box-shadow:0 0 0 2px #FFF3B0,0 0 20px 4px rgba(255,216,74,.6);
  animation:pk-badge-att 2.4s ease-in-out infinite}
.badge-attente .disque img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:pk-badge-tourne 3.4s ease-in-out infinite}
@keyframes pk-badge-att{50%{transform:translateY(-4px) scale(1.05);box-shadow:0 0 0 2px #FFF3B0,0 0 30px 8px rgba(255,216,74,.8)}}
@keyframes pk-badge-tourne{50%{transform:rotate(-8deg) scale(1.06)}}
.badge-attente .txt{display:flex;flex-direction:column;gap:3px}
.badge-attente b{font-size:17px;font-weight:900}
.badge-attente small{font-size:12.5px;color:#FFE27A;font-weight:700}
.bandeau-voyage.or{box-shadow:0 0 0 2px #FFD84A inset,0 0 18px rgba(255,216,74,.5);background:linear-gradient(135deg,#5A4A12,#1C2740)}
.speciale.mission .m-titre{font-size:13px;font-weight:800;color:#FFE27A;margin-top:2px}
.speciale.mission .m-pourquoi{font-size:10.5px;color:#7C8AA8;margin-top:5px;line-height:1.3}
.puce.bonus{background:rgba(255,203,5,.14);box-shadow:inset 0 0 0 1px rgba(255,203,5,.45)}
.semaine-pesee{display:flex;gap:3px;margin:4px 0 0}
.semaine-pesee i{flex:1;aspect-ratio:1;max-width:19px;border-radius:50%;display:grid;place-items:center;font:800 9px Outfit,sans-serif;
  font-style:normal;color:#7C8AA8;background:#0D1322;box-shadow:inset 0 0 0 1px #2A3654}
.semaine-pesee i.on{background:#4CD3A0;color:#0D1322;box-shadow:none}
.semaine-pesee i.rate{color:#55607A;background:#141B2E}
.semaine-pesee i.auj{box-shadow:inset 0 0 0 1.5px #FFCB05;color:#FFCB05}
.pesee-der{font-size:11px;color:#C9D3EA;margin-top:6px}
.pesee-der b{color:#fff}
.pesee-comp{display:flex;align-items:center;flex-wrap:wrap;gap:1px;font-size:11px;color:#9AA7C2;margin-top:2px}
.pesee-comp span{position:relative;display:inline-block}
.pesee-comp img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}
.pesee-comp i{position:absolute;right:-3px;bottom:-1px;font:800 9px Outfit,sans-serif;font-style:normal;color:#fff;
  background:#0D1322;border-radius:6px;padding:0 3px}
.speciale .reste{font-size:11px;color:#FFCB05;margin-top:7px;line-height:1.35}
.speciale.ok .reste{color:#4CD3A0}

/* ----- Voyage dans Kanto ----- */
#voyage{padding:14px 12px 12px;background:radial-gradient(120% 90% at 50% 0%,#1D4A5E 0%,#1C2740 70%)}
#voyage .entete{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#voyage .entete .titre{font-weight:900;font-size:17px}
#voyage .entete .ou{font-size:12px;color:#C9D3EA;margin-left:auto}
.avance{height:7px;background:#0D1322;border-radius:4px;margin:8px 0 10px;overflow:hidden}
.avance div{height:100%;border-radius:4px;background:linear-gradient(90deg,#FFCB05,#FF8A3D);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.carte-kanto{width:100%;display:block;background:#2B6E9E;touch-action:manipulation}
/* la carte : une fenêtre (carte-vue) sur la carte zoomée (carte-wrap, --z fois plus large) ; les tailles en %
   (dresseur, champion, bulle) sont divisées par --z pour garder la même taille à l'écran */
.carte-cadre{position:relative;margin-top:14px}
.carte-vue{overflow:hidden;border-radius:14px 14px 0 0;background:#2B6E9E;scrollbar-width:none;overscroll-behavior:auto;
  -webkit-overflow-scrolling:touch}
.carte-vue::-webkit-scrollbar{display:none}
.carte-vue.glisse{cursor:grabbing;user-select:none}
.carte-zoom{position:absolute;left:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:4px;border:0;border-radius:999px;
  padding:4px 10px 4px 6px;background:rgba(16,35,58,.82);color:#fff;font:800 12px Outfit,sans-serif;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 2px 6px rgba(0,0,0,.4);cursor:pointer}
.carte-wrap{position:relative;--z:1}
.carte-wrap .heros,.ombre-heros{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.carte-wrap .heros{display:flex;flex-direction:column;align-items:center;width:calc(20% / var(--z))}
.carte-wrap .heros-ancre{position:absolute;inset:0;pointer-events:none}
/* le voyage depuis la dernière visite : carte assombrie + bouton ▶, et bandeau en haut de l'onglet */
.carte-attente{position:absolute;left:0;right:0;top:0;aspect-ratio:var(--ar);z-index:7;border:0;border-radius:14px 14px 0 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:Outfit,sans-serif;
  background:radial-gradient(circle at 50% 50%,rgba(10,16,30,.35),rgba(10,16,30,.72));transition:opacity .45s}
.carte-attente.part{opacity:0;pointer-events:none}
.carte-attente .play{width:64px;height:64px;border-radius:50%;background:#E8382F;position:relative;
  box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.5);animation:pk-play 1.6s ease-in-out infinite}
.carte-attente .play:after{content:"";position:absolute;left:25px;top:18px;border-left:22px solid #fff;border-top:14px solid transparent;
  border-bottom:14px solid transparent}
@keyframes pk-play{50%{transform:scale(1.08)}}
.carte-attente b{font-size:18px;font-weight:900;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.carte-attente small{font-size:13px;font-weight:700;color:#FFE27A;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.bandeau-voyage{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:10px 12px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#1D4A5E,#1C2740);color:#fff;text-align:left;cursor:pointer;font-family:Outfit,sans-serif;
  box-shadow:0 0 0 2px #FFCB05 inset,0 4px 14px rgba(0,0,0,.35);animation:pk-bandeau 2.2s ease-in-out infinite}
.bandeau-voyage span{flex:1;display:flex;flex-direction:column;gap:2px}
.bandeau-voyage b{font-size:15px;font-weight:900}
.bandeau-voyage small{font-size:12.5px;color:#FFE27A;font-weight:700}
.bandeau-voyage i{width:30px;height:30px;border-radius:50%;background:#E8382F;position:relative;flex:none;box-shadow:0 0 0 2px #fff}
.bandeau-voyage i:after{content:"";position:absolute;left:11px;top:8px;border-left:11px solid #fff;border-top:7px solid transparent;
  border-bottom:7px solid transparent}
@keyframes pk-bandeau{50%{box-shadow:0 0 0 2px #FFCB05 inset,0 0 18px 2px rgba(255,203,5,.45)}}
/* la boule de cristal (dans une grotte) : on y voit le dresseur marcher sous la montagne */
.carte-wrap .boule{position:absolute;width:calc(24% / var(--z));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  overflow:hidden;z-index:4;box-shadow:0 0 0 2px #FFE7A0,0 0 0 4px #9C7426,0 0 0 5.5px rgba(40,25,5,.6),0 0 16px 5px rgba(255,214,120,.55),
  0 6px 12px rgba(0,0,0,.55);animation:pk-boule 2.4s ease-in-out infinite}
.carte-wrap .boule canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.carte-wrap .boule .sacha{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:20%!important;z-index:1}
.carte-wrap .boule .sacha.miroir{transform:translateX(-50%) scaleX(-1)}
.carte-wrap .boule:after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.5) 0,rgba(255,255,255,.12) 18%,transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 58%,rgba(20,10,40,.45) 100%)}
@keyframes pk-boule{50%{box-shadow:0 0 0 2px #FFE7A0,0 0 0 4px #9C7426,0 0 0 5.5px rgba(40,25,5,.6),0 0 22px 8px rgba(255,214,120,.7),
  0 6px 12px rgba(0,0,0,.55)}}
.carte-wrap .heros.navire{width:calc(15% / var(--z));animation:pk-vole 2s ease-in-out infinite}
.carte-wrap .heros.navire img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.carte-wrap .heros.navire img.miroir{transform:scaleX(-1)}
.carte-wrap .heros .sacha{width:23%!important}
.carte-wrap .heros:not(.porte) .sacha[style*="red_bike"],.carte-wrap .heros:not(.porte) .sacha[style*="red_surf"]{width:46%!important}
.sacha{background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.sacha.miroir{transform:scaleX(-1)}
.carte-wrap .heros.porte{animation:pk-vole 1.6s ease-in-out infinite}
.carte-wrap .heros.porte img{width:45%;margin-top:-30%;image-rendering:pixelated;order:2}
.carte-wrap .heros.porte .sacha{order:1;position:relative;z-index:1;width:20%!important}
.carte-wrap .heros.porte .bateau{width:60%;height:auto;margin-top:-30%;order:2}
@keyframes pk-vole{50%{transform:translate(-50%,-108%)}}
@keyframes pk-saute{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-112%)}}
.ombre-heros{width:calc(4.5% / var(--z));height:calc(1.6% / var(--z));border-radius:50%;background:rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.carte-wrap .chef{position:absolute;width:calc(8.5% / var(--z));aspect-ratio:1;transform:translate(-50%,-50%);cursor:pointer;z-index:3}
.carte-wrap .chef .portrait{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 30%,#fff 0%,var(--c) 80%);box-shadow:0 0 0 2px #fff,0 0 0 3.5px rgba(0,0,0,.45),0 2px 5px rgba(0,0,0,.5)}
.carte-wrap .chef canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.carte-wrap .chef .bdg{position:absolute;right:-20%;top:-20%;width:52%;height:52%;object-fit:contain;padding:7%;border-radius:50%;
  background:#16213A;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.6)}
.carte-wrap .chef.nouveau:before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2.5px #fff;
  animation:pk-appel 1.8s ease-out infinite;pointer-events:none}
@keyframes pk-appel{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.carte-kanto .medaille.gagne{filter:drop-shadow(0 0 2.5px rgba(255,216,74,.95))}
.carte-kanto .medaille .eclat{animation:pk-eclat 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pk-eclat{0%,55%,100%{opacity:0;transform:scale(.2) rotate(0)}75%{opacity:1;transform:scale(1) rotate(45deg)}}
.bulle-chef{position:absolute;box-sizing:border-box;background:#F8F8F8;color:#383838;
  border:3px solid #50607E;border-radius:10px;padding:7px 9px;font:500 12.5px/1.35 'Pixelify Sans',Outfit,sans-serif;z-index:5;
  box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pkl-bulle .25s ease-out}
.bulle-chef b{color:#C03028}
.bulle-chef small{display:block;margin-top:4px;font-size:11px;color:#6A6A6A}
@keyframes pkl-bulle{from{opacity:0}}
.bulle-chef.dessous{transform:translate(-50%,calc(10px + 6vw))}
.carte-kanto .vise{animation:pk-vise 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pk-vise{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.carte-kanto .lieu{cursor:pointer}
.carte-kanto .choix{opacity:0;transition:opacity .2s}
.carte-kanto .choisi .choix{opacity:1;animation:pk-choix 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pk-choix{50%{transform:scale(1.18)}}
.carte-kanto .choisi .nom{fill:#FFD84A;font-size:9.5px}
.carte-kanto text{font-family:Outfit,sans-serif;font-weight:800;paint-order:stroke;stroke:#10233A;stroke-width:2.6px;stroke-linejoin:round;fill:#fff}
.infos-lieu{background:rgba(13,19,34,.55);border-radius:0 0 14px 14px;padding:10px 12px;margin-top:0}
.infos-lieu .nom{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.infos-lieu .nom small{font-weight:600;color:#9AA7C2;font-size:11.5px;margin-left:auto}
.coin{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.coin img{width:40px;height:40px;object-fit:contain;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;display:block}
.coin .pk{position:relative}
.coin .pk i{position:absolute;top:-4px;right:-3px;font-size:10px;font-style:normal;pointer-events:none}
.coin img.non{filter:brightness(0);opacity:.35}
.arene{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,203,5,.14),rgba(13,19,34,.5));
  border-radius:14px;padding:8px 10px;margin-bottom:10px}
.arene .bdg{width:56px;height:56px;flex:0 0 56px;object-fit:contain;image-rendering:pixelated;
  filter:grayscale(.7) brightness(.85) drop-shadow(0 0 8px var(--c,#FFCB05));animation:pkl-hop 2.4s ease-in-out infinite}
.arene .bdg.ligue{display:flex;align-items:center;justify-content:center;filter:none}.arene .bdg.ligue .ico{width:34px;height:34px}
.arene .q{flex:1;min-width:0;font-size:11.5px;color:#C9D3EA;line-height:1.35}

// ----- Particules (étincelles, confettis) sur un canvas 2D -----
function Particules(canvas) {
  const ctx = canvas.getContext("2d"), parts = [];
  let W = 0, H = 0, dpr = 1;
  const taille = () => { dpr = Math.min(PW.devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight;
                         canvas.width = W * dpr; canvas.height = H * dpr; };
  taille();

    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .28 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  };
  return {
    taille,
    jet(x, y, n, {couleurs = ["#fff"], vitesse = 6, forme = "etoile", taille: t = 6, vie = 1.2, gravite = .12, cercle = false} = {}) {
      for (let i = 0; i < n; i++) {
        const a = cercle ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2, v = vitesse * (.4 + Math.random() * .8);
        parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (forme === "confetti" ? 4 : 0), g: gravite,
          vie: vie * (.6 + Math.random() * .6), age: 0, t: t * (.5 + Math.random()), rot: Math.random() * 6,
          vr: (Math.random() - .5) * .3, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme});
      }
    },
    scintille(x, y, rayon, couleurs) {
      const a = Math.random() * Math.PI * 2, r = rayon * Math.sqrt(Math.random());
      parts.push({x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * .9, vx: 0, vy: -.3, g: 0, vie: .9, age: 0,
        t: 4 + Math.random() * 7, rot: 0, vr: .05, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme: "brille"});
    },
    dessiner(dt) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.age += dt;
        if (p.age > p.vie) { parts.splice(i, 1); continue; }
        const k = dt * 60; p.vx *= Math.pow(.97, k); p.vy = p.vy * Math.pow(.97, k) + p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
        const f = 1 - p.age / p.vie; ctx.globalAlpha = p.forme === "brille" ? Math.sin(Math.PI * p.age / p.vie) : Math.min(1, f * 1.5);
        ctx.fillStyle = p.c;
        if (p.forme === "confetti") { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2); ctx.restore(); }
        else if (p.forme === "rond") { ctx.beginPath(); ctx.arc(p.x, p.y, p.t * f, 0, 7); ctx.fill(); }
        else etoile(p.x, p.y, p.t * (p.forme === "brille" ? 1 : f), p.rot);
      }
      ctx.globalAlpha = 1;
      return parts.length;
    },
  };
}

function texture(type, haut) {

    if (haut && type === "hyper" && Math.abs(x) > .26 && Math.abs(x) < .46 && z > -.55 && y > .12) col = jaune;
    if (haut && type === "master") {

  haut.add(new THREE.Mesh(new THREE.SphereGeometry(R * .985, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({color: 0x1B1B1F, side: THREE.BackSide, roughness: .8})));
  const bandeMat = new THREE.MeshStandardMaterial({color: 0x141414, roughness: .5});
  const bandeH = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeH.position.y = R * .035; haut.add(bandeH);
  const bandeB = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeB.position.y = -R * .035; ball.add(bandeB);
  // Le bouton, à l'avant
  const bouton = new THREE.Group(); bouton.position.set(0, 0, R * .96); ball.add(bouton);
  const anneau = new THREE.Mesh(new THREE.CylinderGeometry(R * .3, R * .3, R * .14, 48), bandeMat);
  anneau.rotation.x = Math.PI / 2; bouton.add(anneau);
  const btnMat = new THREE.MeshPhysicalMaterial({color: 0xF4F4F4, roughness: .25, clearcoat: 1, emissive: 0xffffff, emissiveIntensity: 0});
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(R * .19, R * .2, R * .1, 48), btnMat);
  btn.rotation.x = Math.PI / 2; btn.position.z = R * .07; bouton.add(btn);
  // Faisceau de lumière (à l'ouverture)
  const gc = P.createElement("canvas"); gc.width = 4; gc.height = 128; const g2 = gc.getContext("2d");
  const grd = g2.createLinearGradient(0, 0, 0, 128); grd.addColorStop(0, "rgba(255,255,255,0)"); grd.addColorStop(1, "rgba(255,255,255,1)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 4, 128);
  const fxMat = new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(gc), transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide});
  const faisceau = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.9, R * .85, R * 4.2, 48, 1, true), fxMat);
  faisceau.position.y = R * 2.1; ball.add(faisceau);
  const lumiere = new THREE.PointLight(0xffffff, 0, 8); lumiere.position.set(0, .3, 0); ball.add(lumiere);
  // Ombre au sol
  const oc = P.createElement("canvas"); oc.width = oc.height = 64; const o2 = oc.getContext("2d");
  const og = o2.createRadialGradient(32, 32, 0, 32, 32, 32); og.addColorStop(0, "rgba(0,0,0,.55)"); og.addColorStop(1, "rgba(0,0,0,0)");
  o2.fillStyle = og; o2.fillRect(0, 0, 64, 64);
  const ombre = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(oc), transparent: true, depthWrite: false}));
  ombre.rotation.x = -Math.PI / 2; ombre.position.y = -1.05; scene.add(ombre);

  const taille = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h;
    const cible = Math.min(w * .48, h * .42, 230);           // diamètre de la ball à l'écran, en pixels
    const hv = 2 * R * h / cible, d = hv / (2 * Math.tan(cam.fov * Math.PI / 360));
    cam.position.set(0, d * .12, d); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix(); base = cam.position.clone();
  };
  let base; taille();
  const coul = c => new THREE.Color(c);
  return {
    ball, taille,
    get y() { return ball.position.y; },
    set y(v) { ball.position.y = v; ombre.material.opacity = Math.max(0, 1 - v / 3); ombre.scale.setScalar(1 - Math.min(Math.max(v, 0), 3) * .15); },
    get rotY() { return ball.rotation.y; }, set rotY(v) { ball.rotation.y = v; },
    get rotZ() { return ball.rotation.z; }, set rotZ(v) { ball.rotation.z = v; },
    get x() { return ball.position.x; }, set x(v) { ball.position.x = v; },
    set echelle(v) { ball.scale.setScalar(v); ombre.visible = v > .3; },
    set ouverture(v) { pivot.rotation.x = -v; },
    set zoom(v) { cam.position.copy(base).multiplyScalar(1 / v); },
    lueurBouton(intensite, c = 0xffffff) { btnMat.emissive = coul(c); btnMat.emissiveIntensity = intensite; },
    interieur(c, i) { coeurMat.color = coul(c).multiplyScalar(i); },
    faisceau(op, c = 0xffffff) { fxMat.opacity = op; fxMat.color = coul(c); lumiere.color = coul(c); lumiere.intensity = op * 30; },
    rendre() { renderer.render(scene, cam); },
    ecran() { const v = new THREE.Vector3(); ball.getWorldPosition(v); v.project(cam);  // centre de la ball, en pixels
              return [(v.x + 1) / 2 * canvas.clientWidth, (1 - v.y) / 2 * canvas.clientHeight]; },
    fin() { renderer.dispose(); renderer.forceContextLoss && renderer.forceContextLoss(); },
  };
}

// ----- Repli en 2D (si three.js n'a pas pu se charger) -----
function Ball2D(el, type) {
  el.innerHTML = ballSVG(type);
  const s = {y: 0, rotY: 0, rotZ: 0, x: 0, echelle: 1, ouverture: 0};
  const maj = () => el.style.transform = `translate(${s.x * 60}px,${-s.y * 60}px) rotate(${s.rotZ}rad) scale(${s.echelle})`;
  const proxy = new Proxy(s, {set(o, k, v) { o[k] = v; maj(); return true; }});
  return Object.assign(proxy, {lueurBouton() {}, interieur() {}, faisceau() {}, rendre() {}, taille() {},
    set zoom(v) {}, ecran() { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }, fin() {}});
}

// ----- La séquence complète -----
function ouvrir(c, rejouer = false, direct = false) {  // direct : on arrive de la scène du labo (la ball a déjà été choisie)
  ouverture = true;
  installerStyle("pkm2-style", STYLE_VOILE);
  audio();  // le toucher qui ouvre autorise le son
  // Nouveau Pokémon = première capture ouverte de cette espèce
  const nouveau = rejouer ? CAPTURES.find(x => x.num === c.num && estOuverte(x)).id === c.id : !collection()[c.num];
  const r = {leg: c.legendaire, shiny: c.shiny, nouveau};
  const cls = r.leg ? "r-leg" : r.shiny ? "r-shiny" : r.nouveau ? "r-nouveau" : "r-version";
  const teinte = r.leg ? 0xFF8CE6 : r.shiny ? 0xFFD75A : r.nouveau ? 0x7FE8FF : 0xffffff;
  const couleursFx = r.leg ? ["#FF8CE6", "#B57BFF", "#7FD4FF", "#fff"] : r.shiny ? ["#FFE27A", "#FFCB05", "#fff"] :
                     r.nouveau ? ["#7FE8FF", "#fff", "#4CD3A0"] : ["#fff", "#C9D3EA"];

  const v = P.createElement("div"); v.id = "pkm-voile";
  v.innerHTML = `<div class="fond"></div><div class="rayons"></div><canvas class="scene"></canvas><div class="ball2d" hidden></div>
    <img class="poke" alt=""><canvas class="fx"></canvas><div class="flash"></div>
    <div class="haut"><button class="rond son">${son ? "🔊" : "🔇"}</button><div class="nom-ball">${BALLS[c.ball] || "Poké Ball"}</div>
      <button class="rond x">✕</button></div>
    <div class="aide">Touche la ${BALLS[c.ball] || "Poké Ball"} !<small>${raisonHTML(c)}</small></div>
    <div class="carte"></div>`;
  P.body.appendChild(v); requestAnimationFrame(() => v.classList.add("vu"));
  const $ = s => v.querySelector(s), poke = $(".poke"), aide = $(".aide"), carte = $(".carte"), flash = $(".flash");
  const fx = Particules($(".fx"));
  let B;
  try { if (!window.THREE) throw 0; B = Ball3D($(".scene"), c.ball); }
  catch (e) { $(".scene").hidden = true; $(".ball2d").hidden = false; B = Ball2D($(".ball2d"), c.ball); }

  // Boucle d'affichage (dans la fenêtre parente : jamais ralentie)
  let fini = false, dernier = maintenant(), anims = [], brille = false;
  const boucle = now => {
    if (fini) return;
    const dt = Math.min((now - dernier) / 1000, .05); dernier = now;
    anims = anims.filter(a => a(now) !== false);
    if (brille) { const rc = poke.getBoundingClientRect();
      if (Math.random() < .5) fx.scintille(rc.left + rc.width / 2, rc.top + rc.height / 2, Math.max(rc.width, 80) * .65, couleursFx); }
    fx.dessiner(dt); B.rendre(); PW.requestAnimationFrame(boucle);
  };
  PW.requestAnimationFrame(boucle);
  const redim = () => { B.taille(); fx.taille(); }; PW.addEventListener("resize", redim);
  const tween = (ms, f, e = ease.inout) => new Promise((ok, ko) => { const t0 = maintenant();
    anims.push(now => { if (fini) { ko("fermé"); return false; } const t = Math.min((now - t0) / ms, 1); f(e(t), t); if (t >= 1) { ok(); return false; } }); });
  const pause = ms => new Promise((ok, ko) => setTimeout(() => fini ? ko("fermé") : ok(), ms));
  const touche = () => new Promise((ok, ko) => { const f = ev => { if (ev.target.closest("button")) return;
    v.removeEventListener("pointerdown", f); fini ? ko("fermé") : ok(); }; v.addEventListener("pointerdown", f); });
  const fermer = () => { if (fini) return; fini = true; ouverture = false; v.classList.add("fin"); PW.removeEventListener("resize", redim);
    setTimeout(() => { B.fin(); v.remove(); }, 320); dessiner(); };
  $(".x").onclick = fermer;
  $(".son").onclick = e => { son = !son; e.target.textContent = son ? "🔊" : "🔇"; try { localStorage.setItem("pkm_son", son ? "1" : "0"); } catch (x) {} };

  // La grande illustration officielle (chargée pendant que la ball tombe) ; sinon l'image animée
  poke.onerror = () => { poke.onerror = null; poke.src = IMG.anim(c.num, c.shiny); };
  poke.src = IMG.hd(c.num, c.shiny);

  const centre = () => B.ecran();
  (async () => {
    // 1. Elle tombe du ciel et rebondit
    B.y = 5; B.rotY = -Math.PI * 3;
    SONS.chute();
    await tween(950, (e, t) => { B.y = 5 * (1 - e); B.rotY = -Math.PI * 3 * (1 - ease.out(t)); }, ease.rebond);
    SONS.rebond(); vibre(20);
    if (rejouer && !direct) return devoiler(true);
    // 2. Elle attend qu'on la touche (sauf en arrivant du labo : elle a déjà été choisie)
    if (!direct) {
      aide.classList.add("vu");
      let tAtt = maintenant(), attend = true;
      anims.push(now => { if (!attend) return false; const t = (now - tAtt) / 1000;
        B.y = .08 + Math.sin(t * 2.2) * .08; B.rotY = Math.sin(t * .9) * .5; B.lueurBouton(.25 + .25 * Math.sin(t * 4)); });
      await touche(); attend = false; aide.classList.remove("vu");
      await tween(250, e => { B.y = .08 * (1 - e); B.rotY *= (1 - e); B.lueurBouton(0); });
    }
    // 3. Les secousses : une de plus quand c'est rare, et de plus en plus longues
    const n = r.leg || r.shiny || r.nouveau ? 4 : 3;
    for (let i = 0; i < n; i++) {
      await pause(380 + i * 260);
      SONS.secousse(); vibre(35);
      const amp = .42 + i * .04;
      await tween(620, (e, t) => { B.rotZ = Math.sin(t * Math.PI * 2) * amp * (1 - t * .3); B.x = Math.sin(t * Math.PI * 2) * .12;
        B.lueurBouton(Math.sin(t * Math.PI) * .9, 0xFF3030); B.zoom = 1 + (i + t) * .045; }, x => x);
      B.rotZ = 0; B.x = 0;
    }
    // 4. « Clic ! »
    await pause(300);
    SONS.clic(); vibre([15, 40, 15]);
    { const [x, y] = centre(); fx.jet(x, y - 40, 3, {couleurs: ["#FFE27A", "#fff"], vitesse: 5, taille: 12, vie: .9, gravite: .05}); }
    await pause(650);
    // 5. Elle s'éveille : lueur (blanche, dorée pour un shiny, multicolore pour un légendaire, bleue pour un nouveau)
    SONS.montee(.9);
    await tween(900, (e, t) => { B.lueurBouton(e * 3, teinte); B.x = (Math.random() - .5) * .06 * e; B.rotZ = (Math.random() - .5) * .08 * e;
      B.zoom = 1 + n * .045 + e * .08; });
    B.x = 0; B.rotZ = 0;
    devoiler(false);
  })().catch(() => {});

  async function devoiler(vite) {
    // 6. Elle s'ouvre : faisceau, flash, le Pokémon sort en silhouette puis prend ses couleurs
    v.classList.add(cls);
    if (!vite) { SONS.ouverture(); vibre(60); }
    B.interieur(teinte, 1);
    await tween(vite ? 200 : 360, e => { B.ouverture = e * 1.95; B.faisceau(e * .85, teinte); }, ease.back);
    flash.classList.add("go");
    const [x, y] = centre();
    fx.jet(x, y, vite ? 20 : 46, {couleurs: couleursFx, vitesse: 9, taille: 9, vie: 1.3, gravite: .04, cercle: true});
    poke.classList.add("sort"); SONS.materialise();
    v.classList.add("revele");
    await tween(500, e => { B.echelle = 1 - e; B.y = -e * .6; B.faisceau(.85 * (1 - e), teinte); }, ease.inout);
    await pause(vite ? 150 : 550);
    poke.classList.add("couleur"); vibre(r.nouveau || r.shiny ? [40, 60, 80] : 30);
    const pr = poke.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
    if (r.leg) { SONS.legendaire(); fx.jet(px, py, 90, {couleurs: couleursFx, vitesse: 12, taille: 10, vie: 2, gravite: .02, cercle: true}); }
    if (r.shiny) { SONS.shiny(); fx.jet(px, py, 60, {couleurs: couleursFx, vitesse: 8, taille: 11, vie: 1.8, gravite: .01}); }
    else if (r.nouveau) SONS.nouveau(); else SONS.version();
    if (r.nouveau && !r.leg) fx.jet(px, py - 40, 110, {couleurs: ["#FF5D5D", "#FFCB05", "#4CD3A0", "#6B8CFF", "#B57BFF", "#fff"],
      forme: "confetti", vitesse: 11, taille: 10, vie: 2.6, gravite: .16});
    brille = r.shiny || r.leg;
    setTimeout(() => poke.classList.add("danse"), 700);
    if (!rejouer) memoriser(c.id);
    montrerCarte();
  }

  function montrerCarte() {
    const col = collection(), especes = Object.keys(col).length, reste = aOuvrir();
    const shinys = Object.values(col).filter(l => l.some(x => x.shiny)).length;
    const badges = [r.nouveau ? `<span class="badge b-nouveau">NOUVEAU POKÉMON !</span>` : r.shiny ? "" : `<span class="badge b-version">CAPTURÉ !</span>`,
                    r.shiny ? `<span class="badge b-shiny">${ico("shiny", "p brille")} SHINY</span>` : "", r.leg ? `<span class="badge b-leg">${ico("master", "p")} LÉGENDAIRE</span>` : ""];
    carte.innerHTML = `<div class="badges">${badges.join("")}</div>
      <div class="no">N° ${N3(c.num)}</div><div class="nm">${c.nom}</div><div>${typesHTML(c.types, "pkm-type")}</div>
      <div class="ver">${c.shiny ? `${ico("shiny", "p brille")} Shiny · ` : ""}${c.lieu ? `${ico("carte", "p")} ${c.lieu}` : ""}</div>
      <div class="rs">${BALLS[c.ball] || "Poké Ball"} · ${raisonHTML(c)} · ${c.quand}</div>
      <div class="compteur"><div><div class="l">Pokédex</div><div class="v">${especes} / 151</div><div class="j"><div style="width:${(especes - (r.nouveau && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div>
        <div><div class="l">Shiny ${ico("shiny", "p brille")}</div><div class="v">${shinys} / 151</div><div class="j"><div style="width:${(shinys - (c.shiny && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div></div>
      <div class="boutons">${reste.length && !rejouer ? `<button class="b1 suite">Ouvrir la suivante (${reste.length})</button>` : ""}
        <button class="${reste.length && !rejouer ? "b2" : "b1"} ok">${r.nouveau || r.shiny ? "Génial !" : "Super !"}</button></div>`;
    carte.querySelectorAll(".badge").forEach((b, i) => b.style.animationDelay = `${.15 + i * .18}s${b.classList.contains("b-nouveau") ? ",0s" : ""}`);
    setTimeout(() => { carte.classList.add("vu");
      setTimeout(() => { const j = carte.querySelectorAll(".compteur .j div");
        if (j[0]) j[0].style.width = especes / 1.51 + "%"; if (j[1]) j[1].style.width = shinys / 1.51 + "%"; }, 500); }, 350);
    carte.querySelector(".ok").onclick = fermer;
    const s = carte.querySelector(".suite");
    if (s) s.onclick = () => { fermer(); setTimeout(() => lancer(aOuvrir()[0]), 340); };
  }
}

// Une boîte de dialogue dans la scène v : dire(texte, qui) écrit le texte lettre par lettre (petit « bip »), toucher =
// tout afficher, puis passer à la suite ; cacher() la range. Les touchers sur ignorer (sélecteur) ne la font pas avancer.
function dialogue(v, ignorer = ".pkm-passer") {
  const dial = P.createElement("div"); dial.className = "pkm-dial";
  dial.innerHTML = `<span class="qui"></span> <span class="txt"></span><i class="suite"></i>`;
  v.appendChild(dial);
  const qui = dial.querySelector(".qui"), txt = dial.querySelector(".txt");
  let tape = null, attendre = null;
  const dire = (html, nom = "", attendSuite = true) => new Promise(ok => {
    clearInterval(tape); dial.classList.add("vu"); dial.classList.remove("attend");
    qui.textContent = nom ? nom.toUpperCase() + " :" : "";

function intro(c, p, rejouer = false) {

  v.innerHTML = `<div class="labo"><img src="${D.scenes}${p.image}" alt="">
      ${p.balls.map(([x, y], i) => `<div class="halo" data-i="${i}" style="left:${x / p.largeur * 100}%;top:${y / p.hauteur * 100}%;
        width:${p.rayon * 2 / p.largeur * 100}%;aspect-ratio:1"></div>
        <div class="zone" data-i="${i}" style="left:${x / p.largeur * 100}%;top:${y / p.hauteur * 100}%;width:${p.rayon * 3 / p.largeur * 100}%;aspect-ratio:1"></div>`).join("")}
    </div><div class="noir"></div><div class="blanc"></div><button class="pkm-passer">✕</button>`;
  P.body.appendChild(v);
  const labo = v.querySelector(".labo"), {dire: parler} = dialogue(v, ".pkm-passer, .zone");
  const dire = (html, attendSuite = true) => parler(html, p.prof, attendSuite);
  const taille = () => { const w = Math.min(PW.innerWidth, PW.innerHeight * p.largeur / p.hauteur);  // l'image en entier, en haut
    labo.style.width = w + "px"; labo.style.height = w * p.hauteur / p.largeur + "px"; };
  taille(); PW.addEventListener("resize", taille);
  requestAnimationFrame(() => setTimeout(() => v.querySelector(".noir").style.opacity = 0, 80));
  let fini = false, choisie = null;
  // La sortie : vers l'ouverture en 3D, on plonge dans la Poké Ball choisie (zoom + flash blanc), puis elle tombe,
  // gigote et s'ouvre ; ✕ : simple fondu
  const fin = suite => { if (fini) return; fini = true; PW.removeEventListener("resize", taille); v.style.transition = "opacity .45s";
    if (!suite) { v.style.opacity = 0; setTimeout(() => v.remove(), 450); return; }
    if (choisie !== null) { const [x, y] = p.balls[choisie];
      labo.style.transformOrigin = `${x / p.largeur * 100}% ${y / p.hauteur * 100}%`; labo.style.transform = "translateX(-50%) scale(4)"; }
    SONS.montee(.7);
    setTimeout(() => { v.querySelector(".blanc").style.opacity = 1; }, 380);
    setTimeout(() => { ouvrir(c, rejouer, true); v.style.opacity = 0; setTimeout(() => v.remove(), 450); }, 850); };
  v.querySelector(".pkm-passer").onclick = () => fin(false);

  (async () => {
    await new Promise(r => setTimeout(r, 1100));
    // le début reprend celui de Pokémon Rouge / Bleu
    await dire("Bienvenue dans le monde magique des Pokémon !");
    await dire(`Mon nom est ${p.prof} ! Les gens m'appellent souvent le Prof Pokémon !`);
    await dire(`Enchanté, ${nomDresseur()} ! Ton aventure Pokémon commence aujourd'hui !`);
    await dire("Ici, à " + p.region + ", chaque pas que tu fais te rapproche de nouveaux Pokémon !");
    await dire(`Sur cette table, il y a trois Poké Balls : ${noms[0]}, ${noms[1]} et ${noms[2]}… Mais j'ai oublié qui est dans laquelle !`);
    await dire("Choisis-en une. Le Pokémon qu'elle contient sera le tien !", false);
    v.classList.add("choix");
    const i = await new Promise(ok => v.querySelectorAll(".zone").forEach(z => z.onclick = () => ok(+z.dataset.i)));
    v.querySelectorAll(".zone").forEach(z => z.onclick = null);
    v.querySelectorAll(".halo").forEach(h => h.classList.toggle("loin", +h.dataset.i !== i));
    SONS.clic(); vibre([15, 40, 15]);
    // la ball choisie saute : c'est le morceau de l'image où elle est dessinée qui bouge, et un morceau de table vide
    // la remplace dessous
    const [x, y] = p.balls[i], r = p.rayon, morceau = (cx, cy, rr) => `width:${rr * 2 / p.largeur * 100}%;aspect-ratio:1;
      background-image:url('${D.scenes}${p.image}');background-size:${p.largeur / (2 * rr) * 100}% ${p.hauteur / (2 * rr) * 100}%;
      background-position:${(cx - rr) / (p.largeur - 2 * rr) * 100}% ${(cy - rr) / (p.hauteur - 2 * rr) * 100}%;`;
    const trou = P.createElement("div"), b = P.createElement("div");
    trou.style.cssText = `position:absolute;transform:translate(-50%,-50%);left:${x / p.largeur * 100}%;top:${y / p.hauteur * 100}%;
      image-rendering:pixelated;${morceau(p.table[0], p.table[1], r + 2)}`;
    b.className = "ballc bouge";
    b.style.cssText = `left:${x / p.largeur * 100}%;top:${y / p.hauteur * 100}%;${morceau(x, y, r)}`;
    labo.append(trou, b);
    choisie = i; setTimeout(() => { SONS.rebond(); vibre(15); }, 450);
    await dire("Ah ! Tu as choisi celle-ci ? Excellent choix ! Allez, ouvre-la vite !");
    fin(true);
  })().catch(() => {});
}

    projecteur() { timbale(0, 31, .55); bruitage(0, .35, {vol: .28, f: 900, type: "lowpass"}); tinter(.02, 220, .03, 1.2); },
    roulement(dur) { for (let t = 0, k = 0; t < dur; k++) { const u = t / dur; timbale(t, 31, .08 + .32 * u * u); t += .11 - .07 * u; }
      bruitage(0, dur + .05, {vol: .16, f: 5000, type: "highpass", att: dur}); nappe(55, 0, dur + .2, .03); nappe(62, 0, dur + .2, .02); },
    revelation() {
      const s = ok(); if (s) { const a = s.a, t = a.currentTime, o = a.createOscillator(), g = a.createGain();
        o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.4); g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
        o.connect(g).connect(s.entree); o.start(t); o.stop(t + 1.7); }
      bruitage(0, 2.4, {vol: .3, f: 7000, type: "highpass"}); bruitage(0, .5, {vol: .4, f: 400, type: "lowpass"});
      [48, 55, 60, 64, 67].forEach(n => cuivre(n, 0, 1.5, .05)); tinter(.05, 1568, .07, 2.4); tinter(.25, 2093, .04, 2);
    },
    vol() { bruitage(0, .7, {vol: .2, f: 500, f2: 4200, type: "bandpass", q: 2}); },
    clic() { tinter(0, 2637, .09, .5); tinter(.06, 3520, .05, .4); bruitage(0, .06, {vol: .2, f: 6000, type: "highpass"}); },
    fanfare() {  // un air de victoire original (do majeur) : appel, montée, accord final
      const B = .17;
      [[67, 0, B * .8], [72, B, B * .8], [76, 2 * B, B * .8], [79, 3 * B, B * 3.4], [76, 7 * B, B * .9], [79, 8 * B, B * .9], [81, 9 * B, B * 1.8],
       [79, 11 * B, B * .9], [84, 12 * B, B * 9]].forEach(([n, t, d]) => { cuivre(n, t, d, .075); cuivre(n - 12, t, d, .045); });
      [[[60, 64, 67], 3 * B, B * 4], [[65, 69, 72], 7 * B, B * 4], [[48, 55, 60, 64, 67, 72], 12 * B, B * 9]].forEach(([ns, t, d]) => ns.forEach(n => cuivre(n - 12, t, d, .035)));
      timbale(3 * B, 36, .5); timbale(7 * B, 41, .4); for (let k = 0; k < 8; k++) timbale(9 * B + k * B * 3 / 8, 43, .12 + k * .03);
      timbale(12 * B, 36, .7); bruitage(12 * B, 3, {vol: .26, f: 6500, type: "highpass"});
      for (let k = 0; k < 10; k++) tinter(12 * B + .1 + k * .09, 2093 * Math.pow(2, (k % 5) / 12), .025, .9);
    },
  };
})();

// ---------- La scène du badge ----------
function sceneBadge(n, c, rejouer = false) {
  const pause = ms => new Promise(r => setTimeout(r, ms));
  installerStyle("pkm2-badge-style", STYLE_BADGE); preparerScene(); salle();
  const lieu = LIEUX.filter(l => l.arene)[n - 1], a = lieu.arene, ch = CHAMPIONS[n], ligue = !a.type;
  const couleur = ligue ? "#E0B040" : COUL[a.type], src = ligue ? IC.ligue : IMG.badge(a.image);
  const ville = lieu.nom.replace(" (retour)", "").replace(" et Parc Safari", "");
  const v = P.createElement("div"); v.id = "pkm-badge"; v.style.setProperty("--c", couleur);
  const lettres = t => [...t].map((l, i) => `<span style="animation-delay:${i * .045}s">${l === " " ? "&nbsp;" : l}</span>`).join("");
  const nomBadge = ligue ? "MAÎTRE DE LA LIGUE" : a.badge.toUpperCase();
  const deja = LIEUX.filter(l => l.arene && l.arene.image);
  v.innerHTML = `<div class="decor"></div><div class="teinte"></div><canvas class="air"></canvas><div class="spot"></div>
    <div class="champ"><div class="ombre"></div><canvas></canvas></div>
    <div class="halo"></div><div class="charge"></div><div class="onde"></div><div class="onde o2"></div>
    <div class="badge"></div>
    <div class="nom-badge"><b>${lettres(nomBadge)}</b><small>Touche ${ligue ? "le trophée" : "le badge"} pour le prendre</small></div>
    ${ligue ? "" : `<div class="etui"><div class="boite"><div class="velours">${deja.map((l, i) =>
      `<div class="case ${i + 1 === n ? "ici" : ""}">${i + 1 < n && (V.badges[i + 1] || rejouer) ? `<img data-badge="${IMG.badge(l.arene.image)}" src="${IMG.badge(l.arene.image)}">` : ""}</div>`).join("")}</div>
      <div class="couvercle"><div class="embleme"></div><span>ÉTUI À BADGES</span></div><div class="fermoir"></div></div></div>`}
    <div class="cine h"></div><div class="cine b"></div>
    <div class="titre-arene"><div class="ligne"></div><b>${ligue ? "LIGUE POKÉMON" : `ARÈNE ${/^[AEIOUÉ]/.test(ville) ? "D'" : "DE "}${ville.toUpperCase()}`}</b>
      <small>${ligue ? "Plateau Indigo · le Maître" : `${icoType(a.type)} Champion${/^(Ondine|Erika|Morgane)$/.test(ch.nom) ? "ne" : ""} ${ch.nom} · type ${a.type}`}</small></div>
    <div class="flash"></div><div class="noir"></div><div class="blanc"></div><button class="pkm-passer">✕</button>`;
  P.body.appendChild(v);
  // le décor : la ville sur la carte, en grand
  const ox = lieu.x / KC, oy = lieu.y / KC, f = Math.max(PW.innerWidth, PW.innerHeight) * 2.4 / V.carte.largeur, deco = v.querySelector(".decor");
  deco.style.backgroundImage = `url('${D.carte}')`; deco.style.backgroundSize = `${V.carte.largeur * f}px auto`;
  deco.style.backgroundPosition = `${PW.innerWidth * .56 - ox * f}px ${PW.innerHeight * .4 - oy * f}px`;
  const air = airAnime(v.querySelector("canvas.air"), ligue ? "Ligue" : a.type);
  const cv = v.querySelector(".champ canvas"), anim = championAnime(cv, ch.sprite);
  badgesPropres(v);
  const bp = badgePropre(src, !ligue);
  const {dire, cacher} = dialogue(v, ".pkm-passer, .badge");
  let fini = false;
  const stop = () => { anim.stop(); air.stop(); };
  const fin = suite => { if (fini) return; fini = true; stop();
    if (!suite || !c) { v.style.transition = "opacity .5s"; v.style.opacity = 0; setTimeout(() => v.remove(), 500); return; }
    SONS.montee(.7); v.querySelector(".blanc").style.opacity = 1;
    setTimeout(() => { ouvrir(c, rejouer, true); v.style.transition = "opacity .45s"; v.style.opacity = 0; setTimeout(() => v.remove(), 450); }, 650); };
  v.querySelector(".pkm-passer").onclick = () => fin(false);
  const eclats = (x, y, nb, cols = ["#FFE27A", "#fff", couleur]) => { for (let i = 0; i < nb; i++) { const e = P.createElement("div"); e.className = "eclat";
    const ang = i / nb * Math.PI * 2 + Math.random() * .3, d = 50 + Math.random() * 80;
    e.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d}px;background:${cols[i % cols.length]}`;
    v.appendChild(e); setTimeout(() => e.remove(), 950); } };
  const scintille = () => {  // de petites étoiles s'allument autour du badge
    if (fini || !v.isConnected || !v.classList.contains("boom")) return;
    const r = v.querySelector(".badge").getBoundingClientRect(), s = P.createElement("div"); s.className = "etoile";
    const ang = Math.random() * 6.28, d = r.width * (.45 + Math.random() * .3);
    s.style.left = r.left + r.width / 2 + Math.cos(ang) * d + "px"; s.style.top = r.top + r.height / 2 + Math.sin(ang) * d + "px";
    v.appendChild(s); setTimeout(() => s.remove(), 1150); setTimeout(scintille, 260 + Math.random() * 380);
  };

  (async () => {
    // 1. Le noir, le titre de l'arène, le décor qui s'allume
    await pause(250); EPIQUE.apparition(); v.classList.add("allume");
    await pause(350); v.classList.add("titre");
    await pause(1700); v.classList.add("haut");
    // 2. Le champion : une silhouette, puis le projecteur
    await pause(700); EPIQUE.projecteur(); v.classList.add("spot-on"); vibre(25);
    await pause(900);
    for (const l of ch.lignes) await dire(l, ch.nom);
    await dire(ligue ? "Tu as conquis la Ligue. Ce trophée est à toi, Maître Pokémon !" : `En reconnaissance de ta victoire, voici le <b>${a.badge}</b> !`, ch.nom);
    cacher();
    // 3. La révélation : roulement de tambour, l'énergie converge, éclair, onde de choc, le badge apparaît en tournant
    const b = await bp, badge = v.querySelector(".badge"); badge.innerHTML = badge3D(b, ligue ? 8 : 16, 22);
    v.classList.add("revele"); await pause(500);
    const rb = badge.getBoundingClientRect(), centre = {x: rb.left + rb.width / 2, y: rb.top + rb.height / 2};
    v.classList.add("charge-on"); air.attirer(centre); EPIQUE.roulement(1.6); vibre([20, 60, 20, 60, 20]);
    await pause(1600); air.attirer(null);
    v.classList.remove("charge-on"); v.classList.add("boom", "secoue"); EPIQUE.revelation(); vibre([60, 40, 120]);
    eclats(centre.x, centre.y, 26);
    badge.querySelector(".tour").animate([{transform: "rotateY(-1440deg) scale(.15)"}, {transform: "rotateY(0deg) scale(1)"}],
      {duration: 1700, easing: "cubic-bezier(.12,.9,.25,1)"});
    setTimeout(() => v.classList.remove("secoue"), 500);
    await pause(1500); badge.classList.add("calme"); scintille();
    v.querySelector(".nom-badge").classList.add("vu"); EPIQUE.clic();
    await pause(900); v.querySelector(".nom-badge").classList.add("aide");
    // 4. On touche le badge : l'étui s'ouvre, le badge vole dans son alvéole
    await new Promise(ok => { badge.onclick = ok; });
    badge.onclick = null; vibre(15); EPIQUE.clic();
    v.querySelector(".nom-badge").style.opacity = 0;
    const etui = v.querySelector(".etui");
    if (etui) {
      etui.classList.add("vu"); await pause(650); etui.classList.add("ouvert"); EPIQUE.vol(); await pause(700);
      const ici = etui.querySelector(".case.ici"), cible = ici.getBoundingClientRect(), r = badge.getBoundingClientRect();
      const dx = cible.left + cible.width / 2 - (r.left + r.width / 2), dy = cible.top + cible.height / 2 - (r.top + r.height / 2);
      badge.classList.remove("calme"); badge.classList.add("vole"); EPIQUE.vol();
      badge.style.transform = `translate(${dx}px, ${dy}px) scale(${cible.width * .78 / r.width})`;
      badge.querySelector(".tour").animate([{transform: "rotateY(0) rotateX(0)"}, {transform: "rotateY(720deg) rotateX(20deg)"}, {transform: "rotateY(720deg) rotateX(0)"}],
        {duration: 1000, easing: "ease-in-out"});
      await pause(1000);
      ici.classList.remove("ici"); ici.classList.add("pose"); ici.innerHTML = `<img src="${b.face}">`; badge.style.opacity = 0;
      v.classList.remove("boom"); EPIQUE.clic(); vibre([40, 50, 90]);
      eclats(cible.left + cible.width / 2, cible.top + cible.height / 2, 18);
    } else {  // la Ligue : une pluie d'or
      badge.classList.remove("calme");
      for (let i = 0; i < 70; i++) { const k = P.createElement("div"); k.className = "confetti";
        k.style.cssText = `left:${Math.random() * 100}%;background:${["#FFE27A", "#FFFFFF", "#E0B040", "#FFF3C4"][i % 4]};--d:${2 + Math.random() * 2}s;
          --x:${(Math.random() - .5) * 120}px;--r:${Math.random() * 900}deg;animation-delay:${Math.random() * .8}s`; v.appendChild(k); }
    }
    await pause(250); EPIQUE.fanfare();
    await pause(400);
    await dire(ligue ? `${nomDresseur()} est le nouveau <b>Maître de la Ligue Pokémon</b> !` : `${nomDresseur()} obtient le <b>${a.badge}</b> !`);
    if (!c) return fin(false);
    await dire(ligue ? "Et voici ta récompense : une <b>Master Ball</b> ! Un Pokémon légendaire t'attend à l'intérieur…"
      : `Et prends aussi ceci : une <b>Hyper Ball</b> ! Un Pokémon de type ${a.type} t'attend à l'intérieur.`, ch.nom);
    fin(true);
  })().catch(() => {});
}

    : `<div class="f ${sh ? "sh" : ""}"><b>${sh ? `${ico("shiny", "p brille")} Shiny` : "Normal"}</b><div class="trou">${sh ? ico("shiny", "g brille") : "?"}</div>

      const sh = e.dataset.s === "1";

    fe.style.transition = ""; if (d > 110) fermer(); else fe.style.transform = ""; });
}

  document.getElementById("barre").innerHTML = `<div class="filigrane">${ballSVG("poke")}</div>

      <div class="puces">${b.sources.length || (b.bonus || []).length ? b.sources.map(([i, n, p]) => `<span class="puce">${i} ${n} <b>+${p}</b></span>`).join("")

// La pesée de la semaine (29/10) : 3 pesées le matin du lundi au dimanche = une Poké Ball ; et la dernière pesée
// comparée à des Pokémon (poids officiels du Pokédex), une combinaison différente chaque jour
function comparerPokemon(kg, graine) {
  let s = [...graine].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 2147483647, 7) || 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const tous = Object.entries(D.poids).map(([n, w]) => [+n, w]).filter(([, w]) => w >= .5 && w <= kg);
  let meilleur = null;
  for (let essai = 0; essai < 600; essai++) {
    let reste = kg; const choix = [];
    for (let k = 0; k < 3 && reste > .3; k++) {
      const ok = tous.filter(([n, w]) => w <= Math.min(reste * 1.02, k ? kg : kg * .6) && !choix.some(c => c[0] === n));
      if (!ok.length) break;
      const [n, w] = ok[Math.floor(rnd() * ok.length)], fois = Math.max(1, Math.floor(rnd() * Math.min(4, Math.floor(reste / w + .02))) + 1);
      const f = Math.min(fois, Math.floor(reste / w + .02)) || 1; choix.push([n, f, w]); reste -= f * w;
    }
    const nb = choix.reduce((t, c) => t + c[1], 0), ecart = Math.abs(reste);
    if (nb > 6) continue;
    const note = ecart / kg + (nb < 2 ? .05 : nb > 4 ? .01 : 0) + rnd() * .012;  // 2 à 4 Pokémon : plus drôle
    if (ecart / kg < .015 && (!meilleur || note < meilleur.note)) meilleur = {note, choix};
  }
  return meilleur ? meilleur.choix : null;
}

// ---------- Le voyage dans Kanto ----------
let lieuVu = null;  // le lieu touché sur la carte (sinon : là où l'on est)
// Le chemin parcouru entre deux positions (en points) : des bouts de tracé, chacun avec sa façon de voyager
function morceau(pts, a, b) {  // la partie d'un tracé entre les fractions a et b de sa longueur
  const L = longueur(pts), da = L * a, db = L * b, out = [];
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], l = Math.hypot(x1 - x0, y1 - y0), s1 = s + l;
    const at = d => { const t = l ? (d - s) / l : 0; return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]; };
    if (s1 >= da && s <= db) {
      if (!out.length) out.push(at(Math.max(da, s)));
      if (s1 <= db) out.push([x1, y1]); else { out.push(at(db)); break; }
    }
    s = s1;
  }
  return out.length ? out : [pts[0]];
}
function trajet(p0, p1) {
  const L = LIEUX, r = [];
  for (let k = 1; k < L.length; k++) {
    const d0 = L[k - 1].dist, d1 = L[k].dist, a = Math.max(p0, d0), b = Math.min(p1, d1);
    if (b > a) r.push({pts: morceau(TRACE[k], (a - d0) / (d1 - d0), (b - d0) / (d1 - d0)), mode: L[k].mode, k});
  }
  return r;
}
function poseA(p) {  // où est le dresseur quand il en est à p points, et comment il voyage
  const L = LIEUX, k = L.findIndex((l, j) => j && p > L[j - 1].dist && p < l.dist);
  const t = trajet(0, p), der = t.length ? t[t.length - 1].pts : [[L[0].x, L[0].y]], [x, y] = der[der.length - 1];
  return {x, y, dir: direction(t.flatMap(m => m.pts)), enRoute: k, mode: k > 0 ? L[k].mode : "route",
          arrete: !!(V.defi && V.defi.arrive) && p >= V.pos};
}
const pt = pts => pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
function traitFait(m, T) {  // un bout de chemin parcouru : rouge bordé de blanc (tirets en vol, en mer, sous terre)
  const tiret = m.mode === "route" ? "" : `stroke-dasharray="5 3.5"`;
  return `<polyline points="${pt(m.pts)}" fill="none" stroke="#fff" stroke-width="${5 * T}" stroke-linecap="round" stroke-linejoin="round" opacity=".9" ${tiret}/>
    <polyline points="${pt(m.pts)}" fill="none" stroke="#E8382F" stroke-width="${2.8 * T}" stroke-linecap="round" stroke-linejoin="round" ${tiret}/>`;
}
// La carte ; depuis = la position (en points) d'où le dresseur repart en marchant jusqu'à aujourd'hui (voyagerDepuis)
function svgKanto(depuis = V.pos) {
  const T = ZC > 1 ? 1.25 : 1;  // carte zoomée : traits, points et noms un peu plus grands (il y a la place)
  const L = LIEUX;
  // le chemin : à faire = petits points sombres ; fait = rouge bordé de blanc ; le bout gagné depuis la dernière
  // visite se dessine pendant que le dresseur avance (#chemin-anim)
  const traits = trajet(depuis, Infinity).map(x => `<polyline points="${pt(x.pts)}" fill="none" stroke="#1B2A4A" stroke-width="${1.8 * T}"
      stroke-dasharray="0.1 ${4.2 * T}" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`).join("") +
    trajet(0, depuis).map(x => traitFait(x, T)).join("") + `<g id="chemin-anim"></g>`;
  const col = collection();
  const noeuds = L.map((l, k) => {
    if (k === 18) return "";  // Jadielle (retour) : même endroit que Jadielle
    const complet = l.pokemon.every(n => col[n]) && (k !== 2 || L[18].pokemon.every(n => col[n]));
    const k2 = k === 2 ? 18 : k, ar = L[k2].arene;  // Jadielle porte l'arène de Giovanni
    const num = ar ? L.filter((x, j) => x.arene && j <= k2).length : 0, gagne = num && V.badges[num];
    const atteint = V.pos >= l.dist, vise = V.defi && V.defi.lieu === k2;
    const ville = !!ar || /Bourg|Jadielle|Lavanville|Céladopole|Safrania|Azuria|Carmin|Parmanie|Cramois|Argenta|Plateau/.test(l.nom);
    const r = (ville ? 5.2 : 3.6) * T, bas = l.y > HC - 30 || l.nom === "Plateau Indigo";
    return `<g class="lieu" data-k="${k}">
      <circle class="choix" cx="${l.x}" cy="${l.y}" r="${r + 3.5}" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2"/>
      ${vise ? `<circle class="vise" cx="${l.x}" cy="${l.y}" r="${r + 2}" fill="none" stroke="#FFCB05" stroke-width="2"/>` : ""}
      <circle class="point" cx="${l.x}" cy="${l.y}" r="${r}" fill="${atteint ? (ville ? "#E8382F" : "#FFB020") : "#7C8AA8"}" stroke="#fff" stroke-width="1.6"/>
      ${ville ? `<circle cx="${l.x}" cy="${l.y}" r="${r * .38}" fill="#fff"/>` : ""}
      ${ar && !vise ? medaille(l, ar, gagne, bas) : ""}
      ${complet ? `<text x="${l.x - 12}" y="${l.y - 4}" font-size="9" style="fill:#FFD84A">★</text>` : ""}
      ${ville ? `<text class="nom" x="${l.nom === "Plateau Indigo" ? l.x + 8 : l.x}" y="${l.nom === "Plateau Indigo" ? l.y - 6 : l.y + (bas ? -9 : 14) * T}" font-size="${8 * T}"
        text-anchor="${l.nom === "Plateau Indigo" ? "start" : "middle"}">${l.nom.replace(" et Parc Safari", "").replace("-sur-Mer", "")}</text>` : ""}
      <circle cx="${l.x}" cy="${l.y}" r="13" fill="transparent"/></g>`;
  }).join("");
  // le dresseur : posé par-dessus la carte en HTML (heros)
  POSE = poseA(depuis);
  return `<svg class="carte-kanto" viewBox="0 0 ${LARG} ${HC.toFixed(1)}">
    <defs><radialGradient id="pk-or" cx=".45" cy=".35" r=".7"><stop offset="0" stop-color="#FFF7CF"/><stop offset=".55" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#C08A00"/></radialGradient></defs>
    <image href="${D.carte}" x="0" y="0" width="${LARG}" height="${HC.toFixed(1)}" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    ${traits}
    ${noeuds}
  </svg>`;
}

// ---------- Sacha sur la carte ----------
// Ses images de Pokémon Rouge Feu (projet public pret/pokefirered, version figée) : 9 images de 16×32 (marche) ou 32×32
// (vélo, surf) : 0 face, 1 dos, 2 profil gauche (à droite : retourné), puis 2 pas pour chaque sens.
const SACHA = "https://raw.githubusercontent.com/pret/pokefirered/ce6406d8c2eaf46d543c8a2606de0c3cb1951982/graphics/object_events/pics/people/";

function direction(pts) {  // le sens de la marche : d'après le dernier bout de chemin parcouru
  for (let i = pts.length - 1; i > 0; i--) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    if (Math.hypot(dx, dy) > .5) return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "droite" : "gauche") : (dy > 0 ? "bas" : "haut");
  }

}
function sacha(feuille, dir, marche, large = 1) {  // un div animé (image découpée) ; large = 2 pour les images 32×32
  const f = PAS[dir];
  return `<div class="sacha ${dir === "droite" ? "miroir" : ""}" data-feuille="${feuille}" data-pas="${marche ? f.join(",") : f[0]}"
    style="width:${large * 4.6}%;aspect-ratio:${large * 16}/32;background-image:url('${SACHA}${feuille}.png');
      background-size:900% 100%;background-position:${f[0] / 8 * 100}% 0"></div>`;
}

// à mettre côté serveur avec le mode multijoueur) ----------
const COULEURS_PEAU = {  // 3 tons de la peau de Sacha : clair, moyen, ombre

  "Rouge": [[106, 41, 41], [197, 57, 57], [255, 106, 74]], "Bleu": [[30, 46, 110], [56, 96, 200], [112, 160, 255]],

  "Jean": [[57, 57, 123], [115, 164, 197]], "Noir": [[28, 28, 38], [78, 78, 94]], "Gris": [[66, 66, 78], [148, 148, 164]],
  "Beige": [[116, 92, 58], [204, 178, 128]], "Kaki": [[52, 66, 34], [122, 142, 82]], "Bordeaux": [[84, 24, 34], [168, 62, 78]],
  "Blanc": [[108, 108, 124], [232, 232, 242]]};
const PEAU_SACHA = COULEURS_PEAU["Claire"], TISSU_SACHA = COULEURS_TISSU["Rouge"], JEAN_SACHA = COULEURS_PANTALON["Jean"];
let DRESSEUR = {nom: "", peau: "Claire", casquette: "Rouge", veste: "Rouge", pantalon: "Jean"};

const IMAGES_DRESSEUR = new Map();  // feuille + couleurs -> image recoloriée (data URL)
function feuilleColoree(feuille, d = DRESSEUR) {
  const cle = [feuille, d.peau, d.casquette, d.veste, d.pantalon].join("|");
  if (!IMAGES_DRESSEUR.has(cle)) IMAGES_DRESSEUR.set(cle, new Promise(ok => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const cv = document.createElement("canvas"), W = cv.width = im.naturalWidth, H = cv.height = im.naturalHeight;
        const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0);
        const img = ctx.getImageData(0, 0, W, H), px = img.data, fw = W / 9;
        const memes = (i, c) => px[i] === c[0] && px[i + 1] === c[1] && px[i + 2] === c[2];
        const peau = COULEURS_PEAU[d.peau], cas = COULEURS_TISSU[d.casquette], ves = COULEURS_TISSU[d.veste];
        const pan = COULEURS_PANTALON[d.pantalon] || JEAN_SACHA;
        for (let f = 0; f < 9; f++) {
          // la casquette : les 7 premières lignes dessinées de chaque image ; le rouge en dessous, c'est la veste ; le bleu
          // foncé des cheveux est aussi celui du jean : le pantalon commence 15 lignes sous le haut de la casquette
          let haut = H;
          for (let y = 0; y < H && haut === H; y++) for (let x = f * fw; x < (f + 1) * fw; x++) if (px[(y * W + x) * 4 + 3]) { haut = y; break; }
          for (let y = 0; y < H; y++) for (let x = f * fw; x < (f + 1) * fw; x++) {
            const i = (y * W + x) * 4; if (!px[i + 3]) continue;

              if (memes(i, TISSU_SACHA[k])) { px.set((y < haut + 7 ? cas : ves)[k], i); break; }
              if (k < 2 && y >= haut + 15 && memes(i, JEAN_SACHA[k])) { px.set(pan[k], i); break; }
            }

        ctx.putImageData(img, 0, 0); ok(cv.toDataURL());

    };

}

function apercuDresseur(cv, d = DRESSEUR, marche = true) {

  const charger = dd => feuilleColoree("red_normal", dd).then(src => { const im = new Image(); im.onload = () => { img = im; dessin(); }; im.src = src; });
  const dessin = () => { if (!img) return; const k = marche ? [0, 3, 0, 4][t++ % 4] : 0;
    ctx.clearRect(0, 0, 16, 32); ctx.drawImage(img, k * 16, 0, 16, 32, 0, 0, 16, 32); };
  charger(d);

// Le prochain champion, debout à côté de son arène sur la carte
// Le badge de chaque arène sur la carte, dans une médaille : à gagner = fond sombre et liseré blanc en pointillés ;
// gagné = médaille d'or qui brille, avec un éclat. La prochaine arène : le portrait du champion (chefCarte).
const posMedaille = (l, bas) => l.nom === "Plateau Indigo" ? [l.x - 3, l.y - 15] : bas ? [l.x + 12, l.y] : [l.x + 10, Math.max(l.y - 10, 9)];
function medaille(l, ar, gagne, bas) {
  const [x, y] = posMedaille(l, bas), src = ar.image ? IMG.badge(ar.image) : IC.ligue;
  const img = s => `<image href="${src}" x="${x - s / 2}" y="${y - s / 2}" width="${s}" height="${s}" style="image-rendering:${ar.image ? "auto" : "pixelated"}"/>`;
  return gagne
    ? `<g class="medaille gagne"><circle cx="${x}" cy="${y}" r="8.8" fill="url(#pk-or)" stroke="#FFF3B0" stroke-width="1.3"/>${img(12.5)}
        <path class="eclat" d="M${x + 7},${y - 11} l1.1,2.6 2.6,1.1 -2.6,1.1 -1.1,2.6 -1.1,-2.6 -2.6,-1.1 2.6,-1.1z" fill="#fff"/></g>`
    : `<g class="medaille"><circle cx="${x}" cy="${y}" r="7.8" fill="#16213A" fill-opacity=".88" stroke="#fff" stroke-width="1.2"
        stroke-dasharray="2.3 1.5"/>${img(10.5)}</g>`;
}
function chefCarte() {
  const d = V.defi; if (!d) return "";
  const l = LIEUX[d.lieu], a = l.arene, ch = CHAMPIONS[d.numero];
  // son portrait dans une médaille à côté de sa ville (à droite du dresseur), avec le badge à gagner ;
  // un halo blanc l'entoure jusqu'au premier toucher
  let vu = false; try { vu = !!localStorage.getItem(`pkm_chef_vu_${R.partie}_${d.numero}`); } catch (e) {}
  const x = l.nom === "Plateau Indigo" ? l.x : l.x + 32, y = l.nom === "Plateau Indigo" ? l.y - 22 : Math.max(l.y - 14, 23);
  return `<div class="chef ${vu ? "" : "nouveau"}" data-n="${d.numero}" style="left:${x / LARG * 100}%;top:${y / HC * 100}%;--c:${a.type ? COUL[a.type] : "#B8860B"}">
    <div class="portrait"><canvas data-sprite="${ch.sprite}" data-fixe="1" data-portrait="1"></canvas></div>
    <img class="bdg" src="${a.image ? IMG.badge(a.image) : IC.ligue}"></div>`;
}
function heros(P = POSE) {  // le dresseur à la pose P (poseA) ; .suit = ce qui se déplace avec lui
  if (!P) return "";
  const {x, y, dir, enRoute, arrete, mode} = P;
  const pos = `left:${x / LARG * 100}%;top:${y / HC * 100}%`;
  const ombre = `<div class="ombre-heros suit" style="${pos}"></div>`;
  if (mode === "grotte") {  // sous la montagne : on le voit marcher dans une boule de cristal qui avance sur le trait
    const d = dir === "gauche" ? "gauche" : "droite";
    return `<div class="boule suit" style="${pos}"><canvas class="cave" width="64" height="64" data-dir="${d}"></canvas>
      ${sacha("red_normal", d, true)}</div>`;
  }
  if (mode === "vol" || mode === "surf") {  // en vol ou en mer : sur le dos du Pokémon (ou à vélo, en bateau, sur un Lokhlass sauvage)
    const m = monture(mode);
    if (m) return `${ombre}<div class="heros porte suit" style="${pos}">${sacha("red_normal", "bas", false)}
      <img src="${IMG.anim(m.num, m.shiny)}" ${repli(m.num, m.shiny)}></div>`;
    if (mode === "vol" && enMer(enRoute))  // le bateau (l'Océane de Rouge Feu ; image tournée vers la gauche)
      return `<div class="heros navire suit" style="${pos}"><img class="${dir === "droite" ? "miroir" : ""}" src="${NAVIRE}"></div>`;
    return `${ombre}<div class="heros suit" style="${pos}">${sacha(mode === "vol" ? "red_bike" : "red_surf", dir, mode === "vol", 2)}</div>`;
  }
  // à pied : il marche (de dos, immobile, devant une arène dont il attend le badge)
  return `${ombre}<div class="heros suit" style="${pos};z-index:2">${sacha("red_normal", arrete ? "haut" : dir, !arrete)}</div>`;
}
const NAVIRE = SACHA.replace("/people/", "/misc/") + "ss_anne.png";

// L'intérieur de la grotte (dans la boule de cristal) : une bande de pixel art dessinée une fois, qui défile
const GROTTE = (() => {
  const W = 192, H = 64, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); let s = 11;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  // un rocher : ovale à contour sombre, éclairé en haut à gauche (répété de l'autre côté du bord pour boucler)
  const rocher = (cx, cy, rx, ry, [fonce, base, clair]) => [cx, cx - W, cx + W].forEach(X => {
    for (let y = -ry; y <= ry; y++) {
      const w = Math.round(rx * Math.sqrt(1 - (y / (ry + .5)) ** 2));
      px(X - w - 1, cy + y, 2 * w + 2, 1, "#24180F");
      px(X - w, cy + y, 2 * w, 1, y < -ry / 3 ? clair : y > ry / 2 ? fonce : base);
    }
    px(X - Math.round(rx / 2), cy - ry + 1, 2, 1, "#B39575");
  });
  px(0, 0, W, H, "#2A1E15");
  const tons = [["#4A3626", "#6B4F3A", "#86684D"], ["#43311F", "#5E4632", "#7A5E45"], ["#523C2B", "#755A43", "#937457"]];
  for (let y = 12; y < 46; y += 7) for (let x = (y % 14 ? 0 : 8); x < W; x += 14 + Math.floor(rnd() * 6))  // la paroi
    rocher(x + Math.floor(rnd() * 4), y + Math.floor(rnd() * 3), 6 + Math.floor(rnd() * 3), 4, tons[Math.floor(rnd() * 3)]);
  px(0, 0, W, 9, "#1A110B");  // le plafond et ses stalactites
  for (let x = 3; x < W - 8; x += 9 + Math.floor(rnd() * 9)) {
    const h = 6 + Math.floor(rnd() * 10);
    for (let i = 0; i < h; i++) { const w = Math.max(1, Math.round(4 * (1 - i / h))); px(x - w, 8 + i, 2 * w, 1, "#5C4433"); px(x - w, 8 + i, 1, 1, "#8E7054"); }
  }
  px(0, 46, W, 18, "#7E6347"); px(0, 46, W, 1, "#3B2A1C"); px(0, 47, W, 1, "#9A7C5B");  // le sol, avec un chemin plus clair
  px(0, 51, W, 8, "#937455");
  for (let x = 0; x < W; x += 2) if (rnd() < .35) px(x, 48 + Math.floor(rnd() * 15), 1 + Math.floor(rnd() * 2), 1, rnd() < .5 ? "#6B5239" : "#AC8D69");
  for (let x = 6; x < W - 10; x += 28 + Math.floor(rnd() * 22)) rocher(x, 60, 5, 2, tons[1]);  // cailloux devant
  const cristaux = Array.from({length: 6}, () => [Math.floor(rnd() * (W - 8)), 16 + Math.floor(rnd() * 22),
    rnd() < .5 ? ["#5FC8FF", "#C9F1FF"] : ["#B07CFF", "#EBD9FF"], rnd() * 6.28]);
  return {c, W, H, cristaux};
})();
// toutes les boules de cristal visibles : la grotte défile dans le sens de la marche, les cristaux scintillent
(function grotteAnimee(t) {
  document.querySelectorAll("canvas.cave").forEach(cv => {
    const g = cv.getContext("2d"), {c, W, cristaux} = GROTTE, sens = cv.dataset.dir === "gauche" ? -1 : 1;
    const off = (((t / 45) * sens) % W + W) % W;  // ~22 px par seconde
    g.imageSmoothingEnabled = false;
    g.drawImage(c, -Math.floor(off), 0); g.drawImage(c, W - Math.floor(off), 0);
    cristaux.forEach(([x, y, [col, clair], ph]) => {  // un petit groupe de cristaux qui brille
      const X = ((x - off) % W + W) % W, a = .6 + .4 * Math.sin(t / 380 + ph);
      if (X > 70) return;
      g.globalAlpha = a * .3; g.fillStyle = col; g.fillRect(X - 3, y - 3, 10, 10);
      g.globalAlpha = 1; g.fillRect(X, y, 2, 5); g.fillRect(X + 2, y + 2, 2, 3); g.fillRect(X - 2, y + 2, 2, 3);
      g.fillStyle = clair; g.globalAlpha = a; g.fillRect(X, y, 1, 2); g.globalAlpha = 1;
    });
    const lum = g.createRadialGradient(32, 44, 4, 32, 38, 42);  // la lumière de la torche
    lum.addColorStop(0, "rgba(255,190,110,.22)"); lum.addColorStop(.55, "rgba(0,0,0,0)"); lum.addColorStop(1, "rgba(10,5,20,.45)");
    g.fillStyle = lum; g.fillRect(0, 0, 64, 64);
  });
  requestAnimationFrame(grotteAnimee);
})(0);
// Les pas de Sacha : une image toutes les 170 ms
setInterval(() => {
  const t = Math.floor(Date.now() / 170);
  document.querySelectorAll(".sacha[data-pas]").forEach(e => {
    const f = e.dataset.pas.split(","), k = +f[t % f.length];

function infosLieu(k) {
  const l = LIEUX[k], col = collection(), pris = l.pokemon.filter(n => col[n]).length;
  const passe = V.pos >= l.dist, ici = k === V.ici, suite = LIEUX[k + 1], d = V.defi;
  const bloque = d && d.arrive && d.lieu === k;
  const depart = !ici || !suite ? "" : bloque ? "Tu repars après le badge de l'arène."
    : `Étape suivante : ${suite.nom}, dans ${fr(suite.dist - V.pos)} pts (≈ ${Math.max(1, Math.round((suite.dist - V.pos) / D.barre.taille))} barre${suite.dist - V.pos > 150 ? "s" : ""}).`
      + (() => { if (!suite || suite.mode === "route" || bloque) return "";
        if (suite.mode === "grotte") return `<br>${ico(OBJ("escape-rope"), "p")} Par la grotte : tu traverses la montagne à pied jusqu'à ${suite.nom}.`;
        const m = monture(suite.mode);
        return suite.mode === "vol"
          ? (m ? `<br>${ico(IMG.mini(m.num, m.shiny), "rogne")} En vol : <b>${m.nom}</b> t'emmène jusqu'à ${suite.nom}.`
               : enMer(k + 1) ? `<br>${ico("bateau", "p")} Pas encore de Pokémon Vol : tu prends le bateau jusqu'à ${suite.nom}.`
               : `<br>${ico("velo", "p")} Pas encore de Pokémon Vol : tu y vas à vélo.`)
          : `<br>${ico(IMG.mini(m ? m.num : 131, m ? m.shiny : false), "rogne")} En mer : ${m ? `<b>${m.nom}</b> te fait traverser` : "un Lokhlass sauvage te fait traverser"} jusqu'à ${suite.nom}.`; })();
  return `<div class="infos-lieu"><div class="nom">${ico("carte")} ${l.nom}<small>${ici ? "tu es ici" : passe ? "déjà traversé" :
      `dans ${fr(l.dist - V.pos)} pts`}</small></div>
    <div class="petit gris" style="margin-top:3px">${pris === l.pokemon.length ? "★ Lieu complété : tous ses Pokémon sont à toi !"
      : `Pokémon du coin : ${pris} / ${l.pokemon.length} attrapés${l.pokemon.some(n => RARES.has(n)) ? ` · ${ico("rare", "p")} = rare` : ""}`}</div>
    <div class="coin">${l.pokemon.map(n => `<span class="pk"><img class="rogne ${col[n] ? "" : "non"}" data-n="${n}" src="${IMG.mini(n, false)}" loading="lazy"
      title="${col[n] ? PAR_NUM[n].nom : "???"}">${RARES.has(n) ? `<i>${ico("rare", "p")}</i>` : ""}</span>`).join("")}</div>
    ${depart ? `<div class="petit gris" style="margin-top:8px">${depart}</div>` : ""}</div>`;
}

function blocArene() {
  const d = V.defi;
  if (!d) return `<div class="arene"><div class="bdg ligue">${ico("ligue", "g")}</div><div class="q"><div class="t">Champion de Kanto !</div>
      Les 8 badges et la Ligue sont à toi. La suite du voyage (Johto) arrive bientôt.</div></div>`;
  const l = LIEUX[d.lieu], a = l.arene, j = (v, c) => `<div class="jauge"><div class="${v >= c ? "ok" : ""}" style="width:${Math.min(v / c * 100, 100)}%"></div></div>`;
