  const val = v => d.unite === "pas" ? fr(v) : Math.round(v * 10) / 10;
  if (!d.arrive) return "";  // pas encore arrivé : le champion attend sur la carte (le toucher = son défi)
  const image = a.image ? `<img class="bdg" src="${IMG.badge(a.image)}">` : `<div class="bdg ligue">${ico("ligue", "g")}</div>`;
  const qui = a.type ? `Arène ${/^[AEIOUÉ]/.test(a.champion) ? "d'" : "de "}${a.champion} · type ${a.type}` : "Ligue Pokémon · Champion Régis";
  const style = `style="--c:${a.type ? COUL[a.type] : "#B8860B"}"`;
  const manque = Math.max(a.cible - d.valeur, 0);
  return `<div class="arene" ${style}>${image}<div class="q"><div class="t">${qui}</div>
      <div><b>${a.texte}</b></div>${j(d.valeur, a.cible)}<div class="petit">${val(d.valeur)} / ${val(a.cible)} ${nomU}</div>
      ${a.b ? `<div class="ou-b">ou plan B</div><div>${a.b.texte}</div>${j(d.valeur_b, a.b.cible)}<div class="petit">${d.valeur_b} / ${a.b.cible} jours</div>` : ""}
      <div class="reste">${manque ? `Encore ${val(manque)} ${nomU}${a.b ? ` (ou ${Math.max(a.b.cible - d.valeur_b, 0)} jour${a.b.cible - d.valeur_b > 1 ? "s" : ""} d'objectif)` : ""}.
        Tes points comptent toujours pour les Poké Balls ; le voyage reprend après le badge.` : "Défi réussi !"}</div>
      <div class="petit gris">Compté sur les 7 derniers jours depuis ton arrivée (le ${V.defi.depuis ? V.defi.depuis.slice(8) + "/" + V.defi.depuis.slice(5, 7) : "—"}).</div></div></div>`;
}

// Faire glisser la carte zoomée à la souris (au doigt, c'est le défilement normal du navigateur)
let GLISSE = null;
addEventListener("pointermove", e => { const g = GLISSE; if (!g) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (Math.hypot(dx, dy) > 4) g.bouge = true;
  if (g.bouge) { g.vue.scrollLeft = g.l - dx; g.vue.scrollTop = g.t - dy; g.vue.classList.add("glisse"); } });
addEventListener("pointerup", () => { const g = GLISSE; if (!g) return; g.vue.classList.remove("glisse");
  if (g.bouge) setTimeout(() => { if (GLISSE === g) GLISSE = null; }, 0); else GLISSE = null; });

// Le voyage depuis la dernière visite (29/10) : si le dresseur a avancé d'au moins SEUIL_VOYAGE points (ou atteint
// un nouveau lieu) depuis le dernier voyage regardé, un bandeau en haut de l'onglet et un bouton ▶ sur la carte
// assombrie le proposent ; le dresseur attend à l'ancienne place jusqu'au toucher, puis parcourt le chemin. En dessous du
// seuil : il est déjà à sa place, sans rien proposer, et les petits bouts s'additionnent jusqu'au voyage suivant
// (pkm_pos_vu_<partie> = la position du dernier voyage regardé, mise à jour seulement quand on le regarde).
const SEUIL_VOYAGE = 25;
let VOYAGE = null;
function etatVoyage() {
  if (VOYAGE) return VOYAGE;
  let vu = NaN; try { vu = parseFloat(localStorage.getItem(`pkm_pos_vu_${R.partie}`)); } catch (e) {}
  if (TEST && TEST.vu != null) vu = TEST.vu;
  vu = Math.min(isNaN(vu) ? 0 : vu, V.pos);
  const lieux = LIEUX.filter((l, k) => k && l.dist > vu && l.dist <= V.pos).map(l => l.nom.replace(" (retour)", ""));
  const attente = V.pos - vu >= SEUIL_VOYAGE || lieux.length > 0;
  return (VOYAGE = {vu, gain: Math.round(V.pos - vu), lieux, attente});
}
function texteVoyage(v) {
  const der = v.lieux[v.lieux.length - 1], pts = `+${fr(v.gain)} pts`;
  if (!der) return `${pts} depuis ta dernière visite`;
  const ville = /Bourg|Jadielle|Lavanville|Céladopole|Safrania|Azuria|Carmin|Parmanie|Cramois|Argenta/.test(der);
  return `${der === "Plateau Indigo" ? "Tu es arrivé au Plateau Indigo !" : ville ? `Tu es arrivé à ${der} !` : `Nouvelle étape : ${der}`} · ${pts}`;
}
function dessinerBandeauVoyage() {
  const b = document.getElementById("bandeau-voyage"), v = etatVoyage(), badge = aOuvrir().find(estBadge);
  if (badge) {  // un badge qui attend passe avant tout
    const n = numBadge(badge), a = LIEUX.filter(l => l.arene)[n - 1].arene;
    b.innerHTML = `<button class="bandeau-voyage or"><img class="ico g" ${a.image ? `data-badge="${IMG.badge(a.image)}"` : ""} src="${a.image ? IMG.badge(a.image) : IC.ligue}"><span>
      <b>${a.image ? `Tu as gagné le ${a.badge} !` : "Tu as conquis la Ligue !"}</b><small>${CHAMPIONS[n].nom} t'attend pour te le remettre · touche ici</small></span><i></i></button>`;
    b.querySelector("button").onclick = () => lancer(badge); badgesPropres(b);
    return;
  }
  if (!v.attente) { b.innerHTML = ""; return; }
  b.innerHTML = `<button class="bandeau-voyage">${ico("carte", "g")}<span><b>Ton dresseur a avancé !</b>
    <small>${texteVoyage(v)} · voir le voyage</small></span><i></i></button>`;
  b.querySelector("button").onclick = () => { const cv = document.querySelector("#voyage .carte-cadre");
    cv.scrollIntoView({behavior: "smooth", block: "center"}); lancerVoyage(false); };
}
function lancerVoyage(immediat) {  // le toucher : la carte s'éclaire et le dresseur part
  const v = etatVoyage(); if (!v.attente) return;
  v.attente = false;
  if (TEST) TEST.vu = V.pos; else try { localStorage.setItem(`pkm_pos_vu_${R.partie}`, V.pos); } catch (e) {}
  document.getElementById("bandeau-voyage").innerHTML = "";
  const el = document.getElementById("voyage"), att = el.querySelector(".carte-attente");
  if (att) { att.classList.add("part"); setTimeout(() => att.remove(), 450); }
  voyagerDepuis(el, v.vu, CENTRER, immediat); vibre(15);
}
let CENTRER = () => {};
function voyagerDepuis(el, p0, centrer, immediat) {
  const vue = el.querySelector(".carte-vue"), g = el.querySelector("#chemin-anim"), ancre = el.querySelector(".heros-ancre");
  const T = ZC > 1 ? 1.25 : 1, duree = Math.min(4500, 1400 + (V.pos - p0) * 6);
  let suivre = true, cle = "", t0 = null;
  ["pointerdown", "wheel", "touchstart"].forEach(ev => vue.addEventListener(ev, () => (suivre = false), {once: true, passive: true}));
  // la carte doit être à l'écran (l'onglet est long, et la page Streamlit est dans un cadre) : on attend qu'elle y soit
  const visible = () => { try {
    const f = window.frameElement, r = vue.getBoundingClientRect(), haut = (f ? f.getBoundingClientRect().top : 0) + r.top;
    const H = f ? parent.innerHeight : innerHeight; return haut < H * .75 && haut + r.height > H * .25;
  } catch (e) { return true; } };
  const pas = now => {
    if (!document.body.contains(g)) return;  // la carte a été redessinée (zoom…) : rien à finir
    if (t0 === null) { if (!immediat && !visible()) return setTimeout(() => requestAnimationFrame(pas), 250); t0 = now + (immediat ? 150 : 600); }
    const u = Math.max(0, Math.min(1, (now - t0) / duree)), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const p = u >= 1 ? V.pos : p0 + (V.pos - p0) * e, P = poseA(p);
    g.innerHTML = trajet(p0, p).map(x => traitFait(x, T)).join("");
    POSE = P;
    const k = [P.mode, P.dir, P.enRoute, P.arrete].join();
    if (k !== cle) { cle = k; ancre.innerHTML = heros(P); colorerDresseur(ancre); }
    else ancre.querySelectorAll(".suit").forEach(x => { x.style.left = P.x / LARG * 100 + "%"; x.style.top = P.y / HC * 100 + "%"; });
    if (suivre) centrer(P);
    if (u < 1) return requestAnimationFrame(pas);
    // arrivé à une arène pendant ce voyage : le champion se présente et lance son défi
    const d = V.defi;
    if (d && d.arrive && p0 < LIEUX[d.lieu].dist) setTimeout(() => { const ch = el.querySelector(".chef");
      if (ch && document.body.contains(ch)) { suivre && centrer(P); ch.click(); } }, 450);
  };
  requestAnimationFrame(pas);
}

function dessinerVoyage() {
  const el = document.getElementById("voyage"), k = lieuVu ?? V.ici;
  const VY = etatVoyage(), depuis = VY.attente ? VY.vu : V.pos;
  const badges = LIEUX.filter(l => l.arene).map((l, i) => {
    const n = i + 1, quand = V.badges[n];
    return l.arene.image ? `<div class="${quand ? "oui" : "non"}" data-n="${n}" title="${l.arene.badge}"><img data-badge="${IMG.badge(l.arene.image)}" src="${IMG.badge(l.arene.image)}"></div>`
      : `<div class="${quand ? "oui" : "non"}" data-n="${n}" title="Ligue"><img src="${IC.ligue}" style="image-rendering:pixelated"></div>`;
  }).join("");
  el.innerHTML = `<div class="entete"><span class="titre">${ico("carte")} Voyage dans Kanto</span>
      <span class="ou">Étape ${V.ici + 1} / ${LIEUX.length} · ${Math.floor(V.pos / V.total * 100)} %</span></div>
    <div class="avance"><div style="width:0"></div></div>
    ${blocArene()}<div class="carte-cadre" style="--ar:${V.carte.largeur}/${V.carte.hauteur}"><div class="carte-vue" style="aspect-ratio:${V.carte.largeur}/${V.carte.hauteur}">
      <div class="carte-wrap" style="width:${ZC * 100}%;--z:${ZC}">${svgKanto(depuis)}${chefCarte()}<div class="heros-ancre">${heros()}</div></div></div>
      ${VY.attente ? `<button class="carte-attente"><span class="play"></span><b>Voir ton voyage</b><small>${texteVoyage(VY)}</small></button>` : ""}
</div>
    ${infosLieu(k)}
    <div class="boite-badges">${badges}</div>`;
  requestAnimationFrame(() => setTimeout(() => el.querySelector(".avance div").style.width = V.pos / V.total * 100 + "%", 60));
  // la carte zoomée : centrée sur le dresseur ; on la fait glisser au doigt (ou à la souris sur le PC)
  const vue = el.querySelector(".carte-vue"), wrap = el.querySelector(".carte-wrap");
  const centrer = (P = POSE) => { if (!P || ZC <= 1) return;
    vue.scrollLeft = P.x / LARG * wrap.offsetWidth - vue.clientWidth / 2;
    vue.scrollTop = P.y / HC * wrap.offsetHeight - vue.clientHeight * .55; };
  centrer(); requestAnimationFrame(() => centrer());
  CENTRER = centrer;
  const att = el.querySelector(".carte-attente");
  if (att) att.onclick = () => lancerVoyage(true);
  dessinerBandeauVoyage();
  vue.addEventListener("click", e => { if (GLISSE && GLISSE.bouge) { e.stopPropagation(); e.preventDefault(); } }, true);
  const bz = el.querySelector(".carte-zoom");
  if (bz) bz.onclick = () => { const tout = ZC > 1;
    try { localStorage.setItem("pkm_carte_vue", tout ? "tout" : "zoom"); } catch (e) {}
    echelle(tout ? 1 : V.carte.zoom); dessinerVoyage(); vibre(10); };
  badgesPropres(el.querySelector(".boite-badges"));
  const brancher = () => { el.querySelectorAll(".coin img").forEach(i => i.onclick = () => fiche(PAR_NUM[i.dataset.n])); rognerImages(el); };
  // toucher un lieu : il s'allume sur la carte et ses Pokémon s'affichent juste dessous (sans redessiner la carte)
  const choisir = k => el.querySelectorAll(".lieu").forEach(g => g.classList.toggle("choisi", +g.dataset.k === (k === 18 ? 2 : k)));
  choisir(k);
  el.querySelectorAll(".lieu").forEach(g => g.onclick = () => { lieuVu = +g.dataset.k; choisir(lieuVu);
    el.querySelector(".infos-lieu").outerHTML = infosLieu(lieuVu); brancher(); vibre(10); });
  brancher();
  // le champion de la carte : sa pose de base ; il bouge quand on le touche
  const anims = new Map();
  el.querySelectorAll("canvas[data-sprite]").forEach(cv => anims.set(cv, championAnime(cv, cv.dataset.sprite, !!cv.dataset.fixe, !!cv.dataset.portrait)));
  colorerDresseur(el);
  // toucher le champion sur la carte : il parle (bulle), et son arène s'affiche sous la carte
  // la bulle se ferme quand on touche ailleurs sur la carte (ou la bulle elle-même)
  el.querySelector(".carte-cadre").addEventListener("click", e => {
    if (!e.target.closest(".chef")) el.querySelectorAll(".bulle-chef").forEach(b => b.remove()); }, true);
  const chef = el.querySelector(".chef");
  if (chef) chef.onclick = () => {
    const n = +chef.dataset.n, d = V.defi, a = LIEUX[d.lieu].arene, ch = CHAMPIONS[n];
    // (pas d'animation sur la carte : il sortirait du médaillon ; elle est réservée à la scène du badge)
    chef.classList.remove("nouveau"); try { localStorage.setItem(`pkm_chef_vu_${R.partie}_${n}`, "1"); } catch (e) {}
    el.querySelectorAll(".bulle-chef").forEach(b => b.remove());
    // la bulle reste dans la partie visible de la carte : centrée sur le champion sans déborder, en dessous de lui
    // s'il est tout en haut
    const cadre = el.querySelector(".carte-cadre"), rc = vue.getBoundingClientRect(), rm = chef.getBoundingClientRect();
    const b = document.createElement("div"); b.className = "bulle-chef";
    b.innerHTML = `<b>${ch.nom}</b> : « ${ch.indice} »${d.arrive ? `<small>Son défi est sous la carte.</small>`
      : `<small>Je t'attends : encore ${fr(d.reste)} pts de route.</small>`}`;
    cadre.appendChild(b);
    const L = Math.min(rc.width * .78, 260), H = b.offsetHeight, cx = rm.left + rm.width / 2 - rc.left;
    b.style.width = L + "px"; b.style.left = Math.min(Math.max(cx - L / 2, 8), rc.width - L - 8) + "px";
    const H2 = b.offsetHeight, dessus = rm.top - rc.top - 10 - H2;
    b.style.top = (dessus >= 6 ? dessus : Math.min(rm.bottom - rc.top + 10, rc.height - H2 - 6)) + "px";
    vibre(10); ton(1250, 0, .05, {type: "square", vol: .03});
    lieuVu = d.lieu === 18 ? 2 : d.lieu; choisir(lieuVu); el.querySelector(".infos-lieu").outerHTML = infosLieu(d.lieu); brancher();
  };
  // toucher un badge gagné : revoir la scène de l'arène (sans rien changer)
  el.querySelectorAll(".boite-badges .oui").forEach(b => b.onclick = () => {
    const n = +b.dataset.n; sceneBadge(n, CAPTURES.find(c => c.id.endsWith(n === 9 ? "#ligue" : `#badge${n}`)), true); });
}

// ---------- Mode test des arènes (29/10, pour Kiki) : un faux état, en mémoire seulement ----------
let TEST = null;  // {V: copie de l'état réel, vu: position du dernier voyage regardé pendant le test}
function entrerTest() { if (!TEST) TEST = {V: JSON.parse(JSON.stringify(V)), vu: null}; }
function redessinerTest() {
  VOYAGE = null; lieuVu = null;
  dessinerSpeciales(); dessinerRegles(); dessiner();
  document.getElementById("bandeau-test").innerHTML = TEST ? `<div class="bandeau-test">MODE TEST · rien n'est enregistré
    <button>Quitter le test</button></div>` : "";
  const q = document.querySelector("#bandeau-test button"); if (q) q.onclick = quitterTest;
  try { (window.frameElement || document.getElementById("app")).scrollIntoView({behavior: "smooth"}); } catch (e) {}
}
function testArrivee() {  // le dresseur vient d'arriver à Argenta : voyage à regarder, défi de Pierre en cours
  entrerTest();
  const i = LIEUX.findIndex(l => l.arene);
  Object.assign(V, {pos: LIEUX[i].dist, ici: i, badges: {}, defi: {lieu: i, numero: 1, valeur: 21, unite: "étages", valeur_b: 4,
    arrive: true, depuis: D.aujourdhui, reste: 0}});
  TEST.vu = LIEUX[i - 1].dist;
  redessinerTest();
}
function testBadge() {  // le défi est réussi : le Badge Roche attend d'être pris
  entrerTest();
  if (!V.defi || !V.defi.arrive) testArrivee();
  V.defi.valeur = 35;
  ouvertes.delete("test#badge1");
  if (!CAPTURES.some(c => c.id === "test#badge1"))
    CAPTURES.push({id: "test#badge1", jour: D.aujourdhui, num: 95, ball: "hyper", shiny: false, raison: "🏅 Badge Roche",
      lieu: "Argenta", legendaire: false, quand: "aujourd'hui", nom: PAR_NUM[95].nom, types: PAR_NUM[95].types});
  redessinerTest();
}
function quitterTest() {
  if (!TEST) return;
  Object.keys(V).forEach(k => delete V[k]); Object.assign(V, TEST.V);
  for (let i = CAPTURES.length - 1; i >= 0; i--) if (CAPTURES[i].id.startsWith("test")) { ouvertes.delete(CAPTURES[i].id); CAPTURES.splice(i, 1); }
  TEST = null; redessinerTest();
}
