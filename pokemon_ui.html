<!-- Onglet Pokémon (composant HTML affiché par ecran_pokemon.py, données dans __DONNEES__).
L'animation d'ouverture et la fiche du Pokédex s'affichent par-dessus toute l'appli, dans la page parente
(window.parent.document) ; la Poké Ball est en 3D (three.js), avec un repli en 2D si three.js ne charge pas. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Pixelify+Sans:wght@500;700&family=Jersey+15&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:transparent;color:#EEF2FA;font-family:Outfit,system-ui,sans-serif;overflow:hidden}
img{image-rendering:pixelated}
button{font-family:inherit}
.carte{background:#1C2740;border-radius:18px;padding:14px;margin:0 0 12px;position:relative;overflow:hidden}
h2{font-size:18px;font-weight:800;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;font-weight:600;color:#9AA7C2;margin-left:auto}
.gris{color:#9AA7C2}.petit{font-size:12px}
.type{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600;color:#fff;margin:2px 3px 0 0;
  text-shadow:0 1px 1px rgba(0,0,0,.35)}

/* ----- Barre d'effort ----- */
#barre{background:radial-gradient(120% 140% at 0% 0%,#3A1830 0%,#1C2740 55%);display:flex;gap:14px;align-items:center}
#barre .filigrane{position:absolute;right:-40px;top:-40px;width:170px;opacity:.07;pointer-events:none}
.anneau{position:relative;width:118px;height:118px;flex:0 0 118px}
.anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
.anneau .centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.anneau .v{font-size:28px;font-weight:900;line-height:1}.anneau .s{font-size:11px;color:#9AA7C2}
.anneau .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
#barre .droite{flex:1;min-width:0}
#barre .titre{font-weight:800;font-size:16px}
#barre .manque{font-size:12.5px;color:#C9D3EA;margin:4px 0 6px;line-height:1.45}
#barre .manque b{color:#fff}
.puces{display:flex;flex-wrap:wrap;gap:4px}
.puce{background:rgba(13,19,34,.7);border-radius:9px;padding:2px 8px;font-size:11.5px;color:#C9D3EA}
.puce b{color:#FFCB05}

/* ----- Poké Balls à ouvrir ----- */
#aouvrir{background:radial-gradient(100% 120% at 50% 0%,#2A3F7A 0%,#1C2740 70%);text-align:center;padding:16px 12px}
#aouvrir.vide{display:none}  /* rien à ouvrir : le bloc disparaît */
#aouvrir .titre{font-size:19px;font-weight:900;letter-spacing:.2px}
#aouvrir .rang{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.bouton-ball{background:none;border:0;padding:0;cursor:pointer;position:relative;width:64px;height:64px;
  animation:flotte 2.6s ease-in-out infinite}
.bouton-ball svg{width:64px;height:64px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
img.ball-pix{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.bouton-ball img.ball-pix{width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(40,40,30,.25))}
.bouton-ball:after{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);animation:halo 2.6s ease-in-out infinite}
.bouton-ball .q{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:10px;color:#9AA7C2;
  white-space:nowrap}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(0)}
  80%{transform:translateY(0) rotate(-8deg)}88%{transform:translateY(0) rotate(7deg)}}
@keyframes halo{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.gros-bouton{margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#FF4B4B,#D21F2E);box-shadow:0 4px 0 #8E1220,0 8px 20px rgba(210,31,46,.35);
  cursor:pointer;animation:pouls 1.8s ease-in-out infinite}
.gros-bouton:active{transform:translateY(3px);box-shadow:0 1px 0 #8E1220}
@keyframes pouls{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

/* ----- Balls spéciales ----- */
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.speciale{background:#1C2740;border-radius:16px;padding:11px 12px;position:relative;overflow:hidden}
.speciale.ok{box-shadow:inset 0 0 0 2px #4CD3A0}
.speciale .tete{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px}
.speciale .tete .ico{width:32px;height:32px;flex:0 0 32px}
.speciale .gain{font-size:11px;color:#9AA7C2;margin:2px 0 6px;line-height:1.3}
.speciale .ligne{font-size:11px;color:#C9D3EA;margin-top:5px;display:flex;justify-content:space-between;gap:4px}
.jauge{height:6px;background:#0D1322;border-radius:3px;margin-top:3px;overflow:hidden}
.jauge div{height:100%;border-radius:3px;background:#6B8CFF;transition:width 1s ease}
.jauge div.ok{background:#4CD3A0}
.speciale .tampon{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:800;color:#4CD3A0}
.points-serie{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.points-serie i{width:7px;height:7px;border-radius:50%;background:#0D1322}
.points-serie i.on{background:#B57BFF;box-shadow:0 0 6px #B57BFF}
.points-serie i.rate{background:#5A2A38}
.points-serie i.auj{box-shadow:inset 0 0 0 1.5px #B57BFF}
.speciale.defi{grid-column:1/-1;padding-left:84px;min-height:86px;box-shadow:0 0 0 2px var(--c) inset;
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 30%,#1C2740),#1C2740 60%)}
.speciale.defi .portrait{position:absolute;left:12px;top:12px;width:60px;height:60px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#fff 0%,var(--c) 80%);box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.5)}
.speciale.defi .portrait canvas,.speciale.defi .portrait .tete-champ{width:100%;height:100%;image-rendering:pixelated}
.speciale.defi .ligne b{color:#fff}
/* le badge gagné qui attend d'être pris (à la place d'une Poké Ball) */
.bandeau-test{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:7px 10px;border-radius:10px;
  background:repeating-linear-gradient(135deg,#3A2E05 0 10px,#2A2204 10px 20px);color:#FFE27A;font:800 12.5px Outfit,sans-serif;
  box-shadow:0 0 0 1.5px #FFCB05 inset}
.bandeau-test button{border:0;border-radius:999px;padding:5px 10px;background:#FFCB05;color:#1C2740;font:800 12px Outfit,sans-serif;cursor:pointer}
.zone-test{border-top:1px dashed rgba(255,255,255,.2);padding-top:8px;margin-top:6px}
.zone-test .filtre{margin:6px 6px 0 0}
#tests{padding:4px 2px 6px}
#tests .groupe{margin:10px 0 2px;font:800 13px Outfit,sans-serif;color:#C9D3EA}
#tests .groupe small{display:block;font-weight:500;font-size:11.5px;color:#9AA7C2;margin-top:2px}
#tests .boutons-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#tests .filtre{display:inline-flex;align-items:center;gap:6px}
#tests .filtre .tete-champ{width:22px;height:22px;border-radius:50%;background-color:#2A3756}
.badge-attente{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px;border:0;border-radius:14px;cursor:pointer;
  text-align:left;color:#fff;font-family:Outfit,sans-serif;background:radial-gradient(120% 140% at 0% 50%,color-mix(in srgb,var(--c) 55%,#1C2740),#1C2740 70%);
  box-shadow:0 0 0 2px #FFD84A inset,0 0 18px rgba(255,216,74,.35)}
.badge-attente .disque{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 40% 30%,#FFF7CF,#FFD84A 55%,#C08A00);box-shadow:0 0 0 2px #FFF3B0,0 0 20px 4px rgba(255,216,74,.6);
  animation:pk-badge-att 2.4s ease-in-out infinite}
.badge-attente .disque img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45));animation:pk-badge-tourne 3.4s ease-in-out infinite}
@keyframes pk-badge-att{50%{transform:translateY(-4px) scale(1.05);box-shadow:0 0 0 2px #FFF3B0,0 0 30px 8px rgba(255,216,74,.8)}}
@keyframes pk-badge-tourne{50%{transform:rotate(-8deg) scale(1.06)}}
.badge-attente .txt{display:flex;flex-direction:column;gap:3px}
.badge-attente b{font-size:17px;font-weight:900}
.badge-attente small{font-size:12.5px;color:#FFE27A;font-weight:700}
.bandeau-voyage.or{box-shadow:0 0 0 2px #FFD84A inset,0 0 18px rgba(255,216,74,.5);background:linear-gradient(135deg,#5A4A12,#1C2740)}
.speciale.mission .m-titre{font-size:13px;font-weight:800;color:#FFE27A;margin-top:2px}
.speciale.mission .m-pourquoi{font-size:10.5px;color:#7C8AA8;margin-top:5px;line-height:1.3}
.puce.bonus{background:rgba(255,203,5,.14);box-shadow:inset 0 0 0 1px rgba(255,203,5,.45)}
.semaine-pesee{display:flex;gap:3px;margin:4px 0 0}
.semaine-pesee i{flex:1;aspect-ratio:1;max-width:19px;border-radius:50%;display:grid;place-items:center;font:800 9px Outfit,sans-serif;
  font-style:normal;color:#7C8AA8;background:#0D1322;box-shadow:inset 0 0 0 1px #2A3654}
.semaine-pesee i.on{background:#4CD3A0;color:#0D1322;box-shadow:none}
.semaine-pesee i.rate{color:#55607A;background:#141B2E}
.semaine-pesee i.auj{box-shadow:inset 0 0 0 1.5px #FFCB05;color:#FFCB05}
.pesee-der{font-size:11px;color:#C9D3EA;margin-top:6px}
.pesee-der b{color:#fff}
.pesee-comp{display:flex;align-items:center;flex-wrap:wrap;gap:1px;font-size:11px;color:#9AA7C2;margin-top:2px}
.pesee-comp span{position:relative;display:inline-block}
.pesee-comp img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated;vertical-align:middle}
.pesee-comp i{position:absolute;right:-3px;bottom:-1px;font:800 9px Outfit,sans-serif;font-style:normal;color:#fff;
  background:#0D1322;border-radius:6px;padding:0 3px}
.speciale .reste{font-size:11px;color:#FFCB05;margin-top:7px;line-height:1.35}
.speciale.grise .tete,.speciale.grise .gain,.speciale.grise .ligne,.speciale.grise .jauge,.speciale.grise .m-titre{filter:grayscale(1);opacity:.5}
.speciale .verrou{display:flex;gap:6px;align-items:flex-start;font-size:11px;font-weight:700;color:#FFB4A8;margin-top:8px;line-height:1.35}
.speciale .cadenas{width:13px;height:13px;flex:0 0 13px;margin-top:1px}
.speciale.defi .garde-champ{font-size:11px;color:#FFE27A;margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);line-height:1.35}
.speciale.defi .conseil4{display:flex;gap:6px;margin:4px 0 2px}
.speciale.defi .conseil4 span{width:38px;text-align:center;opacity:.55}
.speciale.defi .conseil4 span.battu{opacity:1;filter:none}
.speciale.defi .conseil4 span:not(.battu) .tete-champ{filter:grayscale(1)}
.speciale.defi .conseil4 .tete-champ{width:34px;height:34px;border-radius:50%;overflow:hidden;display:block;margin:auto}
.speciale.defi .conseil4 i{font-size:9.5px;font-style:normal;color:#C9D3EA}
.speciale.chasse{grid-column:1/-1;box-shadow:inset 0 0 0 2px #FFCB05}
.speciale.sanct{grid-column:1/-1;padding-left:76px;min-height:72px;box-shadow:inset 0 0 0 2px #8A4FD8}
.speciale.sanct .silhouette{position:absolute;left:8px;top:10px;width:60px;height:60px;image-rendering:pixelated;filter:brightness(0) drop-shadow(0 0 6px #B57BFF)}
.speciale.sanct .silhouette.vue{filter:drop-shadow(0 0 6px #B57BFF)}
.mini-ball{display:inline-block;width:22px;height:22px;vertical-align:-5px}
.mini-ball svg{width:100%;height:100%;display:block}
.speciale .tete .mini-ball{width:28px;height:28px;flex:0 0 28px;margin:2px}
.sac{display:flex;gap:10px;align-items:center;background:#1C2740;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sac .boules{display:flex;flex:0 0 auto;gap:1px}.sac .boules .ico{flex:0 0 22px;width:22px;height:22px;margin:0 2px}
.sac b{display:block;font-size:13px}.sac small{display:block;color:#9AA7C2;font-size:11px;line-height:1.3;margin-top:2px}
.marque-sanct{opacity:.55}.marque-sanct.ouvert{opacity:1;filter:drop-shadow(0 0 3px #B57BFF)}.marque-sanct.fait{opacity:.3}
.speciale.ok .reste{color:#4CD3A0}

/* ----- Voyage dans Kanto ----- */
#voyage{padding:14px 12px 12px;background:radial-gradient(120% 90% at 50% 0%,#1D4A5E 0%,#1C2740 70%)}
#voyage .entete{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#voyage .entete .titre{font-weight:900;font-size:17px}
#voyage .entete .ou{font-size:12px;color:#C9D3EA;margin-left:auto}
.avance{height:7px;background:#0D1322;border-radius:4px;margin:8px 0 10px;overflow:hidden}
.avance div{height:100%;border-radius:4px;background:linear-gradient(90deg,#FFCB05,#FF8A3D);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.carte-kanto{width:100%;display:block;background:#2B6E9E;touch-action:manipulation}
/* la carte : une fenêtre (carte-vue) sur la carte zoomée (carte-wrap, --z fois plus large) ; les tailles en %
   (dresseur, champion, bulle) sont divisées par --z pour garder la même taille à l'écran */
.carte-cadre{position:relative;margin-top:14px}
.carte-vue{overflow:hidden;border-radius:14px 14px 0 0;background:#2B6E9E;scrollbar-width:none;overscroll-behavior:auto;
  -webkit-overflow-scrolling:touch}
.carte-vue::-webkit-scrollbar{display:none}
.carte-vue.glisse{cursor:grabbing;user-select:none}
.carte-zoom{position:absolute;left:8px;bottom:8px;z-index:6;display:flex;align-items:center;gap:4px;border:0;border-radius:999px;
  padding:4px 10px 4px 6px;background:rgba(16,35,58,.82);color:#fff;font:800 12px Outfit,sans-serif;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 2px 6px rgba(0,0,0,.4);cursor:pointer}
.carte-wrap{position:relative;--z:1}
.carte-wrap .heros,.ombre-heros{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.carte-wrap .heros{display:flex;flex-direction:column;align-items:center;width:calc(20% / var(--z))}
.carte-wrap .heros-ancre{position:absolute;inset:0;pointer-events:none}
/* le voyage depuis la dernière visite : carte assombrie + bouton ▶, et bandeau en haut de l'onglet */
.carte-attente{position:absolute;left:0;right:0;top:0;aspect-ratio:var(--ar);z-index:7;border:0;border-radius:14px 14px 0 0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-family:Outfit,sans-serif;
  background:radial-gradient(circle at 50% 50%,rgba(10,16,30,.35),rgba(10,16,30,.72));transition:opacity .45s}
.carte-attente.part{opacity:0;pointer-events:none}
.puce-replay{position:absolute;left:10px;top:10px;z-index:8;padding:5px 10px;border-radius:999px;background:rgba(10,16,30,.82);
  color:#fff;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:opacity .8s;pointer-events:none}
.puce-replay b{color:#FFE27A}
.puce-replay.fin{opacity:0}
.ball-route{position:absolute;z-index:9;width:30px;height:30px;margin:-34px 0 0 -15px;pointer-events:none;
  animation:ball-sort .55s cubic-bezier(.2,1.6,.4,1) both;transition:transform .6s cubic-bezier(.5,0,.8,.4),opacity .6s;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.ball-route svg{width:100%;height:100%}
.ball-route.spe{width:42px;height:42px;margin:-46px 0 0 -21px}
.ball-route.spe:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,122,.9),transparent 65%);
  animation:ball-halo 1.2s ease-out both;z-index:-1}
.ball-route span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:900;
  color:#FFE27A;text-shadow:0 1px 3px #000,0 0 6px #000}
.ball-route.file{opacity:.2}
@keyframes ball-sort{0%{transform:translateY(16px) scale(0)}100%{transform:translateY(0) scale(1)}}
@keyframes ball-halo{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
#aouvrir.recu{animation:recu .45s ease-out}
@keyframes recu{0%{box-shadow:0 0 0 0 rgba(255,216,74,.9)}100%{box-shadow:0 0 0 14px rgba(255,216,74,0)}}
.en-route{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:10px 12px;border:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#2A3D66,#1C2740);color:#fff;text-align:left;font:inherit;box-shadow:0 0 0 1.5px rgba(255,226,122,.6) inset}
.en-route span{flex:1;display:flex;flex-direction:column;gap:2px}
.en-route b{font-size:14.5px;font-weight:900}
.en-route small{font-size:12.5px;color:#FFE27A;font-weight:700}
.en-route i{width:28px;height:28px;border-radius:50%;background:#E8382F;position:relative;flex:none;box-shadow:0 0 0 2px #fff}
.en-route i:after{content:"";position:absolute;left:10px;top:7px;border-left:10px solid #fff;border-top:7px solid transparent;
  border-bottom:7px solid transparent}
.carte-attente .play{width:64px;height:64px;border-radius:50%;background:#E8382F;position:relative;
  box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.5);animation:pk-play 1.6s ease-in-out infinite}
.carte-attente .play:after{content:"";position:absolute;left:25px;top:18px;border-left:22px solid #fff;border-top:14px solid transparent;
  border-bottom:14px solid transparent}
@keyframes pk-play{50%{transform:scale(1.08)}}
.carte-attente b{font-size:18px;font-weight:900;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.carte-attente small{font-size:13px;font-weight:700;color:#FFE27A;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.bandeau-voyage{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 12px;padding:10px 12px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#1D4A5E,#1C2740);color:#fff;text-align:left;cursor:pointer;font-family:Outfit,sans-serif;
  box-shadow:0 0 0 2px #FFCB05 inset,0 4px 14px rgba(0,0,0,.35);animation:pk-bandeau 2.2s ease-in-out infinite}
.bandeau-voyage span{flex:1;display:flex;flex-direction:column;gap:2px}
.bandeau-voyage b{font-size:15px;font-weight:900}
.bandeau-voyage small{font-size:12.5px;color:#FFE27A;font-weight:700}
.bandeau-voyage i{width:30px;height:30px;border-radius:50%;background:#E8382F;position:relative;flex:none;box-shadow:0 0 0 2px #fff}
.bandeau-voyage i:after{content:"";position:absolute;left:11px;top:8px;border-left:11px solid #fff;border-top:7px solid transparent;
  border-bottom:7px solid transparent}
@keyframes pk-bandeau{50%{box-shadow:0 0 0 2px #FFCB05 inset,0 0 18px 2px rgba(255,203,5,.45)}}
/* la boule de cristal (dans une grotte) : on y voit le dresseur marcher sous la montagne */
.carte-wrap .boule{position:absolute;width:calc(24% / var(--z));aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  overflow:hidden;z-index:4;box-shadow:0 0 0 2px #FFE7A0,0 0 0 4px #9C7426,0 0 0 5.5px rgba(40,25,5,.6),0 0 16px 5px rgba(255,214,120,.55),
  0 6px 12px rgba(0,0,0,.55);animation:pk-boule 2.4s ease-in-out infinite}
.carte-wrap .boule canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.carte-wrap .boule .sacha{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:20%!important;z-index:1}
.carte-wrap .boule .sacha.miroir{transform:translateX(-50%) scaleX(-1)}
.carte-wrap .boule:after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.5) 0,rgba(255,255,255,.12) 18%,transparent 34%),
    radial-gradient(circle at 50% 50%,transparent 58%,rgba(20,10,40,.45) 100%)}
@keyframes pk-boule{50%{box-shadow:0 0 0 2px #FFE7A0,0 0 0 4px #9C7426,0 0 0 5.5px rgba(40,25,5,.6),0 0 22px 8px rgba(255,214,120,.7),

/* ================================================================================================
   LA DIRECTION ARTISTIQUE : une GBA moderne (02/11, demande de Kiki, d'après l'écran de combat de la page Santé).
   Une seule police (Jersey 15, agrandie pour rester lisible), de grandes boîtes crème à bord sombre et ombre dure, des barres de PV

/* ---- le décor du lieu de capture (fonds ChatGPT, dossier scenes/fond-*.webp) ---- */
/* avant l'ouverture : l'appli (fond sombre, ball 3D) ; à l'ouverture, classe dehors : on entre dans le jeu (décor pixel art) */
#pkm-voile:not(.dehors) :is(.decor,.decor-flou,.vent,.vignette,.ombre-sol,.lueur-sol,.ombre-ball){visibility:hidden}
#pkm-voile.dehors .fond{opacity:0}
#pkm-voile .blanc-jeu{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25;transition:opacity .6s cubic-bezier(.4,0,.6,1)}
#pkm-voile .decor-flou{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(16px) brightness(.5) saturate(1.2)}
#pkm-voile .decor{position:absolute;top:0;height:100%;transform:scale(1.14);transform-origin:50% 42%;
  transition:transform 3.2s cubic-bezier(.15,.75,.2,1),filter .9s}
#pkm-voile .decor img{display:block;height:100%;image-rendering:pixelated}
#pkm-voile.revele .decor{filter:brightness(.82) saturate(1.05)}
#pkm-voile.habitat.ouvert .decor{transform:scale(1)}
#pkm-voile.habitat.revele .decor{transform:scale(1.06);transition:transform 1.4s cubic-bezier(.2,.8,.2,1),filter .9s}
#pkm-voile .vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 75% at 50% 42%,transparent 55%,rgba(5,10,20,.55) 100%),
    linear-gradient(180deg,rgba(5,10,20,.35) 0,transparent 14%,transparent 66%,rgba(5,10,20,.55) 100%)}
#pkm-voile canvas.vent{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated}
#pkm-voile .ombre-sol{position:absolute;width:var(--ow);height:calc(var(--ow) * .22);left:var(--ox);top:var(--oy);
  transform:translate(-50%,-50%) scale(.3);border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(var(--ombre,20,40,10),.55),rgba(var(--ombre,20,40,10),.25) 60%,transparent);transition:opacity .5s,transform .7s cubic-bezier(.2,1.4,.4,1)}
#pkm-voile.revele .ombre-sol{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pkm-voile .lueur-sol{position:absolute;width:calc(var(--ow) * 1.3);aspect-ratio:1;left:var(--ox);top:calc(var(--py));
  transform:translate(-50%,-50%) scale(.2);border-radius:50%;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(255,250,220,.75),rgba(255,240,180,.25) 45%,transparent 70%);transition:opacity .4s,transform .9s cubic-bezier(.2,.9,.2,1)}
#pkm-voile.revele .lueur-sol{opacity:.7;transform:translate(-50%,-50%) scale(1);transition:opacity 2.5s 1s,transform .9s cubic-bezier(.2,.9,.2,1)}
#pkm-voile.revele.calme .lueur-sol{opacity:.25}
#pkm-voile.dehors .poke{left:var(--ox);top:var(--pky,var(--py));width:var(--pkw,var(--pw))}
#pkm-voile.dehors .poke.couleur{filter:drop-shadow(0 4px 0 rgba(0,0,0,.18)) drop-shadow(0 0 10px rgba(255,255,255,.35))}
#pkm-voile.dehors.r-shiny .poke.couleur{filter:drop-shadow(0 0 18px rgba(255,215,90,.95))}
#pkm-voile.habitat .haut{z-index:30}

/* l'arrivée dans le lieu : le décor apparaît en mosaïque (gros pixels qui s'affinent, comme les transitions de la GBA) */
#pkm-voile canvas.mosaique{position:absolute;inset:0;width:100%;height:100%;z-index:24;display:none;pointer-events:none;image-rendering:pixelated}
/* la ball en pixel art (sprite du jeu agrandi), pour aller avec le décor */
#pkm-voile .ball2d.pixel .corps{position:absolute;inset:0;transform-origin:50% 76%}

  pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(0deg,#fff 0,var(--c,#fff) 25%,transparent 100%);
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 30%,#000 70%,transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
#pkm-voile .ombre-ball{position:absolute;left:var(--ox);top:calc(var(--oy) + 1.2vh);width:calc(var(--ow) * .32);height:calc(var(--ow) * .08);

    if (t === "bulles") Object.assign(o, {y: H + R(0, H), v: R(.2, .5), s: Math.random() < .4 ? 2 : 1});

// ----- Particules (étincelles, confettis) sur un canvas 2D -----
function Particules(canvas) {
  const ctx = canvas.getContext("2d"), parts = [];
  let W = 0, H = 0, dpr = 1;
  const taille = () => { dpr = Math.min(PW.devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight;
                         canvas.width = W * dpr; canvas.height = H * dpr; };

    taille,
    jet(x, y, n, {couleurs = ["#fff"], vitesse = 6, forme = "etoile", taille: t = 6, vie = 1.2, gravite = .12, cercle = false} = {}) {
      for (let i = 0; i < n; i++) {
        const a = cercle ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2, v = vitesse * (.4 + Math.random() * .8);
        parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (forme === "confetti" ? 4 : 0), g: gravite,
          vie: vie * (.6 + Math.random() * .6), age: 0, t: t * (.5 + Math.random()), rot: Math.random() * 6,
          vr: (Math.random() - .5) * .3, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme});
      }
    },
    scintille(x, y, rayon, couleurs) {
      const a = Math.random() * Math.PI * 2, r = rayon * Math.sqrt(Math.random());
      parts.push({x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * .9, vx: 0, vy: -.3, g: 0, vie: .9, age: 0,
        t: 4 + Math.random() * 7, rot: 0, vr: .05, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme: "brille"});
    },
    dessiner(dt) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.age += dt;
        if (p.age > p.vie) { parts.splice(i, 1); continue; }
        const k = dt * 60; p.vx *= Math.pow(.97, k); p.vy = p.vy * Math.pow(.97, k) + p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;

        else if (p.forme === "rond") { ctx.beginPath(); ctx.arc(p.x, p.y, p.t * f, 0, 7); ctx.fill(); }
        else etoile(p.x, p.y, p.t * (p.forme === "brille" ? 1 : f), p.rot);

}

    if (haut && type === "hyper" && Math.abs(x) > .26 && Math.abs(x) < .46 && z > -.55 && y > .12) col = jaune;

// Une boîte de dialogue dans la scène v : dire(texte, qui) écrit le texte lettre par lettre (petit « bip »), toucher =
// tout afficher, puis passer à la suite ; cacher() la range. Les touchers sur ignorer (sélecteur) ne la font pas avancer.
// Hauteur FIXE pendant toute la scène (demande de Kiki, 01/11) : prevoir([[texte, qui], …]) mesure toutes les répliques
// à l'avance et la boîte prend la hauteur de la plus longue ; une réplique imprévue plus longue l'agrandit (jamais
// elle ne rapetisse).
const sansVeuve = html => html.replace(/ ([!?:;»])/g, "\u00A0$1").replace(/« /g, "«\u00A0");  // espace insécable avant ! ? : ;
function dialogue(v, ignorer = ".pkm-passer") {
  const dial = P.createElement("div"); dial.className = "pkm-dial";
  dial.innerHTML = `<span class="qui"></span> <span class="txt"></span><i class="suite"></i>`;
  v.appendChild(dial);
  const qui = dial.querySelector(".qui"), txt = dial.querySelector(".txt");
  let tape = null, attendre = null, prevues = [], haut = 0;
  const entete = nom => nom ? nom.toUpperCase() + " :" : "";
  const mesurer = liste => {  // hauteur de la boîte pour chaque réplique (une copie invisible, même largeur)
    const m = dial.cloneNode(true); m.classList.add("vu"); m.style.cssText = "visibility:hidden;min-height:0;transition:none";
    v.appendChild(m); let h = 0;
    for (const [html, nom] of liste) { m.querySelector(".qui").textContent = entete(nom); m.querySelector(".txt").innerHTML = sansVeuve(html);
      h = Math.max(h, m.offsetHeight); }
    m.remove(); return h;
  };
  const fixer = h => { if (h > haut) { haut = h; dial.style.minHeight = h + "px"; } };
  const prevoir = liste => { prevues = prevues.concat(liste.filter(l => l && l[0])); haut = 0; dial.style.minHeight = ""; fixer(mesurer(prevues)); };
  const recaler = () => { if (!prevues.length) return; haut = 0; dial.style.minHeight = ""; fixer(mesurer(prevues)); };
  PW.addEventListener("resize", recaler);
  try { P.fonts.ready.then(recaler); P.fonts.load("23px 'Jersey 15'").then(recaler); } catch (e) {}  // la police pixel arrive après
  const dire = (html, nom = "", attendSuite = true) => new Promise(ok => {
    clearInterval(tape); dial.classList.add("vu"); dial.classList.remove("attend");
    fixer(mesurer([[html, nom]]));
    qui.textContent = entete(nom);
    const plein = sansVeuve(html);
    // toute la phrase est mise en page tout de suite, lettres invisibles : on les dévoile sans que rien ne bouge
    txt.innerHTML = plein; const lettres = [];
    const parcours = P.createTreeWalker(txt, NodeFilter.SHOW_TEXT), noeuds = [];
    while (parcours.nextNode()) noeuds.push(parcours.currentNode);
    noeuds.forEach(nd => { const fr = P.createDocumentFragment();
      for (const ch of nd.nodeValue) { const sp = P.createElement("span"); sp.className = "l"; sp.textContent = ch; lettres.push(sp); fr.appendChild(sp); }
      nd.replaceWith(fr); });
    let n = 0;
    const finir = () => { clearInterval(tape); tape = null; txt.innerHTML = plein;
      if (attendSuite) { dial.classList.add("attend"); attendre = () => { attendre = null; ok(); }; } else { attendre = null; ok(); } };
    tape = setInterval(() => { if (lettres[n]) lettres[n].classList.add("v"); n += 1;
      if (n % 3 === 0) ton(1250, 0, .028, {type: "square", vol: .018}); if (n >= lettres.length) finir(); }, 26);
    attendre = () => finir();
  });
  v.addEventListener("pointerdown", e => { if (e.target.closest(ignorer)) return; if (attendre) attendre(); });
  return {dire, prevoir, cacher: () => { dial.classList.remove("vu"); attendre = null; },
    fin: () => PW.removeEventListener("resize", recaler)};
}

// Les lumières de la scène : un petit canevas (1 point = 3 pixels de l'écran) agrandi sans lissage
function lumieresEvo(canvas, fini) {
  const g = canvas.getContext("2d"), parts = [], ondes = [];
  let W = 0, H = 0, mode = "", dernier = 0, attente = 0, debit = 0;
  const taille = () => { W = canvas.width = Math.ceil(PW.innerWidth / 3); H = canvas.height = Math.ceil(PW.innerHeight / 3); };
  taille();
  const cx = () => W / 2, cy = () => H * .42;
  const naitre = () => {
    if (mode === "attire") { const a = Math.random() * 6.283, d = Math.max(W, H) * (.55 + Math.random() * .3); parts.push({a, d, v: .16 + Math.random() * .12, c: Math.random() < .25 ? "#FFE88A" : "#FFFFFF", t: Math.random() < .3 ? 2 : 1}); }
    else if (mode === "pluie") parts.push({x: Math.random() * W, y: -4, vy: .22 + Math.random() * .3, vx: (Math.random() - .5) * .1, c: ["#FFF3B0", "#F8C838", "#FFFFFF"][parts.length % 3], etoile: Math.random() < .5, age: Math.random() * 6});
    else if (mode === "attente") parts.push({x: Math.random() * W, y: H + 2, vy: -.12 - Math.random() * .16, vx: 0, c: "#7C8CC8", etoile: false, age: Math.random() * 6});
  };
  const boucle = now => {
    if (fini()) return;
    const k = Math.min((now - dernier) / 16.7, 3); dernier = now;
    g.clearRect(0, 0, W, H);
    attente += debit * k; while (attente >= 1) { attente -= 1; naitre(); }
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i];
      if (p.d !== undefined) {  // elle tourne en se rapprochant du Pokémon
        p.d -= (p.v + (1 - p.d / Math.max(W, H)) * .9) * 2.4 * k; p.a += .018 * k * (1 + 26 / Math.max(p.d, 10));
        if (p.d < 6) { parts.splice(i, 1); continue; }
        g.fillStyle = p.c; g.fillRect(Math.round(cx() + Math.cos(p.a) * p.d), Math.round(cy() + Math.sin(p.a) * p.d), p.t, p.t);
      } else {
        p.x += p.vx * k; p.y += p.vy * k; p.age += .06 * k;
        if (p.y > H + 4 || p.y < -6) { parts.splice(i, 1); continue; }

        g.fillStyle = p.c; const x = Math.round(p.x), y = Math.round(p.y);

      } }
    for (let i = ondes.length - 1; i >= 0; i--) { const o = ondes[i]; o.r += o.v * k; o.a -= o.perte * k;

// Ce qu'il reste à faire pour battre le champion chez qui l'on est

// Les pompes, tractions et squats (la montre ne sait pas les compter) : un bouton, et chaque toucher part dans la liste partagée
const GESTES = {pompes: {nom: "Pompes", pas: [5, 10]}, tractions: {nom: "Tractions", pas: [1, 5]}, squats: {nom: "Squats", pas: [10, 25]}};

// Tes prochains objectifs (02/11, idée de Kiki) : aucune règle en plus, juste les 3 buts les plus proches parmi ce qui existe déjà, pour
// avoir toujours quelque chose à viser. Classés par points à faire (une espèce ou un jour ≈ 100 points : une barre). Rien sur ce qui viendra après.
function prochainsObjectifs() {
  const d = V.defi, liste = [], route = (p, min = 0) => Math.max(Math.ceil(p), min);
  if (d && d.arrive) liste.push({rang: -1, ic: LIEUX[d.lieu].arene.image ? ico(IMG.badge(LIEUX[d.lieu].arene.image)) : ico("ligue"), t: `Battre ${CHAMPIONS[d.numero].nom}`, v: resteDefi(), va: "speciales", prio: true});
  else if (d) { const a = LIEUX[d.lieu].arene;
    liste.push({rang: d.reste, ic: a.image ? ico(IMG.badge(a.image)) : ico("ligue"), t: a.type ? `Arène ${/^[AEIOUÉ]/.test(CHAMPIONS[d.numero].nom) ? "d'" : "de "}${CHAMPIONS[d.numero].nom}` : "La Ligue Pokémon", v: `encore ${fr(d.reste)} pts de route`, va: "voyage", prio: true}); }
  const suivant = LIEUX[V.ici + 1];
  if (suivant && !(d && d.arrive) && !(d && d.lieu === V.ici + 1)) liste.push({rang: suivant.dist - V.pos, ic: ico("carte"), t: suivant.nom.replace(" (retour)", ""), v: `encore ${fr(route(suivant.dist - V.pos))} pts de route`, va: "voyage"});
  const nb = Object.keys(collection()).length, rg = rangDex(nb);
  if (rg.suivant) liste.push({rang: rg.reste * 100, ic: ico("radar"), t: `Rang ${rg.suivant}`, v: `encore ${rg.reste} espèce${rg.reste > 1 ? "s" : ""}`, va: "dex"});
  (V.sanctuaires || []).forEach(x => { if (x.fait) return;
    const r = x.cible - x.valeur, dist = LIEUX[x.lieu].dist - V.pos;
    liste.push(x.atteint ? {rang: r * 100, ic: ico("master"), t: "Sanctuaire", v: `encore ${r} jour${r > 1 ? "s" : ""} d'exploit`, va: "speciales"}
      : {rang: dist + 400, ic: ico("master"), t: "Un sanctuaire", v: `encore ${fr(route(dist))} pts de route`, va: "voyage"}); });
  if (J.serie >= R.master_jours / 2) { const r = R.master_jours - J.serie; liste.push({rang: r * 100, ic: ico("sball"), t: "Shiny Ball", v: `encore ${r} jour${r > 1 ? "s" : ""} d'objectif`, va: "speciales"}); }
  // le champion est toujours là s'il existe (l'évolution a sa carte juste en dessous : pas de doublon) ; le reste complète, du plus proche au plus lointain
  liste.sort((a, b) => a.rang - b.rang);
  return [...liste.filter(x => x.prio), ...liste.filter(x => !x.prio)].slice(0, 3).sort((a, b) => a.rang - b.rang);
}

// La pesée de la semaine (29/10) : 3 pesées le matin du lundi au dimanche = une Poké Ball ; et la dernière pesée
// comparée à des Pokémon (poids officiels du Pokédex), une combinaison différente chaque jour
function comparerPokemon(kg, graine) {
  let s = [...graine].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 2147483647, 7) || 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const tous = Object.entries(D.poids).map(([n, w]) => [+n, w]).filter(([, w]) => w >= .5 && w <= kg);
  let meilleur = null;
  for (let essai = 0; essai < 600; essai++) {
    let reste = kg; const choix = [];
    for (let k = 0; k < 3 && reste > .3; k++) {
      const ok = tous.filter(([n, w]) => w <= Math.min(reste * 1.02, k ? kg : kg * .6) && !choix.some(c => c[0] === n));
      if (!ok.length) break;
      const [n, w] = ok[Math.floor(rnd() * ok.length)], fois = Math.max(1, Math.floor(rnd() * Math.min(4, Math.floor(reste / w + .02))) + 1);
      const f = Math.min(fois, Math.floor(reste / w + .02)) || 1; choix.push([n, f, w]); reste -= f * w;
    }
    const nb = choix.reduce((t, c) => t + c[1], 0), ecart = Math.abs(reste);
    if (nb > 6) continue;
    const note = ecart / kg + (nb < 2 ? .05 : nb > 4 ? .01 : 0) + rnd() * .012;  // 2 à 4 Pokémon : plus drôle
    if (ecart / kg < .015 && (!meilleur || note < meilleur.note)) meilleur = {note, choix};
  }

// ---------- Le voyage dans Kanto ----------
let lieuVu = null;  // le lieu touché sur la carte (sinon : là où l'on est)
// Le chemin parcouru entre deux positions (en points) : des bouts de tracé, chacun avec sa façon de voyager
function morceau(pts, a, b) {  // la partie d'un tracé entre les fractions a et b de sa longueur
  const L = longueur(pts), da = L * a, db = L * b, out = [];
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], l = Math.hypot(x1 - x0, y1 - y0), s1 = s + l;
    const at = d => { const t = l ? (d - s) / l : 0; return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]; };
    if (s1 >= da && s <= db) {
      if (!out.length) out.push(at(Math.max(da, s)));
      if (s1 <= db) out.push([x1, y1]); else { out.push(at(db)); break; }
    }
    s = s1;
  }
  return out.length ? out : [pts[0]];
}
function trajet(p0, p1) {
  const L = LIEUX, r = [];
  for (let k = 1; k < L.length; k++) {
    const d0 = L[k - 1].dist, d1 = L[k].dist, a = Math.max(p0, d0), b = Math.min(p1, d1);
    if (b > a) r.push({pts: morceau(TRACE[k], (a - d0) / (d1 - d0), (b - d0) / (d1 - d0)), mode: L[k].mode, k});
  }
  return r;
}
function poseA(p) {  // où est le dresseur quand il en est à p points, et comment il voyage
  const L = LIEUX, k = L.findIndex((l, j) => j && p > L[j - 1].dist && p < l.dist);
  const t = trajet(0, p), der = t.length ? t[t.length - 1].pts : [[L[0].x, L[0].y]], [x, y] = der[der.length - 1];
  return {x, y, dir: direction(t.flatMap(m => m.pts)), enRoute: k, mode: k > 0 ? L[k].mode : "route",
          arrete: !!(V.defi && V.defi.arrive) && p >= V.pos};
}
const pt = pts => pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
function traitFait(m, T) {  // un bout de chemin parcouru : rouge bordé de blanc (tirets en vol, en mer, sous terre)
  const tiret = m.mode === "route" ? "" : `stroke-dasharray="5 3.5"`;
  return `<polyline points="${pt(m.pts)}" fill="none" stroke="#fff" stroke-width="${5 * T}" stroke-linecap="round" stroke-linejoin="round" opacity=".9" ${tiret}/>
    <polyline points="${pt(m.pts)}" fill="none" stroke="#E8382F" stroke-width="${2.8 * T}" stroke-linecap="round" stroke-linejoin="round" ${tiret}/>`;
}
// La carte ; depuis = la position (en points) d'où le dresseur repart en marchant jusqu'à aujourd'hui (voyagerDepuis)
function svgKanto(depuis = V.pos) {

  // visite se dessine pendant que le dresseur avance (#chemin-anim)
  const traits = trajet(depuis, Infinity).map(x => `<polyline points="${pt(x.pts)}" fill="none" stroke="#1B2A4A" stroke-width="${1.8 * T}"
      stroke-dasharray="0.1 ${4.2 * T}" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`).join("") +
    trajet(0, depuis).map(x => traitFait(x, T)).join("") + `<g id="chemin-anim"></g>`;
  const col = collection();
  const noeuds = L.map((l, k) => {

    const k2 = k === 2 ? 18 : k, ar = L[k2].arene;  // Jadielle porte l'arène de Giovanni
    const num = ar ? L.filter((x, j) => x.arene && j <= k2).length : 0, gagne = num && V.badges[num];

// L'intérieur de la grotte (dans la boule de cristal) : une bande de pixel art dessinée une fois, qui défile
const GROTTE = (() => {
  const W = 192, H = 64, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); let s = 11;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

  const rocher = (cx, cy, rx, ry, [fonce, base, clair]) => [cx, cx - W, cx + W].forEach(X => {
    for (let y = -ry; y <= ry; y++) {
      const w = Math.round(rx * Math.sqrt(1 - (y / (ry + .5)) ** 2));
      px(X - w - 1, cy + y, 2 * w + 2, 1, "#24180F");
      px(X - w, cy + y, 2 * w, 1, y < -ry / 3 ? clair : y > ry / 2 ? fonce : base);
    }
    px(X - Math.round(rx / 2), cy - ry + 1, 2, 1, "#B39575");
  });
  px(0, 0, W, H, "#2A1E15");
  const tons = [["#4A3626", "#6B4F3A", "#86684D"], ["#43311F", "#5E4632", "#7A5E45"], ["#523C2B", "#755A43", "#937457"]];
  for (let y = 12; y < 46; y += 7) for (let x = (y % 14 ? 0 : 8); x < W; x += 14 + Math.floor(rnd() * 6))  // la paroi
    rocher(x + Math.floor(rnd() * 4), y + Math.floor(rnd() * 3), 6 + Math.floor(rnd() * 3), 4, tons[Math.floor(rnd() * 3)]);
  px(0, 0, W, 9, "#1A110B");  // le plafond et ses stalactites
  for (let x = 3; x < W - 8; x += 9 + Math.floor(rnd() * 9)) {
    const h = 6 + Math.floor(rnd() * 10);
    for (let i = 0; i < h; i++) { const w = Math.max(1, Math.round(4 * (1 - i / h))); px(x - w, 8 + i, 2 * w, 1, "#5C4433"); px(x - w, 8 + i, 1, 1, "#8E7054"); }
  }
  px(0, 46, W, 18, "#7E6347"); px(0, 46, W, 1, "#3B2A1C"); px(0, 47, W, 1, "#9A7C5B");  // le sol, avec un chemin plus clair

  for (let x = 6; x < W - 10; x += 28 + Math.floor(rnd() * 22)) rocher(x, 60, 5, 2, tons[1]);  // cailloux devant
  const cristaux = Array.from({length: 6}, () => [Math.floor(rnd() * (W - 8)), 16 + Math.floor(rnd() * 22),

  return {c, W, H, cristaux};
})();

(function grotteAnimee(t) {

// Faire glisser la carte zoomée à la souris (au doigt, c'est le défilement normal du navigateur)
let GLISSE = null;
addEventListener("pointermove", e => { const g = GLISSE; if (!g) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (Math.hypot(dx, dy) > 4) g.bouge = true;
  if (g.bouge) { g.vue.scrollLeft = g.l - dx; g.vue.scrollTop = g.t - dy; g.vue.classList.add("glisse"); } });
addEventListener("pointerup", () => { const g = GLISSE; if (!g) return; g.vue.classList.remove("glisse");
  if (g.bouge) setTimeout(() => { if (GLISSE === g) GLISSE = null; }, 0); else GLISSE = null; });

// Le voyage depuis la dernière visite (29/10) : si le dresseur a avancé d'au moins SEUIL_VOYAGE points (ou atteint
// un nouveau lieu) depuis le dernier voyage regardé, un bandeau en haut de l'onglet et un bouton ▶ sur la carte
// assombrie le proposent ; le dresseur attend à l'ancienne place jusqu'au toucher, puis parcourt le chemin. En dessous du
// seuil : il est déjà à sa place, sans rien proposer, et les petits bouts s'additionnent jusqu'au voyage suivant
// (pkm_pos_vu_<partie> = la position du dernier voyage regardé, mise à jour seulement quand on le regarde).
const SEUIL_VOYAGE = 25;
let VOYAGE = null;
// Le replay suit les points d'effort cumulés (01/11) : la carte rejoue la journée et les balls sortent au moment où
// elles ont été gagnées. frise = pour chaque jour, points (c0 → c1) et position sur la carte (p0 → p1) : pendant un
// défi d'arène les points montent mais le dresseur reste à l'arène. En mode test : points = position.
const cumulV = () => TEST ? V.pos : (V.cumul ?? V.pos);
function posDeC(c) {
  if (TEST || !V.frise || !V.frise.length) return Math.min(c, V.pos);
  const f = V.frise;
  if (c <= f[0].c0) return f[0].p0;
  for (let i = f.length - 1; i >= 0; i--) if (c >= f[i].c0) return Math.min(f[i].p0 + Math.max(c - f[i].c0, 0), f[i].p1);
  return V.pos;
}
function jourDeC(c) {
  const f = V.frise || [];
  for (let i = f.length - 1; i >= 0; i--) if (c > f[i].c0 || i === 0) return f[i].jour;
  return D.aujourdhui;
}
function etatVoyage() {
  if (VOYAGE) return VOYAGE;
  let vu = NaN;
  try {
    vu = parseFloat(localStorage.getItem(`pkm_c_vu_${R.partie}`));
    if (isNaN(vu)) {  // avant le 01/11 : la position (sur la carte) du dernier voyage regardé
      const p = parseFloat(localStorage.getItem(`pkm_pos_vu_${R.partie}`));
      if (!isNaN(p)) { const f = (V.frise || []).find(x => x.p1 >= p); vu = f ? f.c0 + Math.max(p - f.p0, 0) : p; }
    }
  } catch (e) {}
  if (TEST && TEST.vu != null) vu = TEST.vu;
  const fin = cumulV();
  vu = Math.min(isNaN(vu) ? 0 : vu, fin);
  const p0 = posDeC(vu);
  const lieux = LIEUX.filter((l, k) => k && l.dist > p0 && l.dist <= V.pos).map(l => l.nom.replace(" (retour)", ""));
  const balls = TEST ? [] : CAPTURES.filter(c => c.c != null && c.c > vu + 1e-6 && c.c <= fin + 1e-6 && !/#(chen|anniv\d{4}|evo\d)$/.test(c.id))
    .sort((a, b) => a.c - b.c);
  const attente = fin - vu >= SEUIL_VOYAGE || lieux.length > 0 || balls.length > 0;
  if (attente) balls.forEach(c => EN_ROUTE.add(c.id));
  return (VOYAGE = {vu, p0, fin, gain: Math.round(fin - vu), lieux, balls, attente});
}
function texteVoyage(v) {
  const n = v.balls.filter(c => !estOuverte(c)).length;
  const der = v.lieux[v.lieux.length - 1], pts = `+${fr(v.gain)} pts` + (n ? ` · ${n} ball${n > 1 ? "s" : ""} à récupérer` : "");
  if (!der) return `${pts} depuis ta dernière visite`;
  const ville = /Bourg|Jadielle|Lavanville|Céladopole|Safrania|Azuria|Carmin|Parmanie|Cramois|Argenta/.test(der);
  return `${der === "Plateau Indigo" ? "Tu es arrivé au Plateau Indigo !" : ville ? `Tu es arrivé à ${der} !` : `Nouvelle étape : ${der}`} · ${pts}`;
}
function dessinerBandeauVoyage() {
  const b = document.getElementById("bandeau-voyage"), v = etatVoyage(), badge = aOuvrir().find(estBadge);
  if (badge) {  // un badge qui attend passe avant tout
    const n = numBadge(badge), a = LIEUX.filter(l => l.arene)[n - 1].arene;
    b.innerHTML = `<button class="bandeau-voyage or"><img class="ico g" ${a.image ? `data-badge="${IMG.badge(a.image)}"` : ""} src="${a.image ? IMG.badge(a.image) : IC.ligue}"><span>
      <b>${a.image ? `Tu as gagné le ${a.badge} !` : "Tu as conquis la Ligue !"}</b><small>${CHAMPIONS[n].nom} t'attend pour te le remettre · touche ici</small></span><i></i></button>`;
    b.querySelector("button").onclick = () => lancer(badge); badgesPropres(b);
    return;
  }
  b.innerHTML = ""; return;  // 01/11 : la carte est en haut de l'onglet, son bouton ▶ suffit
  b.innerHTML = `<button class="bandeau-voyage">${ico("carte", "g")}<span><b>Ton dresseur a avancé !</b>
    <small>${texteVoyage(v)} · voir le voyage</small></span><i></i></button>`;
  b.querySelector("button").onclick = () => { const cv = document.querySelector("#voyage .carte-cadre");
    cv.scrollIntoView({behavior: "smooth", block: "center"}); lancerVoyage(false); };
}
function lancerVoyage(immediat) {  // le toucher : la carte s'éclaire et le dresseur part
  const v = etatVoyage(); if (!v.attente) return;
  v.attente = false;
  if (TEST) TEST.vu = cumulV(); else try { localStorage.setItem(`pkm_c_vu_${R.partie}`, cumulV()); localStorage.setItem(`pkm_pos_vu_${R.partie}`, V.pos); } catch (e) {}
  const el = document.getElementById("voyage"), att = el.querySelector(".carte-attente");
  if (att) { att.classList.add("part"); setTimeout(() => att.remove(), 450); }
  voyagerDepuis(el, v, CENTRER, immediat); vibre(15);
}
// Une ball gagnée pendant le replay : elle sort au-dessus du dresseur, puis file vers « à ouvrir » (juste sous la carte)
function sortirBall(el, c) {
  const h = el.querySelector(".heros-ancre .suit"), cadre = el.querySelector(".carte-cadre");
  if (!h || !cadre) { EN_ROUTE.delete(c.id); return; }
  const rh = h.getBoundingClientRect(), rc = cadre.getBoundingClientRect(), spe = c.ball !== "poke";
  const b = document.createElement("div"); b.className = "ball-route" + (spe ? " spe" : "");
  b.innerHTML = `${ballSVG(c.ball)}${spe ? `<span>${BALLS[c.ball]} !</span>` : ""}`;
  b.style.left = rh.left + rh.width / 2 - rc.left + "px"; b.style.top = rh.top - rc.top + "px";
  cadre.appendChild(b);
  vibre(spe ? [20, 40, 20] : 12);
  try { if (spe) { ton(988, 0, .09, {type: "square", vol: .05}); ton(1319, .1, .16, {type: "square", vol: .05}); }
        else ton(1175, 0, .07, {type: "square", vol: .04}); } catch (e) {}
  setTimeout(() => {  // vers « à ouvrir »
    const cible = document.getElementById("aouvrir").getBoundingClientRect(), rb = b.getBoundingClientRect();
    b.classList.add("file");
    b.style.transform = `translate(${cible.left + cible.width / 2 - rb.left - rb.width / 2}px,${Math.min(cible.top + 40 - rb.top, 600)}px) scale(.45)`;
    setTimeout(() => { b.remove(); EN_ROUTE.delete(c.id); if (!ouverture) dessinerAOuvrir();
      const a = document.getElementById("aouvrir"); a.classList.remove("recu"); void a.offsetWidth; a.classList.add("recu"); }, 650);
  }, spe ? 1300 : 800);
}
let CENTRER = () => {};
function voyagerDepuis(el, v, centrer, immediat) {
  const vue = el.querySelector(".carte-vue"), g = el.querySelector("#chemin-anim"), ancre = el.querySelector(".heros-ancre");
  const cadre = el.querySelector(".carte-cadre"), c0 = v.vu, c1 = v.fin, p0 = v.p0;
  el.querySelectorAll(".ami-carte.toi").forEach(x => x.remove());  // l'étiquette de ton groupe resterait sur place pendant que tu marches
  // durée : selon ce qui a été fait (entre 3 et 9 s), un peu plus quand il y a des balls à voir sortir
  const T = ZC > 1 ? 1.25 : 1, duree = Math.min(9000, 2800 + (c1 - c0) * 7 + v.balls.length * 250);
  const balls = v.balls.slice(), jours = new Set((V.frise || []).filter(f => f.c1 > c0 && f.c0 < c1).map(f => f.jour));
  let suivre = true, cle = "", u = 0, avant = null, vite = false, attendu = false;
  ["pointerdown", "wheel", "touchstart"].forEach(ev => vue.addEventListener(ev, () => (suivre = false), {once: true, passive: true}));
  vue.addEventListener("click", () => { if (u < 1) vite = true; }, {once: true});  // toucher la carte : la fin tout de suite
  const puce = document.createElement("div"); puce.className = "puce-replay"; cadre.appendChild(puce);
  const JS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const date = j => { if (j === D.aujourdhui) return "Aujourd'hui"; const d = new Date(j + "T12:00");
    return `${JS[d.getDay()]} ${j.slice(8)}/${j.slice(5, 7)}`; };
  // la carte doit être à l'écran (l'onglet est long, et la page Streamlit est dans un cadre) : on attend qu'elle y soit
  const visible = () => { try {
    const f = window.frameElement, r = vue.getBoundingClientRect(), haut = (f ? f.getBoundingClientRect().top : 0) + r.top;
    const H = f ? parent.innerHeight : innerHeight; return haut < H * .75 && haut + r.height > H * .25;
  } catch (e) { return true; } };
  const pas = now => {
    if (!document.body.contains(g)) { balls.forEach(c => EN_ROUTE.delete(c.id)); puce.remove(); dessinerAOuvrir(); return; }
    if (!attendu) { if (!immediat && !visible()) return setTimeout(() => requestAnimationFrame(pas), 250);
      attendu = true; avant = now + (immediat ? 150 : 600); }
    if (now < avant) return requestAnimationFrame(pas);
    u = Math.min(1, u + (now - avant) / (vite ? 450 : duree)); avant = now;
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const c = u >= 1 ? c1 : c0 + (c1 - c0) * e, p = u >= 1 ? V.pos : posDeC(c), P = poseA(p);
    g.innerHTML = trajet(p0, p).map(x => traitFait(x, T)).join("");
    POSE = P;
    const k = [P.mode, P.dir, P.enRoute, P.arrete].join();
    if (k !== cle) { cle = k; ancre.innerHTML = heros(P); colorerDresseur(ancre); }
    else ancre.querySelectorAll(".suit").forEach(x => { x.style.left = P.x / LARG * 100 + "%"; x.style.top = P.y / HC * 100 + "%"; });
    if (suivre) centrer(P);
    puce.innerHTML = `${jours.size > 1 || jourDeC(c) !== D.aujourdhui ? `<b>${date(jourDeC(c))}</b> · ` : ""}+${fr(Math.round(c - c0))} pts`;
    while (balls.length && balls[0].c <= c + 1e-6) sortirBall(el, balls.shift());
    if (u < 1) return requestAnimationFrame(pas);
    setTimeout(() => { puce.classList.add("fin"); setTimeout(() => puce.remove(), 900); }, 1600);
    // arrivé à une arène pendant ce voyage : le champion se présente et lance son défi
    const d = V.defi;
    if (d && d.arrive && p0 < LIEUX[d.lieu].dist) setTimeout(() => { const ch = el.querySelector(".chef");
      if (ch && document.body.contains(ch)) { suivre && centrer(P); ch.click(); } }, 1200);
  };
  requestAnimationFrame(pas);
}

function dessinerVoyage() {
  const el = document.getElementById("voyage"), k = lieuVu ?? V.ici;

  }).join("");

      ${VY.attente ? "" : `<button class="carte-zoom discret" title="${ZC > 1 ? "Voir toute la carte" : "Revenir sur ton dresseur"}" aria-label="${ZC > 1 ? "Voir toute la carte" : "Revenir sur ton dresseur"}">
        <svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l5 5M6 8.5h5${ZC > 1 ? "" : "M8.5 6v5"}"/></svg></button>`}
      ${VY.attente ? `<button class="carte-attente"><span class="play"></span><b>Voir ton voyage</b><small>${texteVoyage(VY)}</small></button>` : ""}
</div>
    ${infosLieu(k)}

  requestAnimationFrame(() => setTimeout(() => el.querySelector(".avance div").style.width = V.pos / V.total * 100 + "%", 60));
  // la carte zoomée : centrée sur le dresseur ; on la fait glisser au doigt (ou à la souris sur le PC)

  const centrer = (P = POSE) => { if (!P || ZC <= 1) return;
    vue.scrollLeft = P.x / LARG * wrap.offsetWidth - vue.clientWidth / 2;

  centrer(); requestAnimationFrame(() => centrer());
  CENTRER = centrer;
  const att = el.querySelector(".carte-attente");
  if (att) att.onclick = () => lancerVoyage(true);
  dessinerBandeauVoyage();
  vue.addEventListener("click", e => { if (GLISSE && GLISSE.bouge) { e.stopPropagation(); e.preventDefault(); } }, true);
  const bz = el.querySelector(".carte-zoom");
  if (bz) bz.onclick = () => { echelle(ZC > 1 ? 1 : V.carte.zoom); dessinerVoyage(); vibre(10); };
  badgesPropres(el.querySelector(".boite-badges"));
  const brancher = () => { el.querySelectorAll(".coin img").forEach(i => i.onclick = () => fiche(PAR_NUM[i.dataset.n])); rognerImages(el); };

    el.querySelector(".infos-lieu").outerHTML = infosLieu(lieuVu); brancher(); vibre(10); });
  brancher();
  // le champion de la carte : sa pose de base ; il bouge quand on le touche
  const anims = new Map();
  el.querySelectorAll("canvas[data-sprite]").forEach(cv => anims.set(cv, championAnime(cv, cv.dataset.sprite, !!cv.dataset.fixe, !!cv.dataset.portrait)));
  colorerDresseur(el);
  // toucher le champion sur la carte : il parle (bulle), et son arène s'affiche sous la carte

  const chef = el.querySelector(".chef");

    el.querySelectorAll(".bulle-chef").forEach(b => b.remove());

    const H2 = b.offsetHeight, dessus = rm.top - rc.top - 10 - H2;

  };

    const n = +b.dataset.n; sceneBadge(n, CAPTURES.find(c => c.id.endsWith(n === 9 ? "#ligue" : `#badge${n}`)), true); });

    v.innerHTML = `<div class="boite"><div class="tete-e"><img src="${IMG.mini(acteur)}" alt=""><div><h3>Série terminée !</h3><small>${duree} secondes${nouveau && moi.record ? " · nouveau record !" : ""}</small></div></div>
        <small>${M.nom} comptées (corrige si le téléphone s'est trompé)</small><div class="regle"><button class="moins">−</button><b>${n}</b><button class="plus">+</button></div>
        <small class="veille">${veille}</small>${aMesures && sonde ? `<div><small>${VERSION_DETECTION} · ${sonde.debit()} mesures/s · plus grand trou ${sonde.trou()} ms</small></div>` : ""}</div>
      <button class="go suite">Série suivante (repos ${REPOS_SERIE} s)</button><button class="sec fini">J'ai fini</button>

    const c = v.querySelector(".regle b"), detecte = n;

    v.querySelector(".plus").onclick = () => { n++; c.textContent = n; };
    // Chaque série de Kiki part toute seule au prochain chargement de l'appli (même chemin que l'apprentissage) ; le bouton l'envoie tout de suite, avec le vrai nombre
    const quand = new Date().toISOString();
    const noter = () => { try {
      let deja = JSON.parse(localStorage.getItem("pkm_appr") || "[]").filter(x => x.quand !== quand);
      deja.push({type: `serie-${type}`, quand, version: VERSION_DETECTION, sens, detecte, fait: n, debit: sonde ? sonde.debit() : null, trou: sonde ? sonde.trou() : null, evenements: sonde ? sonde.evenements : [], colonnes: ["ms", "ax", "ay", "az", "bx", "by", "bz", "ra", "rb", "rg"], lignes: sonde ? sonde.brut : [], appareil: PW.navigator.userAgent.slice(0, 120)});
      localStorage.setItem("pkm_appr", JSON.stringify(deja.slice(-3))); return true;

    if (aMesures) { noter(); v.querySelector(".envoi").onclick = () => { if (noter()) { garder(); PW.location.reload(); } else v.querySelector(".envoi").textContent = "Série trop longue pour l'envoi : dis-le à Claude"; }; }
    const garder = () => {
      if (n <= 0 || essai) return;
      memoriser(`${TEST ? "test#" : D.prefixe}geste-${type}_${n}_${Date.now()}`);
      moi.derniere = n; moi.record = Math.max(moi.record || 0, n); mem[type] = moi; garderEntr(mem);
    };
    v.querySelector(".suite").onclick = () => { garder(); cible = Math.max(n, 1); repos(REPOS_SERIE); };
    v.querySelector(".fini").onclick = () => { garder(); fermer(); };
  }

  function repos(s) {  // récupérer entre deux séries, c'est ce qui permet d'en refaire une vraie
    nettoyer();
    v.innerHTML = `<div class="rythme">Repos</div><div class="gros">${s}</div><div class="rythme">Respire, secoue les bras. Prochaine série : ${cible}.</div><button class="go go-r">J'y retourne</button><button class="sec fini">J'ai fini</button>`;

    const el = v.querySelector(".gros");
    const t = setInterval(() => { s--; el.textContent = s; if (s === 10) parler("Dix secondes"); if (s <= 0) { clearInterval(t); ton(880, 0, .3, {type: "square", vol: .1}); vibre(200); decompte(M.decompte); } }, 1000);
    minuteurs.push(t);
  }
  reglage();
}

// L'apprentissage (Kiki seul, son idée, 03/11) : la voix le guide, il fait de vrais mouvements et de faux, et le téléphone enregistre tout ce que voient ses capteurs.
// Rechargé, l'appli range l'enregistrement dans le dépôt privé (app.py) : Claude règle la détection sur de vrais mouvements, plus sur des simulations.
const APPRENDRE = {
  squats: {consigne: "Tiens le téléphone comme pour un vrai squat, en paysage. La voix te guide pendant environ une minute et demie. Fais des mouvements propres.", attente: 5, etapes: [
    {nom: "immobile", dit: "Ne bouge plus.", ms: 4000},
    {nom: "vrais", dit: "Dix vrais squats. Suis le bip.", reps: 10, bas: 2000, haut: 1000},
    {nom: "repos", dit: "Repos, reste debout.", ms: 4000},
    {nom: "rapides", dit: "Cinq vrais squats, plus vite.", reps: 5, bas: 1000, haut: 700},
    {nom: "repos", dit: "Repos, reste debout.", ms: 4000},
    {nom: "petits", dit: "Dix tout petits mouvements. Un centimètre seulement.", reps: 10, bas: 700, haut: 700},
    {nom: "repos", dit: "Repos, reste debout.", ms: 4000},
    {nom: "bras", dit: "Sans plier les jambes, penche et bouge le téléphone avec les bras.", ms: 10000}]},
  tractions: {consigne: "Mets le téléphone au fond de ta poche. La voix te guide : cinq tractions propres, puis tu lâches, tu marches et tu sors le téléphone.", attente: 15, etapes: [
    {nom: "suspendu", dit: "Suspends-toi à la barre, sans bouger.", ms: 4000},
    {nom: "vrais", dit: "Cinq tractions propres, à ton rythme.", ms: 25000},
    {nom: "lacher", dit: "Lâche la barre et marche.", ms: 10000},
    {nom: "sortir", dit: "Sors le téléphone de ta poche.", ms: 6000}]},
};
function apprentissage(type) {
  preparerScene(); installerStyle("pkm-entr-style", STYLE_ENTR);
  const A = APPRENDRE[type], v = P.createElement("div"); v.className = "pkm-entr"; P.body.appendChild(v);
  let minuteurs = [], verrou = null, ligne = 0;
  const lignes = [], phases = [], t0 = performance.now(), rond = x => x == null ? null : Math.round(x * 100) / 100;
  const parler = t => { try { const s = PW.speechSynthesis; s.cancel(); const u = new PW.SpeechSynthesisUtterance(t); u.lang = "fr-FR"; s.speak(u); } catch (e) {} };
  const lire = e => {
    const t = performance.now(); if (t < ligne || lignes.length > 4000) return; ligne = t + 30;  // ~30 mesures par seconde
    const a = e.accelerationIncludingGravity || {}, b = e.acceleration || {}, r = e.rotationRate || {};
    lignes.push([Math.round(t - t0), rond(a.x), rond(a.y), rond(a.z), rond(b.x), rond(b.y), rond(b.z), rond(r.alpha), rond(r.beta), rond(r.gamma)]);
  };
  const fermer = () => { minuteurs.forEach(clearTimeout); PW.removeEventListener("devicemotion", lire); try { PW.speechSynthesis.cancel(); if (verrou) verrou.release(); } catch (e) {} v.remove(); };
  const attendre = ms => new Promise(r => minuteurs.push(setTimeout(r, ms)));
  v.innerHTML = `<div class="boite"><div class="tete-e"><h3>Apprentissage : ${ENTR[type].nom}</h3></div><p>${A.consigne}</p></div><button class="go">C'est parti</button><button class="sec retour">Retour</button>`;
  v.querySelector(".retour").onclick = fermer;
  v.querySelector(".go").onclick = async () => {
    audio(); parler("Prépare-toi.");
    for (const w of [PAGE_HAUTE(), PW]) { try { verrou = await w.navigator.wakeLock.request("screen"); break; } catch (e) {} }
    if (PW.DeviceMotionEvent && PW.DeviceMotionEvent.requestPermission) { try { await PW.DeviceMotionEvent.requestPermission(); } catch (e) {} }
    PW.addEventListener("devicemotion", lire);
    v.innerHTML = `<div class="gros etape-n">${A.attente}</div><div class="rythme etape">Mets-toi en place</div><button class="sec passer">Annuler</button>`;
    v.querySelector(".passer").onclick = fermer;
    const nb = v.querySelector(".etape-n"), txt = v.querySelector(".etape");
    for (let s = A.attente; s > 0; s--) { nb.textContent = s; await attendre(1000); }
    for (const e of A.etapes) {
      phases.push([e.nom, Math.round(performance.now() - t0)]); txt.textContent = e.dit; nb.textContent = ""; parler(e.dit); await attendre(e.reps ? 3500 : 0);
      if (e.reps) for (let i = 1; i <= e.reps; i++) {
        nb.textContent = i; phases.push([`${e.nom}-bas`, Math.round(performance.now() - t0)]); ton(392, 0, .14, {type: "triangle", vol: .12}); await attendre(e.bas);
        phases.push([`${e.nom}-haut`, Math.round(performance.now() - t0)]); ton(660, 0, .14, {type: "triangle", vol: .12}); await attendre(e.haut);
      } else await attendre(e.ms);
    }
    PW.removeEventListener("devicemotion", lire);
    parler("C'est fini, merci !"); ton(880, 0, .3, {type: "square", vol: .1});
    let fait = type === "tractions" ? 5 : null;
    v.innerHTML = `<div class="boite"><h3>Merci !</h3><p>${lignes.length} mesures enregistrées${lignes.length ? "" : " : les capteurs n'ont rien donné sur ce téléphone"}.</p>
        ${fait === null ? "" : `<small>Combien de tractions as-tu vraiment faites ?</small><div class="regle"><button class="moins">−</button><b>${fait}</b><button class="plus">+</button></div>`}</div>
      <button class="go envoyer">Envoyer à Claude</button><button class="sec retour">Ne pas envoyer</button><small style="color:#fff;text-align:center">L'appli se recharge pour l'envoyer dans ton dépôt privé.</small>`;
    v.querySelector(".retour").onclick = fermer;
    if (fait !== null) { const c = v.querySelector(".regle b"); v.querySelector(".moins").onclick = () => { fait = Math.max(fait - 1, 0); c.textContent = fait; }; v.querySelector(".plus").onclick = () => { fait++; c.textContent = fait; }; }
    v.querySelector(".envoyer").onclick = () => {
      let deja = []; try { deja = JSON.parse(localStorage.getItem("pkm_appr") || "[]"); } catch (e) {}
      deja.push({type, quand: new Date().toISOString(), fait, phases, colonnes: ["ms", "ax", "ay", "az", "bx", "by", "bz", "ra", "rb", "rg"], lignes, appareil: PW.navigator.userAgent.slice(0, 120)});
      try { localStorage.setItem("pkm_appr", JSON.stringify(deja.slice(-3))); PW.location.reload(); }
      catch (e) { v.querySelector(".envoyer").textContent = "Enregistrement trop gros : dis-le à Claude"; }
    };
  };
}
