<script>
const D = __DONNEES__;
const P = window.parent.document, PW = window.parent;
const COUL = D.couleurs, LEG = new Set(D.legendaires);
const DEX = D.dex.map(([num, nom, types]) => ({num, nom, types}));
const PAR_NUM = Object.fromEntries(DEX.map(p => [p.num, p]));
// Les images, directement dans le dépôt public PokeAPI/sprites
const IMG = {
  mini: (n, s) => `${D.images}/pokemon/${s ? "shiny/" : ""}${n}.png`,                    // 96 px, pixel art
  anim: (n, s) => `${D.images}/pokemon/other/showdown/${s ? "shiny/" : ""}${n}.gif`,      // animée
  hd: (n, s) => `${D.images}/pokemon/other/official-artwork/${s ? "shiny/" : ""}${n}.png`, // grande illustration
  badge: i => `${D.images}/badges/${i}.png`,
};
// Image animée absente (les tout derniers Pokémon) : la petite image à la place
const repli = (n, s) => `onerror="this.onerror=null;this.src='${IMG.mini(n, s)}'"`;
const V = D.voyage;
// La carte : l'image (pixels) ramenée à 370 de large ; les lieux sont placés en pixels de l'image
const KC = 370 / V.carte.largeur, HC = V.carte.hauteur * KC;
const LIEUX = V.lieux.map(l => ({...l, x: l.x * KC, y: l.y * KC, via: (l.via || []).map(([x, y]) => [x * KC, y * KC])}));
// Le tracé de chaque étape (depuis la précédente) en suivant les routes de la carte
const TRACE = LIEUX.map((l, k) => k ? [[LIEUX[k - 1].x, LIEUX[k - 1].y], ...l.via, [l.x, l.y]] : [[l.x, l.y]]);
const longueur = pts => pts.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]), 0);
function jusqua(pts, t) {  // le début d'un tracé, jusqu'à la fraction t de sa longueur
  let reste = longueur(pts) * t; const sortie = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = pts[i - 1], [c, d] = pts[i], l = Math.hypot(c - a, d - b);
    if (l >= reste) { sortie.push([a + (c - a) * (l ? reste / l : 0), b + (d - b) * (l ? reste / l : 0)]); return sortie; }
    reste -= l; sortie.push(pts[i]);
  }
  return sortie;
}
const LIEUX_DE = {};  // Pokémon -> lieux où on le trouve
LIEUX.forEach(l => l.pokemon.forEach(n => (LIEUX_DE[n] = LIEUX_DE[n] || []).push(l.nom)));
const RARES = new Set(V.rares || []);
// Le compagnon (sur la carte) : choisi dans la fiche d'un Pokémon (« numéro:shiny », gardé sur ce téléphone),
// sinon la dernière Poké Ball ouverte
let compagnon = null;
try { compagnon = localStorage.getItem("pkm_compagnon"); } catch (e) {}
function monCompagnon() {
  const col = collection();
  if (compagnon) {
    const [n, s] = compagnon.split(":"), c = (col[n] || []).find(x => String(+x.shiny) === s);
    if (c) return c;
  }
  return CAPTURES.filter(estOuverte).slice(-1)[0];
}
const BALLS = {poke: "Poké Ball", super: "Super Ball", hyper: "Hyper Ball", master: "Master Ball"};
const N3 = n => String(n).padStart(3, "0");
const fr = n => Math.round(n).toLocaleString("fr-FR");
const typesHTML = (ts, cls = "type") => ts.map(t => `<span class="${cls}" style="background:${COUL[t]}">${t}</span>`).join("");

// ---------- Poké Balls ouvertes (ce téléphone + la liste partagée avec la montre) ----------
let ouvertes = new Set();
try { ouvertes = new Set(JSON.parse(localStorage.getItem("pkm2_ouvertes") || "[]")); } catch (e) {}
const LIMITE = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);  // plus vieilles : comptées ouvertes
const estOuverte = c => ouvertes.has(c.id) || c.jour < LIMITE;
const garder = () => { try { localStorage.setItem("pkm2_ouvertes", JSON.stringify([...ouvertes].slice(-800))); } catch (e) {} };
const serveur = new Set(D.ouvertes || []);
let ouverture = false;  // une animation est en cours : on ne redessine pas l'écran dessous
// Envoie au script Google les Poké Balls ouvertes ici (ids vide : demande juste la liste à jour) ; ce qui a été ouvert
// sur la montre entre-temps arrive dans la réponse. Sans réseau : renvoyé au prochain affichage.
function partager(ids) {
  if (!D.jeu) return;
  const u = `${D.jeu.url}?quoi=ouvrir&ou=telephone&cle=${encodeURIComponent(D.jeu.cle)}&ids=${encodeURIComponent(ids.join(","))}`;
  fetch(u).then(r => r.json()).then(j => {
    if (!j.ok) return;
    const avant = ouvertes.size;
    j.ouvertes.forEach(id => { serveur.add(id); ouvertes.add(id); });
    if (ouvertes.size !== avant) { garder(); if (!ouverture) dessiner(); }
  }).catch(() => {});
}
serveur.forEach(id => ouvertes.add(id)); garder();
const memoriser = id => { ouvertes.add(id); garder(); partager([id]); };
const CAPTURES = D.captures.map(c => ({...c, nom: PAR_NUM[c.num].nom, types: PAR_NUM[c.num].types}));
const aOuvrir = () => CAPTURES.filter(c => !estOuverte(c));
function collection() {  // ce que le Pokédex montre : seulement les Poké Balls ouvertes
  const par = {};
  for (const c of CAPTURES) if (estOuverte(c)) (par[c.num] = par[c.num] || []).push(c);
  return par;
}

// ---------- Images sans leurs bords transparents ----------
// Les petites images ont de grandes marges vides : sans elles, tous les Pokémon ont la même taille à l'écran. -> [image recadrée, largeur, hauteur] (gardée en mémoire).
const ROGNEES = new Map();
function rogne(src) {
  if (!ROGNEES.has(src)) ROGNEES.set(src, new Promise(ok => {
    const im = new Image();
    im.crossOrigin = "anonymous";  // GitHub autorise la lecture des pixels (sinon : image telle quelle)
    im.onload = () => {
      try {
        const W = im.naturalWidth, H = im.naturalHeight, cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0);
        const d = ctx.getImageData(0, 0, W, H).data;
        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0) return ok([src, W, H]);
        const w = x1 - x0 + 1, h = y1 - y0 + 1, c2 = document.createElement("canvas");
        c2.width = w; c2.height = h; c2.getContext("2d").drawImage(cv, x0, y0, w, h, 0, 0, w, h);
        ok([c2.toDataURL(), w, h]);
      } catch (e) { ok([src, im.naturalWidth || 96, im.naturalHeight || 96]); }
    };
    im.onerror = () => ok([src, 96, 96]);
    im.src = src;
  }));
  return ROGNEES.get(src);
}
// Remplace les petites images d'un bloc (classe « rogne ») par leur version recadrée (Pokédex, carte…)
function rognerImages(racine) {
  racine.querySelectorAll("img.rogne:not([data-r])").forEach(img => {
    img.dataset.r = 1;
    rogne(img.src).then(([src]) => { img.src = src; });
  });
}

// ---------- Dessin d'une Poké Ball (SVG) ----------
let idSvg = 0;
function ballSVG(type) {
  const i = ++idSvg, haut = {poke: "#E3262E", super: "#2F6FD6", hyper: "#2A2A2E", master: "#6A3FB0"}[type];

// ----- Particules (étincelles, confettis) sur un canvas 2D -----
function Particules(canvas) {
  const ctx = canvas.getContext("2d"), parts = [];
  let W = 0, H = 0, dpr = 1;
  const taille = () => { dpr = Math.min(PW.devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight;
                         canvas.width = W * dpr; canvas.height = H * dpr; };
  taille();
  const etoile = (x, y, r, rot) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .28 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  };
  return {
    taille,
    jet(x, y, n, {couleurs = ["#fff"], vitesse = 6, forme = "etoile", taille: t = 6, vie = 1.2, gravite = .12, cercle = false} = {}) {
      for (let i = 0; i < n; i++) {
        const a = cercle ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2, v = vitesse * (.4 + Math.random() * .8);
        parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (forme === "confetti" ? 4 : 0), g: gravite,
          vie: vie * (.6 + Math.random() * .6), age: 0, t: t * (.5 + Math.random()), rot: Math.random() * 6,
          vr: (Math.random() - .5) * .3, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme});
      }
    },
    scintille(x, y, rayon, couleurs) {
      const a = Math.random() * Math.PI * 2, r = rayon * Math.sqrt(Math.random());
      parts.push({x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * .9, vx: 0, vy: -.3, g: 0, vie: .9, age: 0,
        t: 4 + Math.random() * 7, rot: 0, vr: .05, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme: "brille"});
    },
    dessiner(dt) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.age += dt;
        if (p.age > p.vie) { parts.splice(i, 1); continue; }
        const k = dt * 60; p.vx *= Math.pow(.97, k); p.vy = p.vy * Math.pow(.97, k) + p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
        const f = 1 - p.age / p.vie; ctx.globalAlpha = p.forme === "brille" ? Math.sin(Math.PI * p.age / p.vie) : Math.min(1, f * 1.5);
        ctx.fillStyle = p.c;
        if (p.forme === "confetti") { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2); ctx.restore(); }
        else if (p.forme === "rond") { ctx.beginPath(); ctx.arc(p.x, p.y, p.t * f, 0, 7); ctx.fill(); }
        else etoile(p.x, p.y, p.t * (p.forme === "brille" ? 1 : f), p.rot);
      }
      ctx.globalAlpha = 1;
      return parts.length;
    },
  };
}

const TEINTES = {poke: 0xE3262E, super: 0x2F6FD6, hyper: 0x2A2A2E, master: 0x6A3FB0};
function texture(type, haut) {

  const L = 512, H = 256, cv = P.createElement("canvas"); cv.width = L; cv.height = H;

    return Math.hypot(px - ax - t * dx, py - ay - t * dy); };

    const x = -Math.cos(phi) * Math.sin(th), y = Math.cos(th), z = Math.sin(phi) * Math.sin(th);

    if (haut && type === "hyper" && Math.abs(x) > .26 && Math.abs(x) < .46 && z > -.55 && y > .12) col = jaune;
    if (haut && type === "master") {
      if (Math.hypot(Math.abs(x) - .62, y - .5, z - .58) < .27) col = rose;
      if (z > .5) { const mx = x / .3, my = (y - .45) / .3;
        const dm = Math.min(seg(mx, my, -.8, -.7, -.8, .7), seg(mx, my, .8, -.7, .8, .7), seg(mx, my, -.8, .7, 0, -.1), seg(mx, my, .8, .7, 0, -.1));
        if (dm < .2) col = blanc; }

  haut.add(new THREE.Mesh(new THREE.SphereGeometry(R, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), mat(texture(type, true))));
  haut.add(new THREE.Mesh(new THREE.SphereGeometry(R * .985, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({color: 0x1B1B1F, side: THREE.BackSide, roughness: .8})));
  const bandeMat = new THREE.MeshStandardMaterial({color: 0x141414, roughness: .5});
  const bandeH = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeH.position.y = R * .035; haut.add(bandeH);
  const bandeB = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeB.position.y = -R * .035; ball.add(bandeB);
  // Le bouton, à l'avant
  const bouton = new THREE.Group(); bouton.position.set(0, 0, R * .96); ball.add(bouton);
  const anneau = new THREE.Mesh(new THREE.CylinderGeometry(R * .3, R * .3, R * .14, 48), bandeMat);
  anneau.rotation.x = Math.PI / 2; bouton.add(anneau);
  const btnMat = new THREE.MeshPhysicalMaterial({color: 0xF4F4F4, roughness: .25, clearcoat: 1, emissive: 0xffffff, emissiveIntensity: 0});
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(R * .19, R * .2, R * .1, 48), btnMat);
  btn.rotation.x = Math.PI / 2; btn.position.z = R * .07; bouton.add(btn);
  // Faisceau de lumière (à l'ouverture)
  const gc = P.createElement("canvas"); gc.width = 4; gc.height = 128; const g2 = gc.getContext("2d");
  const grd = g2.createLinearGradient(0, 0, 0, 128); grd.addColorStop(0, "rgba(255,255,255,0)"); grd.addColorStop(1, "rgba(255,255,255,1)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 4, 128);
  const fxMat = new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(gc), transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide});
  const faisceau = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.9, R * .85, R * 4.2, 48, 1, true), fxMat);
  faisceau.position.y = R * 2.1; ball.add(faisceau);
  const lumiere = new THREE.PointLight(0xffffff, 0, 8); lumiere.position.set(0, .3, 0); ball.add(lumiere);
  // Ombre au sol
  const oc = P.createElement("canvas"); oc.width = oc.height = 64; const o2 = oc.getContext("2d");
  const og = o2.createRadialGradient(32, 32, 0, 32, 32, 32); og.addColorStop(0, "rgba(0,0,0,.55)"); og.addColorStop(1, "rgba(0,0,0,0)");
  o2.fillStyle = og; o2.fillRect(0, 0, 64, 64);
  const ombre = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(oc), transparent: true, depthWrite: false}));
  ombre.rotation.x = -Math.PI / 2; ombre.position.y = -1.05; scene.add(ombre);

  const taille = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h;
    const cible = Math.min(w * .48, h * .42, 230);           // diamètre de la ball à l'écran, en pixels
    const hv = 2 * R * h / cible, d = hv / (2 * Math.tan(cam.fov * Math.PI / 360));
    cam.position.set(0, d * .12, d); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix(); base = cam.position.clone();
  };
  let base; taille();
  const coul = c => new THREE.Color(c);
  return {
    ball, taille,
    get y() { return ball.position.y; },
    set y(v) { ball.position.y = v; ombre.material.opacity = Math.max(0, 1 - v / 3); ombre.scale.setScalar(1 - Math.min(Math.max(v, 0), 3) * .15); },
    get rotY() { return ball.rotation.y; }, set rotY(v) { ball.rotation.y = v; },
    get rotZ() { return ball.rotation.z; }, set rotZ(v) { ball.rotation.z = v; },
    get x() { return ball.position.x; }, set x(v) { ball.position.x = v; },
    set echelle(v) { ball.scale.setScalar(v); ombre.visible = v > .3; },
    set ouverture(v) { pivot.rotation.x = -v; },
    set zoom(v) { cam.position.copy(base).multiplyScalar(1 / v); },
    lueurBouton(intensite, c = 0xffffff) { btnMat.emissive = coul(c); btnMat.emissiveIntensity = intensite; },
    interieur(c, i) { coeurMat.color = coul(c).multiplyScalar(i); },
    faisceau(op, c = 0xffffff) { fxMat.opacity = op; fxMat.color = coul(c); lumiere.color = coul(c); lumiere.intensity = op * 30; },
    rendre() { renderer.render(scene, cam); },
    ecran() { const v = new THREE.Vector3(); ball.getWorldPosition(v); v.project(cam);  // centre de la ball, en pixels
              return [(v.x + 1) / 2 * canvas.clientWidth, (1 - v.y) / 2 * canvas.clientHeight]; },
    fin() { renderer.dispose(); renderer.forceContextLoss && renderer.forceContextLoss(); },
  };
}

// ----- Repli en 2D (si three.js n'a pas pu se charger) -----
function Ball2D(el, type) {
  el.innerHTML = ballSVG(type);
  const s = {y: 0, rotY: 0, rotZ: 0, x: 0, echelle: 1, ouverture: 0};
  const maj = () => el.style.transform = `translate(${s.x * 60}px,${-s.y * 60}px) rotate(${s.rotZ}rad) scale(${s.echelle})`;
  const proxy = new Proxy(s, {set(o, k, v) { o[k] = v; maj(); return true; }});
  return Object.assign(proxy, {lueurBouton() {}, interieur() {}, faisceau() {}, rendre() {}, taille() {},
    set zoom(v) {}, ecran() { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }, fin() {}});
}

// ----- La séquence complète -----
function ouvrir(c, rejouer = false) {
  ouverture = true;
  installerStyle("pkm2-style", STYLE_VOILE);
  audio();  // le toucher qui ouvre autorise le son
  // Nouveau Pokémon = première capture ouverte de cette espèce
  const nouveau = rejouer ? CAPTURES.find(x => x.num === c.num && estOuverte(x)).id === c.id : !collection()[c.num];
  const r = {leg: c.legendaire, shiny: c.shiny, nouveau};
  const cls = r.leg ? "r-leg" : r.shiny ? "r-shiny" : r.nouveau ? "r-nouveau" : "r-version";
  const teinte = r.leg ? 0xFF8CE6 : r.shiny ? 0xFFD75A : r.nouveau ? 0x7FE8FF : 0xffffff;
  const couleursFx = r.leg ? ["#FF8CE6", "#B57BFF", "#7FD4FF", "#fff"] : r.shiny ? ["#FFE27A", "#FFCB05", "#fff"] :
                     r.nouveau ? ["#7FE8FF", "#fff", "#4CD3A0"] : ["#fff", "#C9D3EA"];

  const v = P.createElement("div"); v.id = "pkm-voile";
  v.innerHTML = `<div class="fond"></div><div class="rayons"></div><canvas class="scene"></canvas><div class="ball2d" hidden></div>
    <img class="poke" alt=""><canvas class="fx"></canvas><div class="flash"></div>
    <div class="haut"><button class="rond son">${son ? "🔊" : "🔇"}</button><div class="nom-ball">${BALLS[c.ball] || "Poké Ball"}</div>
      <button class="rond x">✕</button></div>
    <div class="aide">Touche la ${BALLS[c.ball] || "Poké Ball"} !<small>${c.raison}</small></div>
    <div class="carte"></div>`;
  P.body.appendChild(v); requestAnimationFrame(() => v.classList.add("vu"));
  const $ = s => v.querySelector(s), poke = $(".poke"), aide = $(".aide"), carte = $(".carte"), flash = $(".flash");
  const fx = Particules($(".fx"));
  let B;
  try { if (!window.THREE) throw 0; B = Ball3D($(".scene"), c.ball); }
  catch (e) { $(".scene").hidden = true; $(".ball2d").hidden = false; B = Ball2D($(".ball2d"), c.ball); }

  // Boucle d'affichage (dans la fenêtre parente : jamais ralentie)
  let fini = false, dernier = maintenant(), anims = [], brille = false;
  const boucle = now => {
    if (fini) return;
    const dt = Math.min((now - dernier) / 1000, .05); dernier = now;
    anims = anims.filter(a => a(now) !== false);
    if (brille) { const rc = poke.getBoundingClientRect();
      if (Math.random() < .5) fx.scintille(rc.left + rc.width / 2, rc.top + rc.height / 2, Math.max(rc.width, 80) * .65, couleursFx); }
    fx.dessiner(dt); B.rendre(); PW.requestAnimationFrame(boucle);
  };
  PW.requestAnimationFrame(boucle);
  const redim = () => { B.taille(); fx.taille(); }; PW.addEventListener("resize", redim);
  const tween = (ms, f, e = ease.inout) => new Promise((ok, ko) => { const t0 = maintenant();
    anims.push(now => { if (fini) { ko("fermé"); return false; } const t = Math.min((now - t0) / ms, 1); f(e(t), t); if (t >= 1) { ok(); return false; } }); });
  const pause = ms => new Promise((ok, ko) => setTimeout(() => fini ? ko("fermé") : ok(), ms));
  const touche = () => new Promise((ok, ko) => { const f = ev => { if (ev.target.closest("button")) return;
    v.removeEventListener("pointerdown", f); fini ? ko("fermé") : ok(); }; v.addEventListener("pointerdown", f); });
  const fermer = () => { if (fini) return; fini = true; ouverture = false; v.classList.add("fin"); PW.removeEventListener("resize", redim);
    setTimeout(() => { B.fin(); v.remove(); }, 320); dessiner(); };
  $(".x").onclick = fermer;
  $(".son").onclick = e => { son = !son; e.target.textContent = son ? "🔊" : "🔇"; try { localStorage.setItem("pkm_son", son ? "1" : "0"); } catch (x) {} };

  // La grande illustration officielle (chargée pendant que la ball tombe) ; sinon l'image animée
  poke.onerror = () => { poke.onerror = null; poke.src = IMG.anim(c.num, c.shiny); };
  poke.src = IMG.hd(c.num, c.shiny);

  const centre = () => B.ecran();
  (async () => {
    // 1. Elle tombe du ciel et rebondit
    B.y = 5; B.rotY = -Math.PI * 3;
    SONS.chute();
    await tween(950, (e, t) => { B.y = 5 * (1 - e); B.rotY = -Math.PI * 3 * (1 - ease.out(t)); }, ease.rebond);
    SONS.rebond(); vibre(20);
    if (rejouer) return devoiler(true);
    // 2. Elle attend qu'on la touche
    aide.classList.add("vu");
    let tAtt = maintenant(), attend = true;
    anims.push(now => { if (!attend) return false; const t = (now - tAtt) / 1000;
      B.y = .08 + Math.sin(t * 2.2) * .08; B.rotY = Math.sin(t * .9) * .5; B.lueurBouton(.25 + .25 * Math.sin(t * 4)); });
    await touche(); attend = false; aide.classList.remove("vu");
    await tween(250, e => { B.y = .08 * (1 - e); B.rotY *= (1 - e); B.lueurBouton(0); });
    // 3. Les secousses : une de plus quand c'est rare, et de plus en plus longues
    const n = r.leg || r.shiny || r.nouveau ? 4 : 3;
    for (let i = 0; i < n; i++) {
      await pause(380 + i * 260);
      SONS.secousse(); vibre(35);
      const amp = .42 + i * .04;
      await tween(620, (e, t) => { B.rotZ = Math.sin(t * Math.PI * 2) * amp * (1 - t * .3); B.x = Math.sin(t * Math.PI * 2) * .12;
        B.lueurBouton(Math.sin(t * Math.PI) * .9, 0xFF3030); B.zoom = 1 + (i + t) * .045; }, x => x);
      B.rotZ = 0; B.x = 0;
    }
    // 4. « Clic ! »
    await pause(300);
    SONS.clic(); vibre([15, 40, 15]);
    { const [x, y] = centre(); fx.jet(x, y - 40, 3, {couleurs: ["#FFE27A", "#fff"], vitesse: 5, taille: 12, vie: .9, gravite: .05}); }
    await pause(650);
    // 5. Elle s'éveille : lueur (blanche, dorée pour un shiny, multicolore pour un légendaire, bleue pour un nouveau)
    SONS.montee(.9);
    await tween(900, (e, t) => { B.lueurBouton(e * 3, teinte); B.x = (Math.random() - .5) * .06 * e; B.rotZ = (Math.random() - .5) * .08 * e;
      B.zoom = 1 + n * .045 + e * .08; });
    B.x = 0; B.rotZ = 0;
    devoiler(false);
  })().catch(() => {});

  async function devoiler(vite) {
    // 6. Elle s'ouvre : faisceau, flash, le Pokémon sort en silhouette puis prend ses couleurs
    v.classList.add(cls);
    if (!vite) { SONS.ouverture(); vibre(60); }
    B.interieur(teinte, 1);
    await tween(vite ? 200 : 360, e => { B.ouverture = e * 1.95; B.faisceau(e * .85, teinte); }, ease.back);
    flash.classList.add("go");
    const [x, y] = centre();
    fx.jet(x, y, vite ? 20 : 46, {couleurs: couleursFx, vitesse: 9, taille: 9, vie: 1.3, gravite: .04, cercle: true});
    poke.classList.add("sort"); SONS.materialise();
    v.classList.add("revele");
    await tween(500, e => { B.echelle = 1 - e; B.y = -e * .6; B.faisceau(.85 * (1 - e), teinte); }, ease.inout);
    await pause(vite ? 150 : 550);
    poke.classList.add("couleur"); vibre(r.nouveau || r.shiny ? [40, 60, 80] : 30);
    const pr = poke.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
    if (r.leg) { SONS.legendaire(); fx.jet(px, py, 90, {couleurs: couleursFx, vitesse: 12, taille: 10, vie: 2, gravite: .02, cercle: true}); }
    if (r.shiny) { SONS.shiny(); fx.jet(px, py, 60, {couleurs: couleursFx, vitesse: 8, taille: 11, vie: 1.8, gravite: .01}); }
    else if (r.nouveau) SONS.nouveau(); else SONS.version();
    if (r.nouveau && !r.leg) fx.jet(px, py - 40, 110, {couleurs: ["#FF5D5D", "#FFCB05", "#4CD3A0", "#6B8CFF", "#B57BFF", "#fff"],
      forme: "confetti", vitesse: 11, taille: 10, vie: 2.6, gravite: .16});
    brille = r.shiny || r.leg;
    setTimeout(() => poke.classList.add("danse"), 700);
    if (!rejouer) memoriser(c.id);
    montrerCarte();
  }

  function montrerCarte() {
    const col = collection(), especes = Object.keys(col).length, reste = aOuvrir();
    const shinys = Object.values(col).filter(l => l.some(x => x.shiny)).length;
    const badges = [r.nouveau ? `<span class="badge b-nouveau">NOUVEAU POKÉMON !</span>` : r.shiny ? "" : `<span class="badge b-version">CAPTURÉ !</span>`,
                    r.shiny ? `<span class="badge b-shiny">✨ SHINY</span>` : "", r.leg ? `<span class="badge b-leg">👑 LÉGENDAIRE</span>` : ""];
    carte.innerHTML = `<div class="badges">${badges.join("")}</div>
      <div class="no">N° ${N3(c.num)}</div><div class="nm">${c.nom}</div><div>${typesHTML(c.types, "pkm-type")}</div>
      <div class="ver">${c.shiny ? "✨ Shiny · " : ""}${c.lieu ? `📍 ${c.lieu}` : ""}</div>
      <div class="rs">${BALLS[c.ball] || "Poké Ball"} · ${c.raison} · ${c.quand}</div>
      <div class="compteur"><div><div class="l">Pokédex</div><div class="v">${especes} / 151</div><div class="j"><div style="width:${(especes - (r.nouveau && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div>
        <div><div class="l">Shiny ✨</div><div class="v">${shinys} / 151</div><div class="j"><div style="width:${(shinys - (c.shiny && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div></div>
      <div class="boutons">${reste.length && !rejouer ? `<button class="b1 suite">Ouvrir la suivante (${reste.length})</button>` : ""}
        <button class="${reste.length && !rejouer ? "b2" : "b1"} ok">${r.nouveau || r.shiny ? "Génial !" : "Super !"}</button></div>`;
    carte.querySelectorAll(".badge").forEach((b, i) => b.style.animationDelay = `${.15 + i * .18}s${b.classList.contains("b-nouveau") ? ",0s" : ""}`);
    setTimeout(() => { carte.classList.add("vu");
      setTimeout(() => { const j = carte.querySelectorAll(".compteur .j div");
        if (j[0]) j[0].style.width = especes / 1.51 + "%"; if (j[1]) j[1].style.width = shinys / 1.51 + "%"; }, 500); }, 350);
    carte.querySelector(".ok").onclick = fermer;
    const s = carte.querySelector(".suite");
    if (s) s.onclick = () => { fermer(); setTimeout(() => ouvrir(aOuvrir()[0]), 340); };
  }
}

function fiche(p) {
  installerStyle("pkm2-fiche-style", STYLE_FICHE);
  const col = collection(), mes = col[p.num] || [], a = mes.length > 0, leg = LEG.has(p.num);
  const normal = mes.find(c => !c.shiny), shiny = mes.find(c => c.shiny);
  const c0 = COUL[p.types[0]];
  const lieux = LIEUX_DE[p.num] || [];
  const ou = leg ? `👑 <b>Légendaire</b> : il n'apparaît que dans une <b>Master Ball</b> (ton objectif ${D.regles.master_jours} jours
      sur ${D.regles.master_fenetre}, ou la victoire à la Ligue Pokémon).`
    : `📍 <b>${lieux.join(", ")}</b> : les Poké Balls donnent surtout les Pokémon de l'endroit où tu es.
       <br>Plus de chances avec : <b>${[...new Set(p.types.flatMap(t => D.conseils[t] || []))].join(", ") || "toutes les activités"}</b>.
       <br>🏅 Les badges d'arène donnent un Pokémon du type du champion.`;
  const forme = (c, sh) => c
    ? `<div class="f ${sh ? "sh" : ""}" data-s="${sh ? 1 : 0}"><b>${sh ? "✨ Shiny" : "Normal"}</b>
        <img src="${IMG.anim(p.num, sh)}" ${repli(p.num, sh)}>${c.quand}<br>${c.lieu ? `📍 ${c.lieu}` : ""}</div>`
    : `<div class="f ${sh ? "sh" : ""}"><b>${sh ? "✨ Shiny" : "Normal"}</b><div class="trou">${sh ? "✨" : "?"}</div>
        ${sh ? "Pas encore : c'est rare (1 chance sur 33 environ)" : "Pas encore attrapé"}</div>`;
  const vue = normal ? false : !!shiny;  // la grande image : la forme attrapée (le normal d'abord)
  const f = P.createElement("div"); f.id = "pkm-fiche";
  f.innerHTML = `<div class="ombre"></div><div class="feuille"><div class="poignee"></div>
    <div class="tete" style="background:linear-gradient(135deg,${c0}55,#1C2740 70%)">
      <img class="grande ${a ? "" : "non"}" src="${a ? IMG.hd(p.num, vue) : IMG.mini(p.num, false)}">
      <div><div class="no">N° ${N3(p.num)}${leg ? " · Légendaire" : ""}</div><h3>${a ? p.nom : "???"}</h3>
        <div>${typesHTML(p.types, "pkm-type")}</div>
        <div class="sous">${a ? `Attrapé ${mes[0].quand}${mes[0].lieu ? ` · ${mes[0].lieu}` : ""}` : "Pas encore attrapé"}</div></div></div>
    <h4>Ses deux formes <span>${(normal ? 1 : 0) + (shiny ? 1 : 0)} / 2</span></h4>
    <div class="formes">${forme(normal, false)}${forme(shiny, true)}</div>
    ${a ? `<button class="compa"></button>` : ""}
    <h4>Où le trouver ?</h4><div class="ou">${RARES.has(p.num) ? "⭐ <b>Rare</b> : 3 fois moins de chances que les autres Pokémon de son lieu.<br>" : ""}${ou}</div>
    <button class="fermer">Fermer</button></div>`;
  P.body.appendChild(f); requestAnimationFrame(() => f.classList.add("vu"));
  const grande = f.querySelector(".grande"), compa = f.querySelector(".compa");
  let choisie = vue;  // la forme affichée : c'est elle qui accompagne
  const majCompa = () => { if (!compa) return; const ami = monCompagnon(), lui = ami && ami.num === p.num && ami.shiny === choisie;
    compa.className = "compa" + (lui ? " lui" : "");
    compa.textContent = lui ? `🐾 ${p.nom}${choisie ? " ✨" : ""} t'accompagne sur la carte` : `🐾 Il m'accompagne${choisie ? " (shiny)" : ""}`; };
  majCompa();
  if (compa) compa.onclick = () => { compagnon = `${p.num}:${+choisie}`;
    try { localStorage.setItem("pkm_compagnon", compagnon); } catch (e) {}
    majCompa(); dessinerVoyage(); vibre(20); };
  f.querySelectorAll(".f[data-s]").forEach(e => {
    if (+e.dataset.s === +vue) e.classList.add("on");
    e.onclick = () => { f.querySelectorAll(".f").forEach(x => x.classList.remove("on")); e.classList.add("on");
      choisie = e.dataset.s === "1"; majCompa();
      grande.style.opacity = 0; setTimeout(() => { grande.src = IMG.hd(p.num, choisie); grande.style.opacity = 1; }, 200); };
  });
  const fermer = () => { f.classList.remove("vu"); setTimeout(() => f.remove(), 350); };
  f.querySelector(".ombre").onclick = fermer; f.querySelector(".fermer").onclick = fermer;
  // glisser la feuille vers le bas pour la fermer
  const fe = f.querySelector(".feuille"); let y0 = null;
  fe.addEventListener("touchstart", e => { y0 = fe.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  fe.addEventListener("touchmove", e => { if (y0 === null) return; const d = e.touches[0].clientY - y0;
    if (d > 0) { fe.style.transition = "none"; fe.style.transform = `translateY(${d}px)`; } }, {passive: true});
  fe.addEventListener("touchend", e => { if (y0 === null) return; const d = e.changedTouches[0].clientY - y0; y0 = null;
    fe.style.transition = ""; if (d > 110) fermer(); else fe.style.transform = ""; });
}

// ---------- Le voyage dans Kanto ----------
let lieuVu = null;  // le lieu touché sur la carte (sinon : là où l'on est)
function cheminFait() {  // le tracé déjà parcouru, en suivant les routes, jusqu'à la position actuelle
  const L = LIEUX, pts = [[L[0].x, L[0].y]];
  for (let k = 1; k < L.length; k++) {
    if (V.pos >= L[k].dist) { pts.push(...TRACE[k].slice(1)); continue; }
    if (V.pos > L[k - 1].dist) pts.push(...jusqua(TRACE[k], (V.pos - L[k - 1].dist) / (L[k].dist - L[k - 1].dist)).slice(1));
    break;
  }
  return pts;
}
function svgKanto() {
  const L = LIEUX, fait = cheminFait(), [mx, my] = fait[fait.length - 1];
  const pt = pts => pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  // la suite du voyage : petits points discrets, de la position actuelle à la Ligue
  const k0 = L.findIndex(l => l.dist > V.pos);
  let reste = [];
  if (k0 > 0) {  // la fin de l'étape en cours (ce qui dépasse la partie faite), puis les étapes suivantes
    const t = (V.pos - L[k0 - 1].dist) / (L[k0].dist - L[k0 - 1].dist), n = jusqua(TRACE[k0], t).length;
    reste = [[mx, my], ...TRACE[k0].slice(n - 1), ...TRACE.slice(k0 + 1).flatMap(tr => tr.slice(1))];
  }
  const col = collection();
  const noeuds = L.map((l, k) => {
    if (k === 18) return "";  // Jadielle (retour) : même endroit que Jadielle
    const complet = l.pokemon.every(n => col[n]) && (k !== 2 || L[18].pokemon.every(n => col[n]));
    const k2 = k === 2 ? 18 : k, ar = L[k2].arene;  // Jadielle porte l'arène de Giovanni
    const num = ar ? L.filter((x, j) => x.arene && j <= k2).length : 0, gagne = num && V.badges[num];
    const atteint = V.pos >= l.dist, vise = V.defi && V.defi.lieu === k2;
    const ville = !!ar || /Bourg|Jadielle|Lavanville|Céladopole|Safrania|Azuria|Carmin|Parmanie|Cramois|Argenta|Plateau/.test(l.nom);
    const r = ville ? 5.2 : 3.6, bas = l.y > HC - 30 || l.nom === "Plateau Indigo";
    return `<g class="lieu" data-k="${k}">
      <circle class="choix" cx="${l.x}" cy="${l.y}" r="${r + 3.5}" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2"/>
      ${vise ? `<circle class="vise" cx="${l.x}" cy="${l.y}" r="${r + 2}" fill="none" stroke="#FFCB05" stroke-width="2"/>` : ""}
      <circle class="point" cx="${l.x}" cy="${l.y}" r="${r}" fill="${atteint ? (ville ? "#E8382F" : "#FFB020") : "#7C8AA8"}" stroke="#fff" stroke-width="1.6"/>
      ${ville ? `<circle cx="${l.x}" cy="${l.y}" r="${r * .38}" fill="#fff"/>` : ""}
      ${ar && ar.image ? `<image href="${IMG.badge(ar.image)}" x="${l.x + 3}" y="${l.y - 15}" width="12" height="12" opacity="${gagne ? 1 : .55}" style="${gagne ? "" : "filter:grayscale(1)"}"/>` : ""}
      ${ar && !ar.image ? `<text x="${l.x + 8}" y="${l.y - 5}" font-size="10" style="stroke:none">${gagne ? "🏆" : "🏟️"}</text>` : ""}
      ${complet ? `<text x="${l.x - 12}" y="${l.y - 4}" font-size="9" style="fill:#FFD84A">★</text>` : ""}
      ${ville ? `<text class="nom" x="${l.x}" y="${l.y + (bas ? -9 : 14)}" font-size="8" text-anchor="middle">${l.nom.replace(" et Parc Safari", "").replace("-sur-Mer", "")}</text>` : ""}
      <circle cx="${l.x}" cy="${l.y}" r="13" fill="transparent"/></g>`;
  }).join("");
  // Le compagnon ; pas encore de Pokémon : une Poké Ball
  const ami = monCompagnon();
  const moi = ami ? `<image href="${IMG.anim(ami.num, ami.shiny)}" x="${mx - 15}" y="${my - 30}" width="30" height="30" style="image-rendering:pixelated"/>`
    : `<image href="${D.images}/items/poke-ball.png" x="${mx - 12}" y="${my - 22}" width="24" height="24" style="image-rendering:pixelated"/>`;
  return `<svg class="carte-kanto" viewBox="0 0 370 ${HC.toFixed(1)}">
    <image href="${D.carte}" x="0" y="0" width="370" height="${HC.toFixed(1)}" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    <polyline points="${pt(reste)}" fill="none" stroke="#1B2A4A" stroke-width="1.8" stroke-dasharray="0.1 4.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
    <polyline points="${pt(fait)}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <polyline class="chemin-fait" points="${pt(fait)}" fill="none" stroke="#E8382F" stroke-width="2.8" stroke-linecap="round"
      stroke-linejoin="round" style="--l:${Math.ceil(longueur(fait)) + 2}"/>
    ${noeuds}
    <g class="moi"><ellipse cx="${mx}" cy="${my + 1}" rx="8" ry="2.6" fill="#000" opacity=".35"/>${moi}</g>
  </svg>`;
}

function infosLieu(k) {
  const l = LIEUX[k], col = collection(), pris = l.pokemon.filter(n => col[n]).length;
  const passe = V.pos >= l.dist, ici = k === V.ici, suite = LIEUX[k + 1], d = V.defi;
  const bloque = d && d.arrive && d.lieu === k;
  const depart = !ici || !suite ? "" : bloque ? "Tu repars après le badge de l'arène."
    : `Étape suivante : ${suite.nom}, dans ${fr(suite.dist - V.pos)} pts (≈ ${Math.max(1, Math.round((suite.dist - V.pos) / D.barre.taille))} barre${suite.dist - V.pos > 150 ? "s" : ""}).`;
  return `<div class="infos-lieu"><div class="nom">📍 ${l.nom}<small>${ici ? "tu es ici" : passe ? "déjà traversé" :
      `dans ${fr(l.dist - V.pos)} pts`}</small></div>
    <div class="petit gris" style="margin-top:3px">${pris === l.pokemon.length ? "★ Lieu complété : tous ses Pokémon sont à toi !"
      : `Pokémon du coin : ${pris} / ${l.pokemon.length} attrapés${l.pokemon.some(n => RARES.has(n)) ? " · ⭐ = rare" : ""}`}</div>
    <div class="coin">${l.pokemon.map(n => `<span class="pk"><img class="rogne ${col[n] ? "" : "non"}" data-n="${n}" src="${IMG.mini(n, false)}" loading="lazy"
      title="${col[n] ? PAR_NUM[n].nom : "???"}">${RARES.has(n) ? "<i>⭐</i>" : ""}</span>`).join("")}</div>
    ${depart ? `<div class="petit gris" style="margin-top:8px">${depart}</div>` : ""}</div>`;
}

function blocArene() {
  const d = V.defi;
  if (!d) return `<div class="arene"><div class="bdg ligue">🏆</div><div class="q"><div class="t">Champion de Kanto !</div>
      Les 8 badges et la Ligue sont à toi. La suite du voyage (Johto) arrive bientôt.</div></div>`;
  const l = LIEUX[d.lieu], a = l.arene, j = (v, c) => `<div class="jauge"><div class="${v >= c ? "ok" : ""}" style="width:${Math.min(v / c * 100, 100)}%"></div></div>`;
  const nomU = d.unite === "pas" ? "pas" : d.unite;
  const val = v => d.unite === "pas" ? fr(v) : Math.round(v * 10) / 10;
  const image = a.image ? `<img class="bdg" src="${IMG.badge(a.image)}">` : `<div class="bdg ligue">🏟️</div>`;
  const qui = a.type ? `Arène ${/^[AEIOUÉ]/.test(a.champion) ? "d'" : "de "}${a.champion} · type ${a.type}` : "Ligue Pokémon · Conseil 4";
  if (!d.arrive) return `<div class="arene">${image}<div class="q"><div class="t">${a.badge}</div>${qui} à <b>${l.nom}</b>
      <div class="reste">Encore ${fr(d.reste)} pts de route (≈ ${Math.max(1, Math.round(d.reste / D.barre.taille))} barre${d.reste > 150 ? "s" : ""} d'effort)</div>
      <div class="petit gris">Le défi : ${a.texte}${a.b ? `, ou ${a.b.texte}` : ""}.</div></div></div>`;
  const manque = Math.max(a.cible - d.valeur, 0);
  return `<div class="arene">${image}<div class="q"><div class="t">${qui}</div>
      <div><b>${a.texte}</b></div>${j(d.valeur, a.cible)}<div class="petit">${val(d.valeur)} / ${val(a.cible)} ${nomU}</div>
      ${a.b ? `<div class="ou-b">ou plan B</div><div>${a.b.texte}</div>${j(d.valeur_b, a.b.cible)}<div class="petit">${d.valeur_b} / ${a.b.cible} jours</div>` : ""}
      <div class="reste">${manque ? `Encore ${val(manque)} ${nomU}${a.b ? ` (ou ${Math.max(a.b.cible - d.valeur_b, 0)} jour${a.b.cible - d.valeur_b > 1 ? "s" : ""} d'objectif)` : ""}.
        Tes points continuent de compter : tu repartiras d'un coup.` : "Défi réussi !"}</div>
      <div class="petit gris">Compté sur les 7 derniers jours depuis ton arrivée (le ${V.defi.depuis ? V.defi.depuis.slice(8) + "/" + V.defi.depuis.slice(5, 7) : "—"}).</div></div></div>`;
}

function dessinerVoyage() {
  const el = document.getElementById("voyage"), k = lieuVu ?? V.ici;
  const badges = LIEUX.filter(l => l.arene).map((l, i) => {
    const n = i + 1, quand = V.badges[n];
    return l.arene.image ? `<div class="${quand ? "oui" : "non"}" title="${l.arene.badge}"><img src="${IMG.badge(l.arene.image)}"></div>`
      : `<div class="${quand ? "oui" : "non"}" title="Ligue">🏆</div>`;
  }).join("");
  el.innerHTML = `<div class="entete"><span class="titre">🗺️ Voyage dans Kanto</span>
      <span class="ou">Étape ${V.ici + 1} / ${LIEUX.length} · ${Math.floor(V.pos / V.total * 100)} %</span></div>
    <div class="avance"><div style="width:0"></div></div>
    ${blocArene()}${svgKanto()}${infosLieu(k)}
    <div class="boite-badges">${badges}</div>`;
  requestAnimationFrame(() => setTimeout(() => el.querySelector(".avance div").style.width = V.pos / V.total * 100 + "%", 60));
  const brancher = () => { el.querySelectorAll(".coin img").forEach(i => i.onclick = () => fiche(PAR_NUM[i.dataset.n])); rognerImages(el); };
  // toucher un lieu : il s'allume sur la carte et ses Pokémon s'affichent juste dessous (sans redessiner la carte)
  const choisir = k => el.querySelectorAll(".lieu").forEach(g => g.classList.toggle("choisi", +g.dataset.k === (k === 18 ? 2 : k)));
  choisir(k);
  el.querySelectorAll(".lieu").forEach(g => g.onclick = () => { lieuVu = +g.dataset.k; choisir(lieuVu);
    el.querySelector(".infos-lieu").outerHTML = infosLieu(lieuVu); brancher(); vibre(10); });
  brancher();
}

function dessinerRegles() {
  document.getElementById("regles").innerHTML = `
    <li>⚡ <b>Barre d'effort</b> (${D.barre.taille} points = une Poké Ball, elle ne se vide jamais) : 1 point par 100 pas au-delà de

      (au moins ${R.seance_min} min), ${R.force} par minute de musculation, pompes, tractions ou rameur.</li>
    <li>🧭 Les types qui sortent dépendent de ce qui a le plus rempli ta barre dans la journée (sans compter les pas) : 🔥 minutes en zone → Feu, Électrik, Combat, Dragon ; 🏋️ musculation → Combat, Acier ;
      🪜 étages → Roche, Sol, Acier ; 🌳 marche → Plante, Insecte, Poison ; 🚴 vélo → Vol, Normal ; 🚣 rameur, 🏊 natation → Eau, Glace ;
      🏞️ elliptique → Psy, Spectre, Fée ; 👟 pas → tous les types.</li>
    <li>🎯 <b>Super Ball</b> : ${fr(R.objectif_pas)} pas <b>et</b> ${R.objectif_zone} min en zone dans la journée.</li>
    <li>⭐ <b>Hyper Ball</b> : ${fr(R.exploit_pas)} pas, ${R.exploit_zone} min en zone ou une séance de ${R.exploit_seance} min.</li>
    <li>👑 <b>Master Ball</b> : ${R.master_jours} jours sur les ${R.master_fenetre} derniers avec ${fr(R.objectif_pas)} pas ou ${R.objectif_zone} min en zone = un légendaire.
      Un jour raté ne remet rien à zéro : il sort du compte ${R.master_fenetre} jours plus tard.</li>
    <li>😴 Une nuit de ${R.nuit / 60} h ne donne pas de ball, mais rend les shiny 1,5 fois plus fréquents ce jour-là.</li>
    <li>🗺️ <b>Voyage dans Kanto</b> : les mêmes points te font avancer tout seul sur la carte, dans l'ordre des jeux, de Bourg Palette
      au Plateau Indigo (environ 3 mois, 4 à 5 barres par lieu). Rien à choisir : bouge, tu avances.</li>
    <li>📍 Les Poké Balls donnent surtout les Pokémon de l'endroit où tu es, parfois ceux que tu as ratés plus tôt ou ceux de l'étape

      Plus rien de nouveau autour de toi : la ball pioche dans tout Kanto, donc aucune n'est perdue.</li>
    <li>🐾 <b>Compagnon</b> : il marche avec toi sur la carte. Choisis-le dans la fiche d'un Pokémon (sinon, c'est ta dernière capture).</li>
    <li>🏅 <b>Arènes</b> : dans chaque ville à arène, un défi sur 7 jours (ou son plan B : ${fr(R.objectif_pas)} pas ou ${R.objectif_zone} min en zone
      6 jours sur 7). Tes points continuent de compter pendant ce temps. Badge = une Hyper Ball du type du champion ; la Ligue = une Master Ball.</li>
    <li>Jamais de doublon : chaque capture est un Pokémon que tu n'avais pas (ou son shiny).</li>`;
}
