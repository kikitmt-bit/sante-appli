<script>
const D = __DONNEES__;
const P = window.parent.document, PW = window.parent;
const COUL = D.couleurs, LEG = new Set(D.legendaires);
const DEX = D.dex.map(([num, nom, types]) => ({num, nom, types}));
const PAR_NUM = Object.fromEntries(DEX.map(p => [p.num, p]));
// Les images, directement dans le dépôt public PokeAPI/sprites
const IMG = {
  mini: (n, s) => `${D.images}/pokemon/${s ? "shiny/" : ""}${n}.png`,                    // 96 px, pixel art
  anim: (n, s) => `${D.images}/pokemon/other/showdown/${s ? "shiny/" : ""}${n}.gif`,      // animée
  hd: (n, s) => `${D.images}/pokemon/other/official-artwork/${s ? "shiny/" : ""}${n}.png`, // grande illustration
  badge: i => `${D.images}/badges/${i}.png`,
};
// Image animée absente (les tout derniers Pokémon) : la petite image à la place
const repli = (n, s) => `onerror="this.onerror=null;this.src='${IMG.mini(n, s)}'"`;
const V = D.voyage;
// La carte : l'image (pixels) ramenée à 370 de large ; les lieux sont placés en pixels de l'image
const KC = 370 / V.carte.largeur, HC = V.carte.hauteur * KC;
const LIEUX = V.lieux.map(l => ({...l, x: l.x * KC, y: l.y * KC, via: (l.via || []).map(([x, y]) => [x * KC, y * KC])}));
// Le tracé de chaque étape (depuis la précédente) en suivant les routes de la carte
// (un vol : un arc, comme la CS Vol, pour ne pas repasser par une route déjà faite)
const TRACE = LIEUX.map((l, k) => {
  if (!k) return [[l.x, l.y]];
  const a = [LIEUX[k - 1].x, LIEUX[k - 1].y], b = [l.x, l.y];
  if (l.mode !== "vol") return [a, ...l.via, b];
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
  let nx = -dy / d, ny = dx / d; if (ny > 0 || (ny === 0 && nx < 0)) { nx = -nx; ny = -ny; }  // l'arc monte
  const c = [(a[0] + b[0]) / 2 + nx * d * .3, (a[1] + b[1]) / 2 + ny * d * .3];
  return Array.from({length: 17}, (_, i) => { const t = i / 16, u = 1 - t;
    return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; });
});
const longueur = pts => pts.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]), 0);
function jusqua(pts, t) {  // le début d'un tracé, jusqu'à la fraction t de sa longueur
  let reste = longueur(pts) * t; const sortie = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = pts[i - 1], [c, d] = pts[i], l = Math.hypot(c - a, d - b);
    if (l >= reste) { sortie.push([a + (c - a) * (l ? reste / l : 0), b + (d - b) * (l ? reste / l : 0)]); return sortie; }
    reste -= l; sortie.push(pts[i]);
  }
  return sortie;
}
const LIEUX_DE = {};  // Pokémon -> lieux où on le trouve
LIEUX.forEach(l => l.pokemon.forEach(n => (LIEUX_DE[n] = LIEUX_DE[n] || []).push(l.nom)));
const RARES = new Set(V.rares || []);
// Qui t'emmène pour un vol (type Vol) ou en mer (type Eau) : ta dernière capture du bon type ; personne : à vélo (vol
// sur la terre), en bateau (vol au-dessus de la mer) ou un Lokhlass sauvage (mer). Rien à choisir, jamais bloquant.
function monture(mode) {
  const type = mode === "vol" ? "Vol" : "Eau";
  return CAPTURES.filter(c => estOuverte(c) && c.types.includes(type)).slice(-1)[0] || null;
}
const enMer = k => /Îles|Cramois/.test(LIEUX[k].nom + LIEUX[k - 1].nom);  // l'étape k passe au-dessus de la mer
function dessinMonture(k, x, y, t) {  // le Pokémon (ou le vélo, le bateau) qui porte pendant l'étape k, centré en x, posé en y
  const mode = LIEUX[k].mode, m = monture(mode);
  const img = src => `<image href="${src}" x="${x - t / 2}" y="${y - t}" width="${t}" height="${t}" style="image-rendering:pixelated"/>`;
  if (m) return img(IMG.anim(m.num, m.shiny));
  if (mode === "vol" && enMer(k)) return `<text x="${x}" y="${y - t * .15}" font-size="${t * .7}" text-anchor="middle" style="stroke:none">⛵</text>`;
  return img(mode === "vol" ? `${D.images}/items/bicycle.png` : IMG.anim(131, false));
}
const BALLS = {poke: "Poké Ball", super: "Super Ball", hyper: "Hyper Ball", master: "Master Ball"};

// ---------- Poké Balls ouvertes (ce téléphone + la liste partagée avec la montre) ----------
let ouvertes = new Set();
try { ouvertes = new Set(JSON.parse(localStorage.getItem("pkm2_ouvertes") || "[]")); } catch (e) {}
const LIMITE = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);  // plus vieilles : comptées ouvertes
const estOuverte = c => ouvertes.has(c.id) || c.jour < LIMITE;
const garder = () => { try { localStorage.setItem("pkm2_ouvertes", JSON.stringify([...ouvertes].slice(-800))); } catch (e) {} };
const serveur = new Set(D.ouvertes || []);
let ouverture = false;  // une animation est en cours : on ne redessine pas l'écran dessous
// Envoie au script Google les Poké Balls ouvertes ici (ids vide : demande juste la liste à jour) ; ce qui a été ouvert
// sur la montre entre-temps arrive dans la réponse. Sans réseau : renvoyé au prochain affichage.
function partager(ids) {
  if (!D.jeu) return;
  const u = `${D.jeu.url}?quoi=ouvrir&ou=telephone&cle=${encodeURIComponent(D.jeu.cle)}&ids=${encodeURIComponent(ids.join(","))}`;
  fetch(u).then(r => r.json()).then(j => {
    if (!j.ok) return;
    const avant = ouvertes.size;
    j.ouvertes.forEach(id => { serveur.add(id); ouvertes.add(id); });
    if (ouvertes.size !== avant) { garder(); if (!ouverture) dessiner(); }
  }).catch(() => {});
}
serveur.forEach(id => ouvertes.add(id)); garder();
const memoriser = id => { ouvertes.add(id); garder(); partager([id]); };
const CAPTURES = D.captures.map(c => ({...c, nom: PAR_NUM[c.num].nom, types: PAR_NUM[c.num].types}));
const aOuvrir = () => CAPTURES.filter(c => !estOuverte(c));
function collection() {  // ce que le Pokédex montre : seulement les Poké Balls ouvertes
  const par = {};
  for (const c of CAPTURES) if (estOuverte(c)) (par[c.num] = par[c.num] || []).push(c);
  return par;
}

// ---------- Images sans leurs bords transparents ----------
// Les petites images ont de grandes marges vides : sans elles, tous les Pokémon ont la même taille à l'écran. -> [image recadrée, largeur, hauteur] (gardée en mémoire).
const ROGNEES = new Map();
function rogne(src) {
  if (!ROGNEES.has(src)) ROGNEES.set(src, new Promise(ok => {
    const im = new Image();
    im.crossOrigin = "anonymous";  // GitHub autorise la lecture des pixels (sinon : image telle quelle)
    im.onload = () => {
      try {
        const W = im.naturalWidth, H = im.naturalHeight, cv = document.createElement("canvas");
        cv.width = W; cv.height = H;
        const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0);
        const d = ctx.getImageData(0, 0, W, H).data;
        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        if (x1 < 0) return ok([src, W, H]);
        const w = x1 - x0 + 1, h = y1 - y0 + 1, c2 = document.createElement("canvas");
        c2.width = w; c2.height = h; c2.getContext("2d").drawImage(cv, x0, y0, w, h, 0, 0, w, h);
        ok([c2.toDataURL(), w, h]);
      } catch (e) { ok([src, im.naturalWidth || 96, im.naturalHeight || 96]); }
    };
    im.onerror = () => ok([src, 96, 96]);
    im.src = src;
  }));
  return ROGNEES.get(src);
}
// Remplace les petites images d'un bloc (classe « rogne ») par leur version recadrée (Pokédex, carte…)
function rognerImages(racine) {
  racine.querySelectorAll("img.rogne:not([data-r])").forEach(img => {
    img.dataset.r = 1;
    rogne(img.src).then(([src]) => { img.src = src; });
  });
}

let AC = null, son = true;

function audio() {
  if (!AC) { const A = PW.AudioContext || PW.webkitAudioContext; if (A) AC = new A(); }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function ton(f, t0, dur, {type = "sine", vol = .2, f2 = null, att = .005} = {}) {
  const a = audio(); if (!a || !son) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function bruit(t0, dur, {vol = .2, f = 2000, type = "bandpass"} = {}) {
  const a = audio(); if (!a || !son) return;
  const t = a.currentTime + t0, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate);
  const d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
  s.buffer = b; fl.type = type; fl.frequency.value = f; g.gain.value = vol;
  s.connect(fl).connect(g).connect(a.destination); s.start(t);
}

const SONS = {
  chute() { ton(1400, 0, .35, {type: "triangle", vol: .05, f2: 380}); },
  rebond() { ton(150, 0, .2, {vol: .45, f2: 55}); bruit(0, .08, {vol: .25, f: 700, type: "lowpass"}); },
  secousse() { bruit(0, .05, {vol: .35, f: 2600}); ton(330, 0, .07, {type: "square", vol: .05});

  clic() { ton(1900, 0, .06, {type: "square", vol: .07}); ton(2850, .08, .09, {type: "square", vol: .07}); },
  montee(d) { ton(180, 0, d, {type: "sawtooth", vol: .05, f2: 1300, att: d * .8}); ton(360, 0, d, {vol: .06, f2: 2600, att: d * .8}); },

  materialise() { [0, 4, 7, 12, 16].forEach((n, i) => ton(NOTE(72 + n), i * .045, .25, {type: "triangle", vol: .06})); },
  version() { [[76, 0], [79, .1], [84, .2]].forEach(([n, t]) => ton(NOTE(n), t, .35, {type: "triangle", vol: .16})); },

// ---------- Petits outils d'animation ----------
const ease = {
  out: t => 1 - Math.pow(1 - t, 3), inout: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  rebond: t => { const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
};

// ----- Particules (étincelles, confettis) sur un canvas 2D -----
function Particules(canvas) {
  const ctx = canvas.getContext("2d"), parts = [];
  let W = 0, H = 0, dpr = 1;
  const taille = () => { dpr = Math.min(PW.devicePixelRatio || 1, 2); W = canvas.clientWidth; H = canvas.clientHeight;
                         canvas.width = W * dpr; canvas.height = H * dpr; };
  taille();
  const etoile = (x, y, r, rot) => {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .28 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();

    taille,
    jet(x, y, n, {couleurs = ["#fff"], vitesse = 6, forme = "etoile", taille: t = 6, vie = 1.2, gravite = .12, cercle = false} = {}) {
      for (let i = 0; i < n; i++) {
        const a = cercle ? i / n * Math.PI * 2 : Math.random() * Math.PI * 2, v = vitesse * (.4 + Math.random() * .8);
        parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (forme === "confetti" ? 4 : 0), g: gravite,
          vie: vie * (.6 + Math.random() * .6), age: 0, t: t * (.5 + Math.random()), rot: Math.random() * 6,
          vr: (Math.random() - .5) * .3, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme});
      }
    },
    scintille(x, y, rayon, couleurs) {
      const a = Math.random() * Math.PI * 2, r = rayon * Math.sqrt(Math.random());
      parts.push({x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * .9, vx: 0, vy: -.3, g: 0, vie: .9, age: 0,
        t: 4 + Math.random() * 7, rot: 0, vr: .05, c: couleurs[Math.floor(Math.random() * couleurs.length)], forme: "brille"});
    },
    dessiner(dt) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.age += dt;
        if (p.age > p.vie) { parts.splice(i, 1); continue; }
        const k = dt * 60; p.vx *= Math.pow(.97, k); p.vy = p.vy * Math.pow(.97, k) + p.g * k; p.x += p.vx * k; p.y += p.vy * k; p.rot += p.vr * k;
        const f = 1 - p.age / p.vie; ctx.globalAlpha = p.forme === "brille" ? Math.sin(Math.PI * p.age / p.vie) : Math.min(1, f * 1.5);
        ctx.fillStyle = p.c;
        if (p.forme === "confetti") { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2); ctx.restore(); }
        else if (p.forme === "rond") { ctx.beginPath(); ctx.arc(p.x, p.y, p.t * f, 0, 7); ctx.fill(); }
        else etoile(p.x, p.y, p.t * (p.forme === "brille" ? 1 : f), p.rot);
      }
      ctx.globalAlpha = 1;
      return parts.length;
    },
  };
}

// ----- La Poké Ball en 3D (three.js) -----
const TEINTES = {poke: 0xE3262E, super: 0x2F6FD6, hyper: 0x2A2A2E, master: 0x6A3FB0};
function texture(type, haut) {
  // Texture dessinée point par point : (u, v) -> point de la sphère -> couleur (bandes, cercles, « M »…)
  const L = 512, H = 256, cv = P.createElement("canvas"); cv.width = L; cv.height = H;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(L, H), d = img.data;
  const hex = h => [h >> 16 & 255, h >> 8 & 255, h & 255];
  const blanc = [242, 242, 242], base = hex(TEINTES[type]), rouge = hex(0xE3262E), jaune = hex(0xFFCB05), rose = hex(0xE04BA0);
  const seg = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
    return Math.hypot(px - ax - t * dx, py - ay - t * dy); };
  for (let r = 0; r < H; r++) for (let c = 0; c < L; c++) {
    const phi = c / L * Math.PI * 2, th = (haut ? 0 : Math.PI / 2) + r / H * Math.PI / 2;
    const x = -Math.cos(phi) * Math.sin(th), y = Math.cos(th), z = Math.sin(phi) * Math.sin(th);
    let col = haut ? base : blanc;
    if (haut && type === "super" && Math.abs(x) > .44 && Math.abs(x) < .7 && z > -.25) col = rouge;
    if (haut && type === "hyper" && Math.abs(x) > .26 && Math.abs(x) < .46 && z > -.55 && y > .12) col = jaune;
    if (haut && type === "master") {
      if (Math.hypot(Math.abs(x) - .62, y - .5, z - .58) < .27) col = rose;
      if (z > .5) { const mx = x / .3, my = (y - .45) / .3;
        const dm = Math.min(seg(mx, my, -.8, -.7, -.8, .7), seg(mx, my, .8, -.7, .8, .7), seg(mx, my, -.8, .7, 0, -.1), seg(mx, my, .8, .7, 0, -.1));
        if (dm < .2) col = blanc; }
    }
    const i = (r * L + c) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

function Ball3D(canvas, type) {
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(PW.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, .1, 100);
  scene.add(new THREE.HemisphereLight(0xCFDCFF, 0x1A1A2A, 1.4));
  const cle = new THREE.DirectionalLight(0xffffff, 2.6); cle.position.set(3, 5, 6); scene.add(cle);
  const contre = new THREE.DirectionalLight(0x8FB0FF, 2.2); contre.position.set(-5, 2, -4); scene.add(contre);
  const R = 1, mat = (map, opts = {}) => new THREE.MeshPhysicalMaterial({map, roughness: .32, metalness: .05, clearcoat: 1,
    clearcoatRoughness: .12, ...opts});
  const ball = new THREE.Group(), pivot = new THREE.Group(); scene.add(ball);
  // Moitié du bas + intérieur lumineux
  const bas = new THREE.Mesh(new THREE.SphereGeometry(R, 64, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat(texture(type, false)));
  ball.add(bas);
  const coeurMat = new THREE.MeshBasicMaterial({color: 0x222222});
  const coeur = new THREE.Mesh(new THREE.CircleGeometry(R * .97, 48), coeurMat); coeur.rotation.x = -Math.PI / 2; coeur.position.y = -.01; ball.add(coeur);
  // Moitié du haut : charnière à l'arrière (elle bascule vers l'arrière en s'ouvrant)
  pivot.position.set(0, 0, -R); ball.add(pivot);
  const haut = new THREE.Group(); haut.position.set(0, 0, R); pivot.add(haut);
  haut.add(new THREE.Mesh(new THREE.SphereGeometry(R, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), mat(texture(type, true))));
  haut.add(new THREE.Mesh(new THREE.SphereGeometry(R * .985, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshStandardMaterial({color: 0x1B1B1F, side: THREE.BackSide, roughness: .8})));
  const bandeMat = new THREE.MeshStandardMaterial({color: 0x141414, roughness: .5});
  const bandeH = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeH.position.y = R * .035; haut.add(bandeH);
  const bandeB = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, R * .07, 64, 1, true), bandeMat);
  bandeB.position.y = -R * .035; ball.add(bandeB);
  // Le bouton, à l'avant
  const bouton = new THREE.Group(); bouton.position.set(0, 0, R * .96); ball.add(bouton);
  const anneau = new THREE.Mesh(new THREE.CylinderGeometry(R * .3, R * .3, R * .14, 48), bandeMat);
  anneau.rotation.x = Math.PI / 2; bouton.add(anneau);
  const btnMat = new THREE.MeshPhysicalMaterial({color: 0xF4F4F4, roughness: .25, clearcoat: 1, emissive: 0xffffff, emissiveIntensity: 0});
  const btn = new THREE.Mesh(new THREE.CylinderGeometry(R * .19, R * .2, R * .1, 48), btnMat);
  btn.rotation.x = Math.PI / 2; btn.position.z = R * .07; bouton.add(btn);
  // Faisceau de lumière (à l'ouverture)
  const gc = P.createElement("canvas"); gc.width = 4; gc.height = 128; const g2 = gc.getContext("2d");
  const grd = g2.createLinearGradient(0, 0, 0, 128); grd.addColorStop(0, "rgba(255,255,255,0)"); grd.addColorStop(1, "rgba(255,255,255,1)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 4, 128);
  const fxMat = new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(gc), transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide});
  const faisceau = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.9, R * .85, R * 4.2, 48, 1, true), fxMat);
  faisceau.position.y = R * 2.1; ball.add(faisceau);
  const lumiere = new THREE.PointLight(0xffffff, 0, 8); lumiere.position.set(0, .3, 0); ball.add(lumiere);
  // Ombre au sol
  const oc = P.createElement("canvas"); oc.width = oc.height = 64; const o2 = oc.getContext("2d");
  const og = o2.createRadialGradient(32, 32, 0, 32, 32, 32); og.addColorStop(0, "rgba(0,0,0,.55)"); og.addColorStop(1, "rgba(0,0,0,0)");
  o2.fillStyle = og; o2.fillRect(0, 0, 64, 64);
  const ombre = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 2.4), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(oc), transparent: true, depthWrite: false}));
  ombre.rotation.x = -Math.PI / 2; ombre.position.y = -1.05; scene.add(ombre);

  const taille = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h;
    const cible = Math.min(w * .48, h * .42, 230);           // diamètre de la ball à l'écran, en pixels
    const hv = 2 * R * h / cible, d = hv / (2 * Math.tan(cam.fov * Math.PI / 360));
    cam.position.set(0, d * .12, d); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix(); base = cam.position.clone();
  };
  let base; taille();
  const coul = c => new THREE.Color(c);
  return {
    ball, taille,
    get y() { return ball.position.y; },
    set y(v) { ball.position.y = v; ombre.material.opacity = Math.max(0, 1 - v / 3); ombre.scale.setScalar(1 - Math.min(Math.max(v, 0), 3) * .15); },
    get rotY() { return ball.rotation.y; }, set rotY(v) { ball.rotation.y = v; },
    get rotZ() { return ball.rotation.z; }, set rotZ(v) { ball.rotation.z = v; },
    get x() { return ball.position.x; }, set x(v) { ball.position.x = v; },
    set echelle(v) { ball.scale.setScalar(v); ombre.visible = v > .3; },
    set ouverture(v) { pivot.rotation.x = -v; },
    set zoom(v) { cam.position.copy(base).multiplyScalar(1 / v); },
    lueurBouton(intensite, c = 0xffffff) { btnMat.emissive = coul(c); btnMat.emissiveIntensity = intensite; },
    interieur(c, i) { coeurMat.color = coul(c).multiplyScalar(i); },
    faisceau(op, c = 0xffffff) { fxMat.opacity = op; fxMat.color = coul(c); lumiere.color = coul(c); lumiere.intensity = op * 30; },
    rendre() { renderer.render(scene, cam); },
    ecran() { const v = new THREE.Vector3(); ball.getWorldPosition(v); v.project(cam);  // centre de la ball, en pixels
              return [(v.x + 1) / 2 * canvas.clientWidth, (1 - v.y) / 2 * canvas.clientHeight]; },
    fin() { renderer.dispose(); renderer.forceContextLoss && renderer.forceContextLoss(); },
  };
}

// ----- Repli en 2D (si three.js n'a pas pu se charger) -----
function Ball2D(el, type) {
  el.innerHTML = ballSVG(type);
  const s = {y: 0, rotY: 0, rotZ: 0, x: 0, echelle: 1, ouverture: 0};
  const maj = () => el.style.transform = `translate(${s.x * 60}px,${-s.y * 60}px) rotate(${s.rotZ}rad) scale(${s.echelle})`;
  const proxy = new Proxy(s, {set(o, k, v) { o[k] = v; maj(); return true; }});
  return Object.assign(proxy, {lueurBouton() {}, interieur() {}, faisceau() {}, rendre() {}, taille() {},
    set zoom(v) {}, ecran() { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }, fin() {}});
}

// ----- La séquence complète -----
function ouvrir(c, rejouer = false, direct = false) {  // direct : on arrive de la scène du labo (la ball a déjà été choisie)
  ouverture = true;
  installerStyle("pkm2-style", STYLE_VOILE);
  audio();  // le toucher qui ouvre autorise le son
  // Nouveau Pokémon = première capture ouverte de cette espèce
  const nouveau = rejouer ? CAPTURES.find(x => x.num === c.num && estOuverte(x)).id === c.id : !collection()[c.num];
  const r = {leg: c.legendaire, shiny: c.shiny, nouveau};
  const cls = r.leg ? "r-leg" : r.shiny ? "r-shiny" : r.nouveau ? "r-nouveau" : "r-version";
  const teinte = r.leg ? 0xFF8CE6 : r.shiny ? 0xFFD75A : r.nouveau ? 0x7FE8FF : 0xffffff;
  const couleursFx = r.leg ? ["#FF8CE6", "#B57BFF", "#7FD4FF", "#fff"] : r.shiny ? ["#FFE27A", "#FFCB05", "#fff"] :
                     r.nouveau ? ["#7FE8FF", "#fff", "#4CD3A0"] : ["#fff", "#C9D3EA"];

  const v = P.createElement("div"); v.id = "pkm-voile";
  v.innerHTML = `<div class="fond"></div><div class="rayons"></div><canvas class="scene"></canvas><div class="ball2d" hidden></div>
    <img class="poke" alt=""><canvas class="fx"></canvas><div class="flash"></div>
    <div class="haut"><button class="rond son">${son ? "🔊" : "🔇"}</button><div class="nom-ball">${BALLS[c.ball] || "Poké Ball"}</div>
      <button class="rond x">✕</button></div>
    <div class="aide">Touche la ${BALLS[c.ball] || "Poké Ball"} !<small>${c.raison}</small></div>
    <div class="carte"></div>`;
  P.body.appendChild(v); requestAnimationFrame(() => v.classList.add("vu"));
  const $ = s => v.querySelector(s), poke = $(".poke"), aide = $(".aide"), carte = $(".carte"), flash = $(".flash");
  const fx = Particules($(".fx"));
  let B;
  try { if (!window.THREE) throw 0; B = Ball3D($(".scene"), c.ball); }
  catch (e) { $(".scene").hidden = true; $(".ball2d").hidden = false; B = Ball2D($(".ball2d"), c.ball); }

  // Boucle d'affichage (dans la fenêtre parente : jamais ralentie)
  let fini = false, dernier = maintenant(), anims = [], brille = false;
  const boucle = now => {
    if (fini) return;
    const dt = Math.min((now - dernier) / 1000, .05); dernier = now;
    anims = anims.filter(a => a(now) !== false);
    if (brille) { const rc = poke.getBoundingClientRect();
      if (Math.random() < .5) fx.scintille(rc.left + rc.width / 2, rc.top + rc.height / 2, Math.max(rc.width, 80) * .65, couleursFx); }
    fx.dessiner(dt); B.rendre(); PW.requestAnimationFrame(boucle);
  };
  PW.requestAnimationFrame(boucle);
  const redim = () => { B.taille(); fx.taille(); }; PW.addEventListener("resize", redim);
  const tween = (ms, f, e = ease.inout) => new Promise((ok, ko) => { const t0 = maintenant();
    anims.push(now => { if (fini) { ko("fermé"); return false; } const t = Math.min((now - t0) / ms, 1); f(e(t), t); if (t >= 1) { ok(); return false; } }); });
  const pause = ms => new Promise((ok, ko) => setTimeout(() => fini ? ko("fermé") : ok(), ms));
  const touche = () => new Promise((ok, ko) => { const f = ev => { if (ev.target.closest("button")) return;
    v.removeEventListener("pointerdown", f); fini ? ko("fermé") : ok(); }; v.addEventListener("pointerdown", f); });
  const fermer = () => { if (fini) return; fini = true; ouverture = false; v.classList.add("fin"); PW.removeEventListener("resize", redim);
    setTimeout(() => { B.fin(); v.remove(); }, 320); dessiner(); };
  $(".x").onclick = fermer;
  $(".son").onclick = e => { son = !son; e.target.textContent = son ? "🔊" : "🔇"; try { localStorage.setItem("pkm_son", son ? "1" : "0"); } catch (x) {} };

  // La grande illustration officielle (chargée pendant que la ball tombe) ; sinon l'image animée
  poke.onerror = () => { poke.onerror = null; poke.src = IMG.anim(c.num, c.shiny); };
  poke.src = IMG.hd(c.num, c.shiny);

  const centre = () => B.ecran();
  (async () => {
    // 1. Elle tombe du ciel et rebondit
    B.y = 5; B.rotY = -Math.PI * 3;
    SONS.chute();
    await tween(950, (e, t) => { B.y = 5 * (1 - e); B.rotY = -Math.PI * 3 * (1 - ease.out(t)); }, ease.rebond);
    SONS.rebond(); vibre(20);
    if (rejouer && !direct) return devoiler(true);
    // 2. Elle attend qu'on la touche (sauf en arrivant du labo : elle a déjà été choisie)
    if (!direct) {
      aide.classList.add("vu");
      let tAtt = maintenant(), attend = true;
      anims.push(now => { if (!attend) return false; const t = (now - tAtt) / 1000;
        B.y = .08 + Math.sin(t * 2.2) * .08; B.rotY = Math.sin(t * .9) * .5; B.lueurBouton(.25 + .25 * Math.sin(t * 4)); });
      await touche(); attend = false; aide.classList.remove("vu");
      await tween(250, e => { B.y = .08 * (1 - e); B.rotY *= (1 - e); B.lueurBouton(0); });
    }
    // 3. Les secousses : une de plus quand c'est rare, et de plus en plus longues
    const n = r.leg || r.shiny || r.nouveau ? 4 : 3;
    for (let i = 0; i < n; i++) {
      await pause(380 + i * 260);
      SONS.secousse(); vibre(35);
      const amp = .42 + i * .04;
      await tween(620, (e, t) => { B.rotZ = Math.sin(t * Math.PI * 2) * amp * (1 - t * .3); B.x = Math.sin(t * Math.PI * 2) * .12;
        B.lueurBouton(Math.sin(t * Math.PI) * .9, 0xFF3030); B.zoom = 1 + (i + t) * .045; }, x => x);
      B.rotZ = 0; B.x = 0;
    }
    // 4. « Clic ! »
    await pause(300);
    SONS.clic(); vibre([15, 40, 15]);
    { const [x, y] = centre(); fx.jet(x, y - 40, 3, {couleurs: ["#FFE27A", "#fff"], vitesse: 5, taille: 12, vie: .9, gravite: .05}); }
    await pause(650);
    // 5. Elle s'éveille : lueur (blanche, dorée pour un shiny, multicolore pour un légendaire, bleue pour un nouveau)
    SONS.montee(.9);
    await tween(900, (e, t) => { B.lueurBouton(e * 3, teinte); B.x = (Math.random() - .5) * .06 * e; B.rotZ = (Math.random() - .5) * .08 * e;
      B.zoom = 1 + n * .045 + e * .08; });
    B.x = 0; B.rotZ = 0;
    devoiler(false);
  })().catch(() => {});

  async function devoiler(vite) {
    // 6. Elle s'ouvre : faisceau, flash, le Pokémon sort en silhouette puis prend ses couleurs
    v.classList.add(cls);
    if (!vite) { SONS.ouverture(); vibre(60); }
    B.interieur(teinte, 1);
    await tween(vite ? 200 : 360, e => { B.ouverture = e * 1.95; B.faisceau(e * .85, teinte); }, ease.back);
    flash.classList.add("go");
    const [x, y] = centre();
    fx.jet(x, y, vite ? 20 : 46, {couleurs: couleursFx, vitesse: 9, taille: 9, vie: 1.3, gravite: .04, cercle: true});
    poke.classList.add("sort"); SONS.materialise();
    v.classList.add("revele");
    await tween(500, e => { B.echelle = 1 - e; B.y = -e * .6; B.faisceau(.85 * (1 - e), teinte); }, ease.inout);
    await pause(vite ? 150 : 550);
    poke.classList.add("couleur"); vibre(r.nouveau || r.shiny ? [40, 60, 80] : 30);
    const pr = poke.getBoundingClientRect(), px = pr.left + pr.width / 2, py = pr.top + pr.height / 2;
    if (r.leg) { SONS.legendaire(); fx.jet(px, py, 90, {couleurs: couleursFx, vitesse: 12, taille: 10, vie: 2, gravite: .02, cercle: true}); }
    if (r.shiny) { SONS.shiny(); fx.jet(px, py, 60, {couleurs: couleursFx, vitesse: 8, taille: 11, vie: 1.8, gravite: .01}); }
    else if (r.nouveau) SONS.nouveau(); else SONS.version();
    if (r.nouveau && !r.leg) fx.jet(px, py - 40, 110, {couleurs: ["#FF5D5D", "#FFCB05", "#4CD3A0", "#6B8CFF", "#B57BFF", "#fff"],
      forme: "confetti", vitesse: 11, taille: 10, vie: 2.6, gravite: .16});
    brille = r.shiny || r.leg;
    setTimeout(() => poke.classList.add("danse"), 700);
    if (!rejouer) memoriser(c.id);
    montrerCarte();
  }

  function montrerCarte() {
    const col = collection(), especes = Object.keys(col).length, reste = aOuvrir();
    const shinys = Object.values(col).filter(l => l.some(x => x.shiny)).length;
    const badges = [r.nouveau ? `<span class="badge b-nouveau">NOUVEAU POKÉMON !</span>` : r.shiny ? "" : `<span class="badge b-version">CAPTURÉ !</span>`,
                    r.shiny ? `<span class="badge b-shiny">✨ SHINY</span>` : "", r.leg ? `<span class="badge b-leg">👑 LÉGENDAIRE</span>` : ""];
    carte.innerHTML = `<div class="badges">${badges.join("")}</div>
      <div class="no">N° ${N3(c.num)}</div><div class="nm">${c.nom}</div><div>${typesHTML(c.types, "pkm-type")}</div>
      <div class="ver">${c.shiny ? "✨ Shiny · " : ""}${c.lieu ? `📍 ${c.lieu}` : ""}</div>
      <div class="rs">${BALLS[c.ball] || "Poké Ball"} · ${c.raison} · ${c.quand}</div>
      <div class="compteur"><div><div class="l">Pokédex</div><div class="v">${especes} / 151</div><div class="j"><div style="width:${(especes - (r.nouveau && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div>
        <div><div class="l">Shiny ✨</div><div class="v">${shinys} / 151</div><div class="j"><div style="width:${(shinys - (c.shiny && !rejouer ? 1 : 0)) / 1.51}%"></div></div></div></div>
      <div class="boutons">${reste.length && !rejouer ? `<button class="b1 suite">Ouvrir la suivante (${reste.length})</button>` : ""}
        <button class="${reste.length && !rejouer ? "b2" : "b1"} ok">${r.nouveau || r.shiny ? "Génial !" : "Super !"}</button></div>`;
    carte.querySelectorAll(".badge").forEach((b, i) => b.style.animationDelay = `${.15 + i * .18}s${b.classList.contains("b-nouveau") ? ",0s" : ""}`);
    setTimeout(() => { carte.classList.add("vu");
      setTimeout(() => { const j = carte.querySelectorAll(".compteur .j div");
        if (j[0]) j[0].style.width = especes / 1.51 + "%"; if (j[1]) j[1].style.width = shinys / 1.51 + "%"; }, 500); }, 350);
    carte.querySelector(".ok").onclick = fermer;
    const s = carte.querySelector(".suite");
    if (s) s.onclick = () => { fermer(); setTimeout(() => lancer(aOuvrir()[0]), 340); };
  }
}

// Une boîte de dialogue dans la scène v : dire(texte, qui) écrit le texte lettre par lettre (petit « bip »), toucher =
// tout afficher, puis passer à la suite ; cacher() la range. Les touchers sur ignorer (sélecteur) ne la font pas avancer.
function dialogue(v, ignorer = ".pkm-passer") {
  const dial = P.createElement("div"); dial.className = "pkm-dial";
  dial.innerHTML = `<span class="qui"></span> <span class="txt"></span><i class="suite"></i>`;
  v.appendChild(dial);
  const qui = dial.querySelector(".qui"), txt = dial.querySelector(".txt");
  let tape = null, attendre = null;
  const dire = (html, nom = "", attendSuite = true) => new Promise(ok => {
    clearInterval(tape); dial.classList.add("vu"); dial.classList.remove("attend");
    qui.textContent = nom ? nom.toUpperCase() + " :" : "";
    // espace insécable avant ! ? : ; et après « (jamais une ponctuation seule au début d'une ligne)
    const plein = html.replace(/ ([!?:;»])/g, "\u00A0$1").replace(/« /g, "«\u00A0"), brut = plein.replace(/<[^>]+>/g, "");
    let n = 0; txt.textContent = "";
    const finir = () => { clearInterval(tape); tape = null; txt.innerHTML = plein;
      if (attendSuite) { dial.classList.add("attend"); attendre = () => { attendre = null; ok(); }; } else { attendre = null; ok(); } };
    tape = setInterval(() => { n += 1; txt.textContent = brut.slice(0, n);
      if (n % 3 === 0) ton(1250, 0, .028, {type: "square", vol: .018}); if (n >= brut.length) finir(); }, 26);
    attendre = () => finir();
  });
  v.addEventListener("pointerdown", e => { if (e.target.closest(ignorer)) return; if (attendre) attendre(); });
  return {dire, cacher: () => { dial.classList.remove("vu"); attendre = null; }};
}

// Le champion animé : les images de son animation (planche + liste) dessinées sur un canvas, 14 images par seconde
// Le champion animé : les images de son animation (planche + liste) dessinées sur un canvas, 14 images par seconde ;
// fixe : sa pose de base (première image), et jouer() lance l'animation une fois. -> {stop, jouer}
function championAnime(canvas, sprite = canvas.dataset.sprite, fixe = false) {
  const im = new Image(); im.crossOrigin = "anonymous";
  let images = [], arret = false, joue = !fixe, k = 0, pose = false;
  fetch(ROGUE + sprite + ".json").then(r => r.json()).then(j => {
    images = j.textures[0].frames.sort((a, b) => a.filename.localeCompare(b.filename));
    canvas.width = images[0].sourceSize.w; canvas.height = images[0].sourceSize.h;
  }).catch(() => {});
  im.src = ROGUE + sprite + ".png";
  const ctx = canvas.getContext("2d");
  const dessiner = f => { ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(im, f.frame.x, f.frame.y, f.frame.w, f.frame.h, f.spriteSourceSize.x, f.spriteSourceSize.y, f.frame.w, f.frame.h); };
  const boucle = setInterval(() => {
    if (arret || !canvas.isConnected && images.length) return clearInterval(boucle);
    if (!images.length || !im.complete) return;
    if (!joue) { if (!pose) { dessiner(images[0]); pose = true; } return; }
    dessiner(images[k++ % images.length]);
    if (fixe && k >= images.length) { joue = false; pose = false; k = 0; }
  }, 1000 / 14);
  return {stop: () => { arret = true; }, jouer: () => { joue = true; k = 0; }};
}

  let fini = false;
  const fin = suite => { if (fini) return; fini = true; stop();
    if (!suite || !c) { v.style.transition = "opacity .45s"; v.style.opacity = 0; setTimeout(() => v.remove(), 450); return; }
    SONS.montee(.7); v.querySelector(".blanc").style.opacity = 1;
    setTimeout(() => { ouvrir(c, rejouer, true); v.style.transition = "opacity .45s"; v.style.opacity = 0; setTimeout(() => v.remove(), 450); }, 600); };
  v.querySelector(".pkm-passer").onclick = () => fin(false);
  const eclats = (x, y, nb) => { for (let i = 0; i < nb; i++) { const e = P.createElement("div"); e.className = "eclat";
    const ang = i / nb * Math.PI * 2, d = 50 + Math.random() * 60;
    e.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d}px;background:${["#FFE27A", "#fff", couleur][i % 3]}`;
    v.appendChild(e); setTimeout(() => e.remove(), 900); } };

  (async () => {
    SONS.chute();
    await pause(900); v.classList.add("entre"); SONS.rebond(); vibre(20);
    await pause(800);
    for (const l of ch.lignes) await dire(l, ch.nom);
    await dire(ligue ? "Tu as conquis la Ligue. Ce trophée est à toi, Maître Pokémon !" : `En reconnaissance de ta victoire, voici le <b>${a.badge}</b> !`, ch.nom);
    // le badge (ou le trophée) tombe, tourne, brille : on le touche pour le prendre
    cacher(); v.classList.add("badge-la"); SONS.chute(); setTimeout(() => { SONS.materialise(); vibre(25); }, 650);
    const badge = v.querySelector(".badge");
    await pause(900); v.querySelector(".aide").classList.add("vu");
    await new Promise(ok => { badge.onclick = ok; });
    badge.onclick = null; v.querySelector(".aide").classList.remove("vu"); SONS.clic(); vibre(15);
    const etui = v.querySelector(".etui");
    if (etui) {  // il file dans l'étui à badges
      etui.classList.add("vu"); await pause(520);
      const cible = etui.querySelector(".case.ici").getBoundingClientRect(), r = badge.getBoundingClientRect();
      const dx = cible.left + cible.width / 2 - (r.left + r.width / 2), dy = cible.top + cible.height / 2 - (r.top + r.height / 2);
      badge.classList.add("vole"); badge.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${cible.width * .84 / r.width})`;
      await pause(870);
      const ici = etui.querySelector(".case.ici"); ici.classList.remove("ici"); ici.innerHTML = `<img src="${IMG.badge(a.image)}">`; badge.style.opacity = 0;
      eclats(cible.left + cible.width / 2, cible.top + cible.height / 2, 16);
    } else { eclats(PW.innerWidth / 2, PW.innerHeight * .34, 24); }
    SON_BADGE(); vibre([40, 60, 80]);
    await dire(ligue ? `${nomDresseur()} est le nouveau <b>Maître de la Ligue Pokémon</b> !` : `${nomDresseur()} obtient le <b>${a.badge}</b> !`);
    if (!c) return fin(false);
    await dire(ligue ? "Et voici ta récompense : une <b>Master Ball</b> ! Un Pokémon légendaire t'attend à l'intérieur…"
      : `Et prends aussi ceci : une <b>Hyper Ball</b> ! Un Pokémon de type ${a.type} t'attend à l'intérieur.`, ch.nom);
    fin(true);
  })().catch(() => {});
}

function fiche(p) {
  installerStyle("pkm2-fiche-style", STYLE_FICHE);
  const col = collection(), mes = col[p.num] || [], a = mes.length > 0, leg = LEG.has(p.num);
  const normal = mes.find(c => !c.shiny), shiny = mes.find(c => c.shiny);
  const c0 = COUL[p.types[0]];
  const lieux = LIEUX_DE[p.num] || [];
  const ou = leg ? `👑 <b>Légendaire</b> : il n'apparaît que dans une <b>Master Ball</b> (ton objectif ${D.regles.master_jours} jours
      sur ${D.regles.master_fenetre}, ou la victoire à la Ligue Pokémon).`
    : `📍 <b>${lieux.join(", ")}</b> : les Poké Balls donnent surtout les Pokémon de l'endroit où tu es.
       <br>Plus de chances avec : <b>${[...new Set(p.types.flatMap(t => D.conseils[t] || []))].join(", ") || "toutes les activités"}</b>.
       <br>🏅 Les badges d'arène donnent un Pokémon du type du champion.`;
  const forme = (c, sh) => c
    ? `<div class="f ${sh ? "sh" : ""}" data-s="${sh ? 1 : 0}"><b>${sh ? "✨ Shiny" : "Normal"}</b>
        <img src="${IMG.anim(p.num, sh)}" ${repli(p.num, sh)}>${c.quand}<br>${c.lieu ? `📍 ${c.lieu}` : ""}</div>`
    : `<div class="f ${sh ? "sh" : ""}"><b>${sh ? "✨ Shiny" : "Normal"}</b><div class="trou">${sh ? "✨" : "?"}</div>
        ${sh ? "Pas encore : c'est rare (1 chance sur 33 environ)" : "Pas encore attrapé"}</div>`;
  const vue = normal ? false : !!shiny;  // la grande image : la forme attrapée (le normal d'abord)
  const f = P.createElement("div"); f.id = "pkm-fiche";
  f.innerHTML = `<div class="ombre"></div><div class="feuille"><div class="poignee"></div>
    <div class="tete" style="background:linear-gradient(135deg,${c0}55,#1C2740 70%)">
      <img class="grande ${a ? "" : "non"}" src="${a ? IMG.hd(p.num, vue) : IMG.mini(p.num, false)}">
      <div><div class="no">N° ${N3(p.num)}${leg ? " · Légendaire" : ""}</div><h3>${a ? p.nom : "???"}</h3>
        <div>${typesHTML(p.types, "pkm-type")}</div>
        <div class="sous">${a ? `Attrapé ${mes[0].quand}${mes[0].lieu ? ` · ${mes[0].lieu}` : ""}` : "Pas encore attrapé"}</div></div></div>
    <h4>Ses deux formes <span>${(normal ? 1 : 0) + (shiny ? 1 : 0)} / 2</span></h4>
    <div class="formes">${forme(normal, false)}${forme(shiny, true)}</div>
    <h4>Où le trouver ?</h4><div class="ou">${RARES.has(p.num) ? "⭐ <b>Rare</b> : 3 fois moins de chances que les autres Pokémon de son lieu.<br>" : ""}${ou}</div>
    <button class="fermer">Fermer</button></div>`;
  P.body.appendChild(f); requestAnimationFrame(() => f.classList.add("vu"));
  const grande = f.querySelector(".grande");
  f.querySelectorAll(".f[data-s]").forEach(e => {
    if (+e.dataset.s === +vue) e.classList.add("on");
    e.onclick = () => { f.querySelectorAll(".f").forEach(x => x.classList.remove("on")); e.classList.add("on");
      const sh = e.dataset.s === "1";
      grande.style.opacity = 0; setTimeout(() => { grande.src = IMG.hd(p.num, sh); grande.style.opacity = 1; }, 200); };
  });
  const fermer = () => { f.classList.remove("vu"); setTimeout(() => f.remove(), 350); };
  f.querySelector(".ombre").onclick = fermer; f.querySelector(".fermer").onclick = fermer;
  // glisser la feuille vers le bas pour la fermer
  const fe = f.querySelector(".feuille"); let y0 = null;
  fe.addEventListener("touchstart", e => { y0 = fe.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  fe.addEventListener("touchmove", e => { if (y0 === null) return; const d = e.touches[0].clientY - y0;
    if (d > 0) { fe.style.transition = "none"; fe.style.transform = `translateY(${d}px)`; } }, {passive: true});
  fe.addEventListener("touchend", e => { if (y0 === null) return; const d = e.changedTouches[0].clientY - y0; y0 = null;
    fe.style.transition = ""; if (d > 110) fermer(); else fe.style.transform = ""; });
}

const R = D.regles, J = D.jour;

function dessinerBarre() {
  const b = D.barre, pct = b.points / b.taille, circ = 2 * Math.PI * 50, reste = b.taille - b.points;
  const [ic, nom, ts] = b.origine;
  const pas = Math.ceil(reste) * 100, zone = Math.ceil(reste / 2), sport = Math.ceil(reste), muscu = Math.ceil(reste / R.force);
  document.getElementById("barre").innerHTML = `<div class="filigrane">${ballSVG("poke")}</div>
    <div class="anneau"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#0D1322" stroke-width="12"/>
      <circle class="arc" cx="60" cy="60" r="50" fill="none" stroke="url(#gb)" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${circ}" stroke-dashoffset="${circ}"/>
      <defs><linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFCB05"/><stop offset="1" stop-color="#FF4B4B"/></linearGradient></defs></svg>
      <div class="centre"><div class="v">${Math.floor(b.points)}</div><div class="s">/ ${b.taille} pts</div></div></div>
    <div class="droite"><div class="titre">Prochaine Poké Ball</div>
      <div class="manque">Encore <b>${fr(pas)} pas</b>, ou <b>${zone} min en zone</b>, ou <b>${muscu} min de muscu / rameur</b>, ou <b>${sport} min d'un autre sport</b>.</div>
      <div class="puces">${b.sources.length ? b.sources.map(([i, n, p]) => `<span class="puce">${i} ${n} <b>+${p}</b></span>`).join("")
        : `<span class="puce">Rien encore aujourd'hui : bouge !</span>`}</div>
      ${ts.length ? `<div class="petit gris" style="margin-top:6px">Aujourd'hui : ${ic} ${nom} → ${typesHTML(ts)}</div>` : ""}</div>`;
  requestAnimationFrame(() => setTimeout(() => document.querySelector("#barre .arc").style.strokeDashoffset = circ * (1 - pct), 60));
}

function dessinerAOuvrir() {
  const liste = aOuvrir(), el = document.getElementById("aouvrir");
  el.classList.toggle("vide", !liste.length);
  if (!liste.length) {
    el.innerHTML = `<div class="titre" style="font-size:16px">Aucune Poké Ball à ouvrir</div>

    <button class="gros-bouton">Ouvrir ${liste.length === 1 ? "la Poké Ball" : "la première"}</button>`;

  el.querySelector(".gros-bouton").onclick = () => lancer(aOuvrir()[0]);
}

function dessinerSpeciales() {
  const gagnee = cle => CAPTURES.some(c => c.jour === D.aujourdhui && c.id.split("#")[1].startsWith(cle));
  const j = (v, s) => `<div class="jauge"><div class="${v >= s ? "ok" : ""}" style="width:${Math.min(v / s * 100, 100)}%"></div></div>`;
  const sup = gagnee("super"), hyp = gagnee("hyper"), mas = gagnee("master");
  const nuit = J.sommeil >= R.nuit, h = m => `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, "0")}`;
  // Ce qui reste à faire pour chaque ball
  const manque = (v, s, u) => v < s ? (u ? `${Math.ceil(s - v)} ${u}` : `${fr(Math.ceil((s - v) / 10) * 10)} pas`) : null;
  const mPas = manque(J.pas, R.objectif_pas), mZone = manque(J.zone, R.objectif_zone, "min en zone");
  const resteSuper = sup ? "Gagnée aujourd'hui !" : `Il te manque <b>${[mPas, mZone].filter(Boolean).join("</b> et <b>")}</b>.`;
  const resteHyper = hyp ? "Gagnée aujourd'hui !" : `Au choix, encore <b>${manque(J.pas, R.exploit_pas)}</b>, ou <b>${manque(J.zone, R.exploit_zone, "min en zone")}</b>,
    ou une séance de <b>${R.exploit_seance} min</b>${J.seance ? ` (ta plus longue : ${Math.round(J.seance)} min)` : ""}.`;
  const resteMaster = mas ? "Gagnée aujourd'hui ! Un nouveau compte commence demain."
    : `Encore <b>${R.master_jours - J.serie} jour${R.master_jours - J.serie > 1 ? "s" : ""}</b> avec l'objectif. ` +
      (J.serie_ok ? "Aujourd'hui compte déjà ✅" : `Pour qu'aujourd'hui compte : <b>${mPas}</b> ou <b>${mZone}</b>.`);
  const fen = J.fenetre.concat(Array(Math.max(R.master_fenetre - J.fenetre.length, 0)).fill(undefined));
  document.getElementById("speciales").innerHTML = `
    <div class="speciale ${sup ? "ok" : ""}">${sup ? '<span class="tampon">✅</span>' : ""}
      <div class="tete">${ballSVG("super")}Super Ball</div><div class="gain">Objectif double · shiny ×2, 1 chance sur 2 d'un nouveau</div>
      <div class="ligne"><span>👟 ${fr(J.pas)}</span><span>${fr(R.objectif_pas)}</span></div>${j(J.pas, R.objectif_pas)}
      <div class="ligne"><span>🔥 ${Math.round(J.zone)} min</span><span>${R.objectif_zone} min</span></div>${j(J.zone, R.objectif_zone)}
      <div class="reste">${resteSuper}</div></div>
    <div class="speciale ${hyp ? "ok" : ""}">${hyp ? '<span class="tampon">✅</span>' : ""}
      <div class="tete">${ballSVG("hyper")}Hyper Ball</div><div class="gain">Un exploit au choix · shiny ×4, nouveau garanti</div>
      <div class="ligne"><span>👟 ${fr(J.pas)}</span><span>${fr(R.exploit_pas)}</span></div>${j(J.pas, R.exploit_pas)}
      <div class="ligne"><span>🔥 ${Math.round(J.zone)} min</span><span>${R.exploit_zone} min</span></div>${j(J.zone, R.exploit_zone)}
      <div class="ligne"><span>💪 séance ${Math.round(J.seance)} min</span><span>${R.exploit_seance} min</span></div>${j(J.seance, R.exploit_seance)}
      <div class="reste">${resteHyper}</div></div>
    <div class="speciale ${mas ? "ok" : ""}">${mas ? '<span class="tampon">✅</span>' : ""}
      <div class="tete">${ballSVG("master")}Master Ball</div><div class="gain">${R.master_jours} jours sur ${R.master_fenetre} à ${fr(R.objectif_pas)} pas ou ${R.objectif_zone} min en zone = un légendaire</div>
      <div class="ligne"><span>👑 ${J.serie} / ${R.master_jours} jours</span><span>sur ${R.master_fenetre}</span></div>${j(J.serie, R.master_jours)}
      <div class="points-serie">${fen.map(e => `<i class="${e === 1 ? "on" : e === 0 ? "rate" : e === null ? "auj" : ""}"></i>`).join("")}</div>
      <div class="reste">${resteMaster}</div></div>
    <div class="speciale ${nuit ? "ok" : ""}">${nuit ? '<span class="tampon">✅</span>' : ""}
      <div class="tete"><span style="font-size:22px">😴</span>Bonne nuit</div><div class="gain">Nuit de ${h(R.nuit)} · shiny ×1,5 sur toutes les balls du jour</div>
      <div class="ligne"><span>Cette nuit : ${J.sommeil ? h(J.sommeil) : "—"}</span><span>${h(R.nuit)}</span></div>${j(J.sommeil, R.nuit)}
      <div class="ligne"><span>✨ Chance de shiny aujourd'hui</span><span>×${String(Math.round(J.shiny_bonus * 100) / 100).replace(".", ",")}</span></div>
      ${nuit ? "" : `<div class="reste" style="color:#9AA7C2">Pas de souci si c'est raté : les balls sont gagnées quand même.</div>`}</div>`;
}

function dessinerDernieres() {
  const ok = CAPTURES.filter(estOuverte).reverse().slice(0, 8), vus = new Set();
  const premiere = {};  // première capture de chaque espèce (pour l'étiquette « nouveau »)
  for (const c of CAPTURES) if (estOuverte(c) && !vus.has(c.num)) { vus.add(c.num); premiere[c.id] = 1; }
  document.getElementById("bloc-dernieres").style.display = ok.length ? "" : "none";
  document.getElementById("dernieres").innerHTML = ok.map(c => `<div class="mini" data-i="${CAPTURES.indexOf(c)}">
    ${premiere[c.id] ? '<span class="eti nv">NEW</span>' : ""}${c.shiny ? '<span class="eti sh">✨</span>' : ""}
    <img src="${IMG.anim(c.num, c.shiny)}" ${repli(c.num, c.shiny)} loading="lazy"><div class="nm">${c.nom}</div>
    <div class="qd">${c.quand}</div>${c.lieu ? `<div class="lieu">📍 ${c.lieu}</div>` : ""}</div>`).join("");
  document.querySelectorAll(".mini").forEach(e => e.onclick = () => ouvrir(CAPTURES[e.dataset.i], true));
}

function dessinerDex() {
  const col = collection(), especes = Object.keys(col).length;
  const sh = Object.values(col).filter(l => l.some(c => c.shiny)).length, nb = Object.keys(V.badges).filter(k => k <= 8).length;
  const ici = new Set(LIEUX[V.ici].pokemon);
  document.getElementById("dex-n").textContent = `${especes} / 151`;
  document.getElementById("stats").innerHTML = `
    <div class="t"><div class="l">Espèces</div><div class="v">${especes} <small>/ 151</small></div>
      <div class="jauge"><div style="width:${especes / 1.51}%;background:linear-gradient(90deg,#FF4B4B,#FFCB05)"></div></div></div>
    <div class="t"><div class="l">Shiny</div><div class="v">✨ ${sh}</div></div>
    <div class="t"><div class="l">Badges</div><div class="v"><img src="${IMG.badge(Math.max(nb, 1))}"> ${nb} <small>/ 8</small></div></div>`;
  const filtres = [["tous", "Tous"], ["oui", `Attrapés ${especes}`], ["non", `Manquants ${151 - especes}`],
                   ["ici", `📍 ${LIEUX[V.ici].nom}`], ["shiny", "✨ Shiny"], ["leg", "👑 Légendaires"]];
  document.getElementById("filtres").innerHTML = filtres.map(([k, l]) => `<button class="filtre ${filtre === k ? "on" : ""}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll("#filtres .filtre").forEach(b => b.onclick = () => { filtre = b.dataset.k; dessinerDex(); });
  document.getElementById("filtres-types").innerHTML = Object.keys(COUL).map(t =>
    `<button class="filtre ty ${filtreTypes.has(t) ? "on" : ""}" data-t="${t}" style="background:${COUL[t]}">${t}</button>`).join("");
  document.querySelectorAll("#filtres-types .filtre").forEach(b => b.onclick = () => {
    filtreTypes.has(b.dataset.t) ? filtreTypes.delete(b.dataset.t) : filtreTypes.add(b.dataset.t); dessinerDex(); });

  const q = texte.trim().toLowerCase();
  const liste = DEX.filter(p => {
    const mes = col[p.num] || [], a = mes.length > 0;
    if (filtre === "oui" && !a || filtre === "non" && a) return false;
    if (filtre === "ici" && !ici.has(p.num)) return false;

let lieuVu = null;  // le lieu touché sur la carte (sinon : là où l'on est)
function morceaux() {  // chaque étape : la partie faite et la partie à faire, avec sa façon de voyager
  const L = LIEUX, m = [];
  for (let k = 1; k < L.length; k++) {
    const tr = TRACE[k], mode = L[k].mode;
    if (V.pos >= L[k].dist) m.push({pts: tr, fait: true, mode});
    else if (V.pos > L[k - 1].dist) {
      const f = jusqua(tr, (V.pos - L[k - 1].dist) / (L[k].dist - L[k - 1].dist));
      m.push({pts: f, fait: true, mode, ici: true}, {pts: [f[f.length - 1], ...tr.slice(f.length - 1)], fait: false, mode});
    } else m.push({pts: tr, fait: false, mode});
  }
  return m;
}
function svgKanto() {
  const L = LIEUX, M = morceaux(), faits = M.filter(x => x.fait);
  const enRoute = L.findIndex((l, k) => k && V.pos > L[k - 1].dist && V.pos < l.dist);  // l'étape en cours, ou -1
  const [mx, my] = faits.length ? faits[faits.length - 1].pts.slice(-1)[0] : [L[0].x, L[0].y];
  const pt = pts => pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  // le chemin : à faire = petits points sombres ; fait = rouge bordé de blanc (tirets pour un vol ou en mer) ;
  const traits = M.filter(x => !x.fait).map(x => `<polyline points="${pt(x.pts)}" fill="none" stroke="#1B2A4A" stroke-width="1.8"
      stroke-dasharray="0.1 4.2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`).join("") +
    M.filter(x => x.fait).map(x => { const tiret = x.mode === "route" ? "" : `stroke-dasharray="5 3.5"`;
      return `<polyline points="${pt(x.pts)}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9" ${tiret}/>
        <polyline ${x.mode === "route" ? `class="chemin-fait" style="--l:${Math.ceil(longueur(x.pts)) + 2}"` : tiret} points="${pt(x.pts)}" fill="none"
          stroke="#E8382F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`; }).join("");
  const col = collection();
  const noeuds = L.map((l, k) => {
    if (k === 18) return "";  // Jadielle (retour) : même endroit que Jadielle
    const complet = l.pokemon.every(n => col[n]) && (k !== 2 || L[18].pokemon.every(n => col[n]));
    const k2 = k === 2 ? 18 : k, ar = L[k2].arene;  // Jadielle porte l'arène de Giovanni
    const num = ar ? L.filter((x, j) => x.arene && j <= k2).length : 0, gagne = num && V.badges[num];
    const atteint = V.pos >= l.dist, vise = V.defi && V.defi.lieu === k2;
    const ville = !!ar || /Bourg|Jadielle|Lavanville|Céladopole|Safrania|Azuria|Carmin|Parmanie|Cramois|Argenta|Plateau/.test(l.nom);
    const r = ville ? 5.2 : 3.6, bas = l.y > HC - 30 || l.nom === "Plateau Indigo";
    return `<g class="lieu" data-k="${k}">
      <circle class="choix" cx="${l.x}" cy="${l.y}" r="${r + 3.5}" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="2"/>
      ${vise ? `<circle class="vise" cx="${l.x}" cy="${l.y}" r="${r + 2}" fill="none" stroke="#FFCB05" stroke-width="2"/>` : ""}
      <circle class="point" cx="${l.x}" cy="${l.y}" r="${r}" fill="${atteint ? (ville ? "#E8382F" : "#FFB020") : "#7C8AA8"}" stroke="#fff" stroke-width="1.6"/>
      ${ville ? `<circle cx="${l.x}" cy="${l.y}" r="${r * .38}" fill="#fff"/>` : ""}
      ${ar && ar.image ? `<image href="${IMG.badge(ar.image)}" x="${l.x + 3}" y="${l.y - 15}" width="12" height="12" opacity="${gagne ? 1 : .55}" style="${gagne ? "" : "filter:grayscale(1)"}"/>` : ""}
      ${ar && !ar.image ? `<text x="${l.x + 8}" y="${l.y - 5}" font-size="10" style="stroke:none">${gagne ? "🏆" : "🏟️"}</text>` : ""}
      ${complet ? `<text x="${l.x - 12}" y="${l.y - 4}" font-size="9" style="fill:#FFD84A">★</text>` : ""}
      ${ville ? `<text class="nom" x="${l.nom === "Plateau Indigo" ? l.x + 8 : l.x}" y="${l.nom === "Plateau Indigo" ? l.y - 6 : l.y + (bas ? -9 : 14)}" font-size="8"
        text-anchor="${l.nom === "Plateau Indigo" ? "start" : "middle"}">${l.nom.replace(" et Parc Safari", "").replace("-sur-Mer", "")}</text>` : ""}

    <image href="${D.carte}" x="0" y="0" width="370" height="${HC.toFixed(1)}" preserveAspectRatio="none" style="image-rendering:pixelated"/>
    ${traits}
    ${noeuds}
  </svg>`;
}

// ---------- Sacha sur la carte ----------
// Ses images de Pokémon Rouge Feu (projet public pret/pokefirered, version figée) : 9 images de 16×32 (marche) ou 32×32
// (vélo, surf) : 0 face, 1 dos, 2 profil gauche (à droite : retourné), puis 2 pas pour chaque sens.
const SACHA = "https://raw.githubusercontent.com/pret/pokefirered/ce6406d8c2eaf46d543c8a2606de0c3cb1951982/graphics/object_events/pics/people/";

function direction(pts) {  // le sens de la marche : d'après le dernier bout de chemin parcouru

    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    if (Math.hypot(dx, dy) > .5) return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "droite" : "gauche") : (dy > 0 ? "bas" : "haut");
  }

}

      background-size:900% 100%;background-position:${f[0] / 8 * 100}% 0"></div>`;

const COULEURS_TISSU = {  // 3 tons d'un vêtement : ombre, couleur, reflet
  "Rouge": [[106, 41, 41], [197, 57, 57], [255, 106, 74]], "Bleu": [[30, 46, 110], [56, 96, 200], [112, 160, 255]],
  "Vert": [[22, 78, 38], [46, 150, 70], [118, 214, 118]], "Jaune": [[116, 88, 10], [228, 180, 30], [255, 230, 110]],

  "Violet": [[62, 30, 102], [126, 70, 190], [182, 134, 238]], "Noir": [[20, 20, 28], [52, 52, 66], [106, 106, 126]],
  "Blanc": [[96, 96, 112], [218, 218, 230], [255, 255, 255]]};
const PEAU_SACHA = COULEURS_PEAU["Claire"], TISSU_SACHA = COULEURS_TISSU["Rouge"];

try { DRESSEUR = {...DRESSEUR, ...JSON.parse(localStorage.getItem("pkm_dresseur") || "{}")}; } catch (e) {}
const nomDresseur = () => DRESSEUR.nom || "Sacha";
const IMAGES_DRESSEUR = new Map();  // feuille + couleurs -> image recoloriée (data URL)
function feuilleColoree(feuille, d = DRESSEUR) {
  const cle = [feuille, d.peau, d.casquette, d.veste].join("|");
  if (!IMAGES_DRESSEUR.has(cle)) IMAGES_DRESSEUR.set(cle, new Promise(ok => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const cv = document.createElement("canvas"), W = cv.width = im.naturalWidth, H = cv.height = im.naturalHeight;
        const ctx = cv.getContext("2d"); ctx.drawImage(im, 0, 0);
        const img = ctx.getImageData(0, 0, W, H), px = img.data, fw = W / 9;
        const memes = (i, c) => px[i] === c[0] && px[i + 1] === c[1] && px[i + 2] === c[2];
        const peau = COULEURS_PEAU[d.peau], cas = COULEURS_TISSU[d.casquette], ves = COULEURS_TISSU[d.veste];
        for (let f = 0; f < 9; f++) {
          // la casquette : les 7 premières lignes dessinées de chaque image ; le rouge en dessous, c'est la veste
          let haut = H;
          for (let y = 0; y < H && haut === H; y++) for (let x = f * fw; x < (f + 1) * fw; x++) if (px[(y * W + x) * 4 + 3]) { haut = y; break; }
          for (let y = 0; y < H; y++) for (let x = f * fw; x < (f + 1) * fw; x++) {
            const i = (y * W + x) * 4; if (!px[i + 3]) continue;
            for (let k = 0; k < 3; k++) {
              if (memes(i, PEAU_SACHA[k])) { px.set(peau[k], i); break; }
              if (memes(i, TISSU_SACHA[k])) { px.set((y < haut + 7 ? cas : ves)[k], i); break; }
            }
          }
        }
        ctx.putImageData(img, 0, 0); ok(cv.toDataURL());
      } catch (e) { ok(SACHA + feuille + ".png"); }
    };
    im.onerror = () => ok(SACHA + feuille + ".png");
    im.src = SACHA + feuille + ".png";
  }));
  return IMAGES_DRESSEUR.get(cle);
}

  const d = V.defi;
  if (!d) return `<div class="arene"><div class="bdg ligue">🏆</div><div class="q"><div class="t">Champion de Kanto !</div>
      Les 8 badges et la Ligue sont à toi. La suite du voyage (Johto) arrive bientôt.</div></div>`;
  const l = LIEUX[d.lieu], a = l.arene, j = (v, c) => `<div class="jauge"><div class="${v >= c ? "ok" : ""}" style="width:${Math.min(v / c * 100, 100)}%"></div></div>`;
  const nomU = d.unite === "pas" ? "pas" : d.unite;
  const val = v => d.unite === "pas" ? fr(v) : Math.round(v * 10) / 10;
  if (!d.arrive) return "";  // pas encore arrivé : le champion attend sur la carte (le toucher = son défi)
  const image = a.image ? `<img class="bdg" src="${IMG.badge(a.image)}">` : `<div class="bdg ligue">🏆</div>`;
  const qui = a.type ? `Arène ${/^[AEIOUÉ]/.test(a.champion) ? "d'" : "de "}${a.champion} · type ${a.type}` : "Ligue Pokémon · Champion Régis";
  const style = `style="--c:${a.type ? COUL[a.type] : "#B8860B"}"`;
  const manque = Math.max(a.cible - d.valeur, 0);
  return `<div class="arene" ${style}>${image}<div class="q"><div class="t">${qui}</div>
      <div><b>${a.texte}</b></div>${j(d.valeur, a.cible)}<div class="petit">${val(d.valeur)} / ${val(a.cible)} ${nomU}</div>
      ${a.b ? `<div class="ou-b">ou plan B</div><div>${a.b.texte}</div>${j(d.valeur_b, a.b.cible)}<div class="petit">${d.valeur_b} / ${a.b.cible} jours</div>` : ""}
      <div class="reste">${manque ? `Encore ${val(manque)} ${nomU}${a.b ? ` (ou ${Math.max(a.b.cible - d.valeur_b, 0)} jour${a.b.cible - d.valeur_b > 1 ? "s" : ""} d'objectif)` : ""}.
        Tes points continuent de compter : tu repartiras d'un coup.` : "Défi réussi !"}</div>
      <div class="petit gris">Compté sur les 7 derniers jours depuis ton arrivée (le ${V.defi.depuis ? V.defi.depuis.slice(8) + "/" + V.defi.depuis.slice(5, 7) : "—"}).</div></div></div>`;
}

function dessinerVoyage() {
  const el = document.getElementById("voyage"), k = lieuVu ?? V.ici;
  const badges = LIEUX.filter(l => l.arene).map((l, i) => {
    const n = i + 1, quand = V.badges[n];
    return l.arene.image ? `<div class="${quand ? "oui" : "non"}" data-n="${n}" title="${l.arene.badge}"><img src="${IMG.badge(l.arene.image)}"></div>`
      : `<div class="${quand ? "oui" : "non"}" data-n="${n}" title="Ligue">🏆</div>`;
  }).join("");
  el.innerHTML = `<div class="entete"><span class="titre">🗺️ Voyage dans Kanto</span>
      <span class="ou">Étape ${V.ici + 1} / ${LIEUX.length} · ${Math.floor(V.pos / V.total * 100)} %</span></div>
    <div class="avance"><div style="width:0"></div></div>
    ${blocArene()}<div class="carte-wrap">${svgKanto()}${chefCarte()}${heros()}</div>${infosLieu(k)}
    <div class="boite-badges">${badges}</div>`;
  requestAnimationFrame(() => setTimeout(() => el.querySelector(".avance div").style.width = V.pos / V.total * 100 + "%", 60));
  const brancher = () => { el.querySelectorAll(".coin img").forEach(i => i.onclick = () => fiche(PAR_NUM[i.dataset.n])); rognerImages(el); };
  // toucher un lieu : il s'allume sur la carte et ses Pokémon s'affichent juste dessous (sans redessiner la carte)
  const choisir = k => el.querySelectorAll(".lieu").forEach(g => g.classList.toggle("choisi", +g.dataset.k === (k === 18 ? 2 : k)));
  choisir(k);
  el.querySelectorAll(".lieu").forEach(g => g.onclick = () => { lieuVu = +g.dataset.k; choisir(lieuVu);
    el.querySelector(".infos-lieu").outerHTML = infosLieu(lieuVu); brancher(); vibre(10); });
  brancher();
  // le champion de la carte : sa pose de base ; il bouge quand on le touche
  const anims = new Map();
  el.querySelectorAll("canvas[data-sprite]").forEach(cv => anims.set(cv, championAnime(cv, cv.dataset.sprite, !!cv.dataset.fixe)));
  colorerDresseur(el);
  const moi = el.querySelector(".sacha.touche"); if (moi) moi.onclick = () => editerDresseur();
  // toucher le champion sur la carte : il parle (bulle), et son arène s'affiche sous la carte
  const chef = el.querySelector(".chef");
  if (chef) chef.onclick = () => {
    const n = +chef.dataset.n, d = V.defi, a = LIEUX[d.lieu].arene, ch = CHAMPIONS[n];
    anims.get(chef.querySelector("canvas")).jouer();
    el.querySelectorAll(".bulle-chef").forEach(b => b.remove());
    // la bulle reste dans la carte : centrée sur le champion sans déborder, en dessous de lui s'il est tout en haut
    const x = parseFloat(chef.style.left), y = parseFloat(chef.style.top);
    const b = document.createElement("div"); b.className = "bulle-chef" + (y < 38 ? " dessous" : "");
    b.style.left = Math.min(Math.max(x, 36), 64) + "%"; b.style.top = y + "%";
    b.innerHTML = `<b>${ch.nom}</b> : ${d.arrive ? `« Montre-moi ce que tu vaux ! ${a.texte}${a.b ? `, ou ${a.b.texte}` : ""}. »`
      : `« Je t'attends ! Encore ${fr(d.reste)} pts de route. Mon défi : ${a.texte}. »`}`;
    el.querySelector(".carte-wrap").appendChild(b); vibre(10); ton(1250, 0, .05, {type: "square", vol: .03});
    setTimeout(() => b.remove(), 5000);
    lieuVu = d.lieu === 18 ? 2 : d.lieu; choisir(lieuVu); el.querySelector(".infos-lieu").outerHTML = infosLieu(d.lieu); brancher();
  };
  // toucher un badge gagné : revoir la scène de l'arène (sans rien changer)
  el.querySelectorAll(".boite-badges .oui").forEach(b => b.onclick = () => {
    const n = +b.dataset.n; sceneBadge(n, CAPTURES.find(c => c.id.endsWith(n === 9 ? "#ligue" : `#badge${n}`)), true); });
}

function dessinerRegles() {
  document.getElementById("regles").innerHTML = `
    <li>⚡ <b>Barre d'effort</b> (${D.barre.taille} points = une Poké Ball, elle ne se vide jamais) : 1 point par 100 pas au-delà de
      ${fr(D.barre.pas_offerts)} (la vie de tous les jours ne compte pas), 2 points par minute en zone, 1 par étage, 1 par minute de séance de sport
      (au moins ${R.seance_min} min), ${R.force} par minute de musculation, pompes, tractions ou rameur.</li>
    <li>🧭 Les types qui sortent dépendent de ce qui a le plus rempli ta barre dans la journée (sans compter les pas) : 🔥 minutes en zone → Feu, Électrik, Combat, Dragon ; 🏋️ musculation → Combat, Acier ;
      🪜 étages → Roche, Sol, Acier ; 🌳 marche → Plante, Insecte, Poison ; 🚴 vélo → Vol, Normal ; 🚣 rameur, 🏊 natation → Eau, Glace ;
      🏞️ elliptique → Psy, Spectre, Fée ; 👟 pas → tous les types.</li>
    <li>🎯 <b>Super Ball</b> : ${fr(R.objectif_pas)} pas <b>et</b> ${R.objectif_zone} min en zone dans la journée.</li>
    <li>⭐ <b>Hyper Ball</b> : ${fr(R.exploit_pas)} pas, ${R.exploit_zone} min en zone ou une séance de ${R.exploit_seance} min.</li>
    <li>👑 <b>Master Ball</b> : ${R.master_jours} jours sur les ${R.master_fenetre} derniers avec ${fr(R.objectif_pas)} pas ou ${R.objectif_zone} min en zone = un légendaire.
      Un jour raté ne remet rien à zéro : il sort du compte ${R.master_fenetre} jours plus tard.</li>
    <li>😴 Une nuit de ${R.nuit / 60} h ne donne pas de ball, mais rend les shiny 1,5 fois plus fréquents ce jour-là.</li>
    <li>🗺️ <b>Voyage dans Kanto</b> : les mêmes points te font avancer tout seul sur la carte, dans l'ordre des jeux, de Bourg Palette
      au Plateau Indigo (environ 3 mois, 4 à 5 barres par lieu). Rien à choisir : bouge, tu avances.</li>
    <li>📍 Les Poké Balls donnent surtout les Pokémon de l'endroit où tu es, parfois ceux que tu as ratés plus tôt ou ceux de l'étape
      suivante, et plus souvent ceux des types de ta journée. Les ⭐ rares sortent 3 fois moins. Tous les Pokémon du coin attrapés = ★ sur la carte.
      Plus rien de nouveau autour de toi : la ball pioche dans tout Kanto, donc aucune n'est perdue.</li>
    <li>🐾 <b>Compagnon</b> : il marche avec toi sur la carte. Choisis-le dans la fiche d'un Pokémon (sinon, c'est ta dernière capture).</li>
    <li>🏅 <b>Arènes</b> : dans chaque ville à arène, un défi sur 7 jours (ou son plan B : ${fr(R.objectif_pas)} pas ou ${R.objectif_zone} min en zone
      6 jours sur 7). Tes points continuent de compter pendant ce temps. Badge = une Hyper Ball du type du champion ; la Ligue = une Master Ball.</li>
    <li>Jamais de doublon : chaque capture est un Pokémon que tu n'avais pas (ou son shiny).</li>
    ${CAPTURES.some(c => c.id.endsWith("#chen") && estOuverte(c)) ? `<li><button class="filtre revoir">🎬 Revoir l'accueil du Professeur Chen</button></li>` : ""}
    ${V.badges[1] ? "" : `<li><button class="filtre apercu">🎬 Aperçu de la scène du badge (sans récompense)</button></li>`}
    <li><button class="filtre dresseur">🎨 ${DRESSEUR.nom ? `Mon dresseur : ${DRESSEUR.nom}` : "Personnaliser mon dresseur"}</button> (ou touche-le sur la carte)</li>`;
  document.querySelector("#regles .dresseur").onclick = () => editerDresseur();
  const ap = document.querySelector("#regles .apercu");
  if (ap) ap.onclick = () => sceneBadge(1, null, true);
  const r = document.querySelector("#regles .revoir");
  if (r) r.onclick = () => intro(CAPTURES.find(c => c.id.endsWith("#chen")), PROFESSEURS.chen, true);
}

function dessiner() { dessinerAOuvrir(); dessinerVoyage(); dessinerDernieres(); dessinerDex(); }
dessinerBarre(); dessinerSpeciales(); dessinerRegles(); dessiner();
{ // ouvertes ici mais pas encore dans la liste partagée (première fois, ou envoi raté) : on les envoie
  const depuis = new Date(Date.now() - 20 * 864e5).toISOString().slice(0, 10);
  partager([...ouvertes].filter(id => !serveur.has(id) && id.slice(0, 10) >= depuis));
}
document.getElementById("recherche").addEventListener("input", e => { texte = e.target.value; dessinerDex(); });

// La hauteur du cadre suit le contenu
const ajuster = () => { const h = document.getElementById("app").offsetHeight + 16;
  try { const f = window.frameElement; f.style.height = h + "px"; f.height = h; if (f.parentElement) f.parentElement.style.height = "auto"; } catch (e) {} };
new ResizeObserver(ajuster).observe(document.getElementById("app"));
window.addEventListener("load", ajuster); setTimeout(ajuster, 300);
</script>
