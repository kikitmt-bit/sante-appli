# Les règles du jeu, à chaque envoi (tests/test_regles.py : sans réseau ni données).
name: Tests des règles
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas
      - run: python -m unittest discover tests
