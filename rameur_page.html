<!doctype html>
<meta charset="utf-8">
<script>
// Le raccourci du rameur (?rameur=1, Kiki, 06/11) : l'écran du rameur seul, sans la récolte Google ni le jeu. Mêmes écrans que dans Muscu (rameur.js).
const P = window.parent.document, PW = window.parent, D = {rameur: __DONNEES__}, ETAT = "__ETAT__", IMAGES = "__IMAGES__";
const IMG = {mini: n => `${IMAGES}/pokemon/${n}.png`};
const STYLE_ENTR = `__STYLE_ENTR__`;
let AC = null;
function audio() { if (!AC) { const A = PW.AudioContext || PW.webkitAudioContext; if (A) AC = new A(); } if (AC && AC.state !== "running") AC.resume(); try { if (PW.navigator.audioSession) PW.navigator.audioSession.type = "playback"; } catch (e) {} return AC; }
function ton(f, depart, duree, {type = "sine", vol = .1} = {}) { const c = audio(); if (!c) return; const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + depart; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + duree); o.connect(g).connect(c.destination); o.start(t); o.stop(t + duree); }
const vibre = ms => { try { PW.navigator.vibrate && PW.navigator.vibrate(ms); } catch (e) {} };
const PAGE_HAUTE = () => { try { if (PW.top.document) return PW.top; } catch (e) {} return PW; };
function installerStyle(id, css) { let s = P.getElementById(id); if (!s) { s = P.createElement("style"); s.id = id; P.head.appendChild(s); } s.textContent = css; }
function preparerScene() { if (!P.getElementById("pkm-police-pixel")) { const l = P.createElement("link"); l.id = "pkm-police-pixel"; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Jersey+15&display=swap"; P.head.appendChild(l); } }
function confirmerDeuxFois(b, question, faire) { const texte = b.textContent; let arme = null; b.onclick = e => { e.stopPropagation(); if (arme) { clearTimeout(arme); arme = null; return faire(); } vibre(10); b.textContent = question; arme = setTimeout(() => { arme = null; b.textContent = texte; }, 3000); }; }
/*__RAMEUR_JS__*/
function ouvrirJeu() { const w = PAGE_HAUTE(), u = new URL(w.location.href); u.searchParams.delete("rameur"); w.location.href = u.href; }
const seance = () => ecranRameur({surFermer: seance, quitter: {texte: "Ouvrir PokéFit", faire: ouvrirJeu}});
P.querySelectorAll(".pkm-rameur").forEach(x => x.remove());
if (ETAT) {  // on revient d'un enregistrement : on le dit, sans repartir tout seul sur une nouvelle séance
  preparerScene(); installerStyle("pkm-entr-style", STYLE_ENTR); installerStyle("pkm-rameur-style", STYLE_RAMEUR);
  const v = P.createElement("div"); v.className = "pkm-entr pkm-rameur"; P.body.appendChild(v);
  v.innerHTML = ETAT === "ok"
    ? `<div class="boite"><div class="tete-e"><img src="${IMG.mini(86)}" alt=""><h3>Séance enregistrée !</h3></div><p>Aujourd'hui : ${D.rameur.minutes} min de rameur. Elle compte dans ton aventure.</p></div><button class="go r-nouvelle">Nouvelle séance</button><button class="sec r-jeu">Ouvrir PokéFit</button>`
    : `<div class="boite"><h3>Pas encore envoyée</h3><p>Ta séance reste gardée sur ton téléphone. Vérifie ta connexion et réessaie.</p></div><button class="go r-encore">Réessayer</button><button class="sec r-jeu">Ouvrir PokéFit</button>`;
  v.querySelector(".r-jeu").onclick = ouvrirJeu;
  if (ETAT === "ok") v.querySelector(".r-nouvelle").onclick = () => { v.remove(); seance(); };
  else v.querySelector(".r-encore").onclick = () => PW.location.reload();
} else seance();
</script>
