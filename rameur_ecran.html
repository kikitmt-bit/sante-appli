<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- L'écran du rameur sur la tablette (?ecran=rameur, Kiki, 07/11) : « La Grande Traversée ». La tablette pilote tout (départ, fin, ce qu'affiche le rameur),
     le téléphone sous le siège envoie chaque coup en direct (PeerJS) et enregistre la séance. Affiché en plein écran par app.py ; les données arrivent dans
     __DONNEES__ (seances_rameur.page_tablette) : modèle des mètres par coup, progression (tirée des séances), région et arènes de Poké Fit, couleurs du dresseur.
     Toute l'interface est dessinée pour un écran de 1000 px de haut, puis mise à l'échelle (#ui) ; la scène est un canvas de 216 px de haut, en pixels. -->
<title>La Grande Traversée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Pixelify+Sans:wght@500&display=swap">
<style>
:root{
  --nuit:#22315A; --nuit2:#1B2849; --creme:#F8F8E8; --creme2:#ECECD8; --bord:#484838; --encre:#383828; --encre2:#686850;
  --rouge:#D83830; --accent:#C03028; --orange:#B05010; --pv:#48C868; --exp:#40A8F8; --or:#F8C838; --vert:#1E7A3C;
  --jeu:"Jersey 15", "Pixelify Sans", ui-monospace, monospace; --titre:"Pixelify Sans", "Jersey 15", ui-monospace, monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#10182C}
body{font-family:var(--jeu);font-size-adjust:0.55;color:var(--encre);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:fixed;left:0;top:0;transform-origin:0 0;height:1000px;overflow:hidden}
.ecran{position:absolute;inset:0}
[hidden]{display:none!important}
.boite{background:var(--creme);color:var(--encre);border:4px solid var(--bord);border-radius:16px 7px;box-shadow:5px 5px 0 rgba(16,24,44,.5)}
.lab{font-size:24px;color:var(--encre2);letter-spacing:.05em;text-transform:uppercase;line-height:1}
.val{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:400;margin:0;line-height:1.05}
button{font-family:var(--jeu);cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--or);outline-offset:3px}
.go{font-size:44px;background:var(--rouge);color:#fff;border:4px solid #78180F;border-radius:14px 6px;padding:12px 40px;box-shadow:5px 5px 0 #78180F}
.go:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #78180F}
.go:disabled{background:#B8A8A0;border-color:#786860;box-shadow:5px 5px 0 #786860;cursor:default}
.sec{font-size:30px;background:var(--creme);color:var(--encre);border:4px solid var(--bord);border-radius:12px 5px;padding:8px 22px;box-shadow:4px 4px 0 rgba(16,24,44,.45)}
.sec:active{transform:translate(2px,2px)}
.barre-pv{height:18px;background:#D8D8C0;border:3px solid var(--bord);border-radius:6px;overflow:hidden}
.barre-pv i{display:block;height:100%;background:var(--pv);transition:width .3s}
.barre-pv.exp i{background:var(--exp)}.barre-pv.or i{background:var(--or)}
.barre-pv.bas i{background:var(--or)}.barre-pv.critique i{background:var(--accent)}

/* ---------- le menu ---------- */
#menu{display:flex;flex-direction:column;padding:26px 34px 24px;gap:20px;background:linear-gradient(rgba(16,24,44,.18),rgba(16,24,44,.05) 30%,rgba(16,24,44,.25))}
.haut{display:flex;align-items:center;gap:18px}
.logo{font-family:var(--titre);font-size:54px;color:var(--creme);text-shadow:5px 5px 0 var(--bord),-2px -2px 0 var(--bord),2px -2px 0 var(--bord),-2px 2px 0 var(--bord);letter-spacing:.03em;white-space:nowrap}
.chip{font-size:28px;background:var(--nuit);color:var(--creme);border:3px solid #10182C;border-radius:10px 4px;padding:4px 14px;white-space:nowrap}
.flex1{flex:1}
.pill{font-size:28px;padding:6px 16px;border-radius:10px 4px;border:3px solid var(--bord);background:#ECECD8;white-space:nowrap}
.pill.ok{background:#D8F0D0;color:#1E5A2C;border-color:#1E5A2C}.pill.ko{background:#F8E0D8;color:var(--accent);border-color:var(--accent)}
.icone{font-size:34px;width:64px;height:64px;padding:0;background:var(--creme);border:4px solid var(--bord);border-radius:12px 5px;box-shadow:4px 4px 0 rgba(16,24,44,.45)}
.icone.off{opacity:.55}
.colonnes{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);gap:24px;min-height:0}
.col{padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.col h2{font-size:34px;color:var(--accent)}
#equipage .portrait{height:230px;flex:none;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 85%,#B8E0F8 0 30%,transparent 31%),linear-gradient(#D8F0F8,#F8F8E8);border:3px solid var(--bord);border-radius:12px 5px;overflow:hidden}
#equipage .portrait canvas{width:220px;height:220px;image-rendering:pixelated}
#equipage .nom{display:flex;justify-content:space-between;align-items:baseline;font-size:40px}
#equipage .nv{color:var(--accent)}
.petit{font-size:26px;color:var(--encre2);line-height:1.15}
.attaques{display:flex;flex-wrap:wrap;gap:8px}
.attaques span{font-size:24px;background:#E0ECF8;border:2px solid #5878A8;border-radius:8px 3px;padding:2px 10px;color:#283868}
.attaques span.bientot{background:transparent;border-style:dashed;color:var(--encre2);border-color:#A8A890}
#sorties{display:flex;flex-direction:column;gap:14px;overflow:auto;padding:16px 10px 10px 4px;min-height:0;height:100%;box-sizing:border-box}
.sortie{display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:center;gap:20px;text-align:left;padding:14px 20px;font-size:30px;position:relative;flex:none}
.sortie.choisie{outline:6px solid var(--or);outline-offset:-2px;background:#FFF8D8}
.sortie .vig{width:120px;height:90px;border:3px solid var(--bord);border-radius:10px 4px;overflow:hidden;background:#88C4F4;display:flex;align-items:flex-end;justify-content:center}
.sortie .vig img{height:100%;image-rendering:pixelated;object-fit:contain}
.sortie .vig.arene{background:#D8F0F8;align-items:flex-start}.sortie .vig.arene img{height:170%;width:auto;image-rendering:auto}
.sortie b{display:block;font-weight:400;font-size:38px;line-height:1}
.sortie .info{font-size:26px;color:var(--encre2);line-height:1.15;margin-top:4px}
.sortie .droite{text-align:right;font-size:26px;color:var(--encre2);white-space:nowrap}
.etoiles{font-size:34px;letter-spacing:2px;color:#C8C0A0}.etoiles .on{color:#E8A820;text-shadow:2px 2px 0 var(--bord)}
.sortie.verrou{filter:grayscale(.8);opacity:.75}
.sortie .tag{position:absolute;top:-14px;right:18px;font-size:24px;background:var(--rouge);color:#fff;border:3px solid #78180F;border-radius:8px 3px;padding:0 10px}
.sortie .tag.or{background:var(--or);color:var(--encre);border-color:var(--bord)}
.obj{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-bottom:3px dashed #D0D0B8}
.obj .l{display:flex;justify-content:space-between;font-size:28px;gap:10px}
.obj .l span:last-child{color:var(--encre2);white-space:nowrap}
.obj.fait .l span:first-child::before{content:"✓ ";color:var(--vert)}
.carnet{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.carnet img{width:56px;height:56px;image-rendering:pixelated}
.bas{display:flex;align-items:center;gap:20px}
.bas .aide{flex:1;font-size:30px;color:var(--creme);text-shadow:3px 3px 0 var(--bord);line-height:1.15}
.bas .go{font-size:56px;padding:12px 56px}

/* ---------- la course ---------- */
#hud{pointer-events:none}
#hud .boite{position:absolute}
#hG{left:24px;top:22px;padding:14px 20px;display:grid;grid-template-columns:auto auto;gap:8px 22px;align-items:baseline}
#hD{right:110px;top:22px;padding:14px 20px;min-width:230px}
#hD .elan{display:flex;align-items:center;gap:10px}
#hD .elan .val{font-size:56px}
#flamme{width:30px;height:40px;display:inline-block;image-rendering:pixelated}
#vitesse{left:50%;top:14px;transform:translateX(-50%);width:400px;padding:4px 16px 12px;text-align:center}
#vitesse svg{width:100%;display:block}
#vitesse .kmh{font-size:68px;line-height:.9;font-variant-numeric:tabular-nums;margin-top:-58px}
#vitesse .kmh small{font-size:28px;color:var(--encre2)}
#vitesse .split{font-size:28px;color:var(--encre2);margin-top:2px}
#vitesse.turbo{background:#FFF4C8;box-shadow:5px 5px 0 rgba(16,24,44,.5),0 0 0 6px rgba(248,200,56,.7)}
#etat.rapide{color:#1E7A3C}#etat.turbo{color:var(--orange)}
#fantomeBoite{left:50%;transform:translateX(-50%);top:318px;padding:6px 20px;font-size:32px;white-space:nowrap}
.devant{color:var(--vert)}.derriere{color:var(--accent)}
#bas{left:24px;right:24px;bottom:22px;padding:12px 22px;display:flex;align-items:center;gap:22px;font-size:30px}
#piste{position:relative;flex:1;height:22px;background:#D8D8C0;border:3px solid var(--bord);border-radius:7px}
#piste .fait{position:absolute;left:0;top:0;bottom:0;background:var(--exp);border-radius:4px;z-index:1;opacity:.85}
#piste .seg{position:absolute;top:0;bottom:0;opacity:.85}
#piste .seg span{position:absolute;bottom:24px;left:2px;font-size:22px;color:var(--creme);text-shadow:2px 2px 0 var(--bord);white-space:nowrap}
#piste .mk{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--bord);background:linear-gradient(var(--rouge) 0 45%,var(--bord) 45% 55%,#fff 55%);z-index:2}
#piste .mk.gagne{filter:grayscale(1) brightness(1.3)}
#piste .moi,#piste .ombre{position:absolute;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid var(--bord);z-index:3}
#piste .moi{background:var(--rouge);z-index:4}#piste .ombre{background:#fff;opacity:.7}
#adv{right:24px;top:180px;padding:14px 20px;width:390px}
#adv .nom{font-size:36px;display:flex;justify-content:space-between}
#adv .regle{font-size:26px;color:var(--encre2);margin-top:8px;line-height:1.1}
#adv .chrono{height:10px;background:#D8D8C0;margin-top:8px;border-radius:4px;overflow:hidden}#adv .chrono i{display:block;height:100%;background:var(--exp)}
#jauge{left:24px;top:250px;padding:14px 20px;width:330px}
#jauge .lab{margin-bottom:8px}
#dial{left:50%;transform:translateX(-50%);top:390px;width:min(1100px,80%);padding:20px 30px;font-size:38px;line-height:1.15;text-wrap:pretty;display:flex;gap:22px;align-items:center;transition:opacity .25s;box-sizing:border-box}
#dial.cache{opacity:0}
#dial img{height:130px;flex:none}
#gros{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--titre);font-size:190px;color:var(--creme);text-shadow:10px 10px 0 var(--bord);pointer-events:none;text-align:center;line-height:1}
#gros small{display:block;font-size:56px;margin-top:10px}
.pop{position:absolute;font-size:46px;color:#fff;text-shadow:4px 4px 0 var(--bord);pointer-events:none;animation:monte 1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.or{color:var(--or)}.pop.gris{color:#F0E0C8;font-size:34px}
@keyframes monte{from{translate:0 0;opacity:1}to{translate:0 -110px;opacity:0}}
.banniere{position:absolute;left:50%;top:560px;transform:translateX(-50%);font-family:var(--titre);font-size:64px;color:var(--or);text-shadow:6px 6px 0 var(--bord),-3px -3px 0 var(--bord);white-space:nowrap;pointer-events:none;animation:ban 1.8s ease-out forwards;z-index:5}
@keyframes ban{0%{scale:.4;opacity:0}15%{scale:1.15;opacity:1}25%{scale:1}80%{opacity:1}100%{opacity:0;translate:0 -30px}}
#bPause{position:absolute;right:24px;top:22px;pointer-events:auto;font-size:38px;width:72px;height:72px}
#telPerdu{position:absolute;left:50%;top:330px;transform:translateX(-50%);font-size:30px}

/* ---------- les cartes plein écran (fin, saisie, pause, intro) ---------- */
.calque{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(16,24,44,.45)}
.carte{background:var(--creme);border:5px solid var(--bord);border-radius:22px 9px;box-shadow:8px 8px 0 rgba(16,24,44,.6);padding:34px 46px;max-height:92%;overflow:auto;max-width:92%;box-sizing:border-box;position:relative}
.carte h1{font-family:var(--titre);font-size:58px;color:var(--accent);margin-bottom:10px;letter-spacing:.03em}
.carte .sous{font-size:34px;margin:0 0 18px;line-height:1.15}
.boutons{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 34px;margin:18px 0}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats b{font-weight:400;font-size:44px;font-variant-numeric:tabular-nums}
.medaille{display:inline-block;width:70px;height:70px;border-radius:50%;border:5px solid var(--bord);box-shadow:inset -8px -8px 0 rgba(0,0,0,.15);flex:none}
.m-or{background:var(--or)}.m-argent{background:#D0D8E0}.m-bronze{background:#D89058}.m-aucune{background:#B8B8A0}
.gros-etoiles{font-size:96px;letter-spacing:10px;color:#C8C0A0;line-height:1}
.gros-etoiles span{display:inline-block}.gros-etoiles .on{color:#E8A820;text-shadow:5px 5px 0 var(--bord);animation:etoile .5s ease-out both}
@keyframes etoile{from{scale:2.4;opacity:0;rotate:-40deg}to{scale:1;opacity:1;rotate:0deg}}
.criteres{font-size:30px;display:grid;gap:6px;margin:10px 0 0}
.criteres .ok{color:var(--vert)}.criteres .non{color:var(--encre2)}
.vus{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:28px}
.vus img{width:80px;height:80px;image-rendering:pixelated}
#saisieCarte{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:34px;width:1250px;max-width:100%}
.champ{display:flex;flex-direction:column;gap:6px;padding:14px 18px;border:4px solid var(--bord);border-radius:12px 5px;background:#fff;cursor:pointer;text-align:left}
.champ.actif{outline:6px solid var(--or)}
.champ .v{font-size:56px;line-height:1;min-height:56px;font-variant-numeric:tabular-nums}
.champ .v.vide{color:#B0B098}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pave button{font-size:60px;padding:14px 0;background:var(--creme);border:4px solid var(--bord);border-radius:12px 5px;box-shadow:4px 4px 0 rgba(16,24,44,.45)}
.pave button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(16,24,44,.45)}
.message{font-size:30px;color:var(--accent);min-height:36px;margin:10px 0 0}
.xp-ligne{display:flex;align-items:center;gap:26px;margin:14px 0}
.xp-ligne canvas{width:200px;height:200px;image-rendering:pixelated;flex:none}
.xp-ligne .barre-pv{height:30px}
.tenir{position:relative;overflow:hidden}
.tenir i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(216,56,48,.3);pointer-events:none}
#intro .carte{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center;width:1350px}
#intro .champion{height:560px}
.prix{display:flex;align-items:center;gap:24px;margin:16px 0;font-size:32px}
.prix img,.prix canvas{width:110px;height:110px;image-rendering:pixelated;flex:none}
.phases{display:grid;gap:6px;font-size:30px;margin:12px 0}
.phases div{display:flex;gap:14px}.phases b{font-weight:400;color:var(--accent);min-width:90px}
#evo{background:#000}
#evo canvas{width:640px;height:640px;image-rendering:pixelated}
#evo .txt{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);width:1100px;font-size:44px;text-align:center}
@media (prefers-reduced-motion: reduce){.pop,.banniere,.gros-etoiles .on{animation-duration:.01s}}
</style>

<canvas id="c" width="384" height="216" aria-label="La mer"></canvas>
<div id="ui">
  <!-- MENU -->
  <div class="ecran" id="menu">
    <div class="haut"><div class="logo">LA GRANDE TRAVERSÉE</div><span class="chip" id="mRegion">Kanto</span><div class="flex1"></div>
      <span class="pill" id="mTel">Je cherche ton téléphone…</span><button class="icone" id="bSon" aria-label="Son">🔊</button><button class="icone" id="bPlein" aria-label="Plein écran">⛶</button></div>
    <div class="colonnes">
      <section class="boite col" id="equipage" aria-label="Ton équipage"></section>
      <section class="col" style="padding:0"><div id="sorties"></div></section>
      <section class="boite col" id="semaine" aria-label="Cette semaine"></section>
    </div>
    <div class="bas"><div class="aide" id="aide"></div><button class="sec" id="bEssai">Essayer sans téléphone</button><button class="go" id="bPartir">▶ PARTIR</button></div>
  </div>
  <!-- COURSE -->
  <div class="ecran" id="hud" hidden>
    <div class="boite" id="hG"><span class="lab">Distance</span><span class="val" id="vDist">0 m</span><span class="lab">Temps</span><span class="val" id="vTemps">0:00</span><span class="lab">Coups</span><span class="val" id="vCoups">0</span></div>
    <div class="boite" id="vitesse"><svg viewBox="0 0 200 112" aria-hidden="true"><g id="arcs"></g><line id="aiguille" x1="100" y1="100" x2="100" y2="22" stroke="#383828" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#383828"/></svg>
      <div class="kmh"><span id="vKmh">0,0</span> <small>km/h</small></div><div class="split"><span id="vSplit">–:––</span> /500 m · <span id="etat">Mise en route</span></div></div>
    <div class="boite" id="hD"><div class="lab">Élan</div><div class="elan"><canvas id="flamme" width="15" height="20"></canvas><span class="val" id="vElan">×0</span></div>
      <div class="lab" style="margin-top:8px">Cadence <span id="vCad" style="color:var(--encre);font-size:34px">0</span> /min</div></div>

    <div class="boite" id="adv" hidden><div class="nom"><span id="aNom"></span><span id="aNv"></span></div><div class="barre-pv" id="aPvB"><i id="aPv" style="width:100%"></i></div>
      <div class="chrono"><i id="aChr" style="width:100%"></i></div><div class="regle" id="aRegle"></div></div>

  <div class="calque" id="recomp" hidden><div class="carte" id="recompCarte" style="width:1200px"></div></div>
  <div class="calque" id="evo" hidden><canvas id="evoC" width="64" height="64"></canvas><div class="txt boite" id="evoTxt" style="padding:20px 30px"></div></div>
</div>

<script>
"use strict";
const D = __DONNEES__;
/* ======================= outils ======================= */
const $ = id => document.getElementById(id);

    SAISIE[champActif] = n === "c" ? v.slice(0, -1) : n === "x" ? "" : (v + n).replace(/^0+(?=\d)/, "").slice(0, champActif === "sec" ? 2 : 6); dessinerSaisie(); });

    if (essai) return recompense(nb("distance"), true);

    envoyer({type: "saisie", distance: nb("distance"), min: nb("min"), sec: nb("sec"), watts: nb("watts"), kcal: nb("kcal"), jeu});
    SEANCE.etat = "saisie"; SEANCE.metres = nb("distance") || SEANCE.bilan.devine || null; SEANCE.duree = (nb("min") || 0) * 60 + (nb("sec") || 0) || SEANCE.bilan.actif_s;

    clearTimeout(SEANCE.attente); SEANCE.attente = setTimeout(() => { if (SEANCE.etat === "saisie") { SEANCE.etat = "stop"; dessinerSaisie("Le téléphone ne répond pas : regarde son écran, il a peut-être déjà enregistré."); } }, 9000);
  };

}
function finSeance() { SEANCE.etat = "aucune"; SEANCE.bilan = null; SEANCE.t0 = null; COURSES_FAITES.length = 0; VUS_SEANCE.clear(); ELAN_MAX = 0; }

/* ======================= la récompense : l'expérience du compagnon ======================= */
function recompense(metres, simule) {
  $("saisie").hidden = true; clearTimeout(SEANCE.attente);
  const gain = Math.round(metres || COURSES_FAITES.reduce((t, c) => t + c.dist, 0) || 0);
  const avant = XP, prog = D.progression, obj = (prog.objectifs || []).map(o => ({...o}));
  let bonus = 0;
  for (const o of obj) { const deja = o.valeur >= o.cible;  // ce que la séance change aux objectifs de la semaine (le serveur refera le compte)
    if (o.cle === "distance") o.valeur += gain;
    if (o.cle === "carnet") o.valeur = new Set([...(prog.vus_semaine || []), ...VUS_SEANCE]).size;
    if (o.cle === "jours" && (SEANCE.duree || 0) >= 600 && !prog.jour_fait) o.valeur += 1;
    if (!deja && o.valeur >= o.cible) { o.nouveau = true; bonus += 1000; } }
  const apres = avant + gain + bonus, n0 = niveauDe(avant).n;
  if (!simule) { XP = apres; prog.xp = apres; prog.objectifs = obj; prog.vus = [...new Set([...(prog.vus || []), ...VUS_SEANCE])]; prog.vus_semaine = [...new Set([...(prog.vus_semaine || []), ...VUS_SEANCE])];
    if ((SEANCE.duree || 0) >= 600) prog.jour_fait = true; prog.nb = (prog.nb || 0) + 1; prog.semaine_m = (prog.semaine_m || 0) + gain;
    for (const c of COURSES_FAITES) { const n = prog.niveaux[c.cle] = prog.niveaux[c.cle] || {etoiles: 0, record_s: null}; n.etoiles = Math.max(n.etoiles, c.etoiles); if (c.fini && c.cle !== "libre" && (!n.record_s || c.temps_s < n.record_s)) n.record_s = c.temps_s; } }
  const cp = COMPAGNON(n0);
  $("recompCarte").innerHTML = `<h1>${simule ? "ESSAI TERMINÉ" : "SÉANCE ENREGISTRÉE !"}</h1>
    <p class="sous">${simule ? "Sans téléphone, rien n'est enregistré : voici ce que tu aurais gagné." : "Le téléphone l'envoie à Poké Fit : elle compte comme toutes tes séances (points, défis, missions)."}</p>
    <div class="xp-ligne"><canvas id="rPk" width="64" height="64"></canvas><div style="flex:1"><div style="display:flex;justify-content:space-between;font-size:40px"><span id="rNom">${cp.nom}</span><span id="rNv" style="color:var(--accent)">N. ${n0}</span></div>
      <div class="barre-pv exp" style="margin:10px 0"><i id="rXp" style="transition:none"></i></div><div class="petit">+${gain.toLocaleString("fr-FR")} d'expérience (1 par mètre)${bonus ? ` · +${bonus.toLocaleString("fr-FR")} d'objectifs` : ""}</div></div></div>
    <div>${obj.map(o => `<div class="obj ${o.valeur >= o.cible ? "fait" : ""}"><div class="l"><span>${o.texte}${o.nouveau ? ` <b style="color:var(--orange);font-weight:400">+1 000 !</b>` : ""}</span><span>${o.unite === "m" ? fmtKm(o.valeur) + " / " + fmtKm(o.cible) : o.valeur + " / " + o.cible}</span></div><div class="barre-pv ${o.valeur >= o.cible ? "or" : ""}"><i style="width:${Math.min(100, o.valeur / o.cible * 100)}%"></i></div></div>`).join("")}</div>
    <div class="boutons"><button class="go" id="rOk">▶ OK</button></div>
    ${simule ? "" : `<p class="petit" style="margin-top:12px">Pour une autre séance : sur le téléphone, Rameur → Avec la tablette.</p>`}`;
  $("recomp").hidden = false;
  const pkc = $("rPk").getContext("2d"), dessinePk = num => { pkc.clearRect(0, 0, 64, 64); const i = pk(num); if (i) pkc.drawImage(i, 0, 0); };
  chargerPk([129, 130]).then(() => dessinePk(cp.num));
  let x = avant; const pasXp = Math.max(30, (apres - avant) / 2.6) / 60;  // la barre se remplit, niveau après niveau
  const anim = () => { const nv = niveauDe(x); $("rXp").style.width = nv.dans / nv.pour * 100 + "%"; $("rNv").textContent = "N. " + nv.n;
    if (x >= apres) return; x = Math.min(apres, x + pasXp); const n2 = niveauDe(x).n;
    if (n2 > nv.n) { SONS.niveau(); banniere(`${COMPAGNON(nv.n).nom} monte au niveau ${n2} !`, $("recomp"), 70); const att = ATTAQUES.find(a => a[0] === n2 && n2 > 1); if (att) setTimeout(() => banniere(`Nouvelle attaque : ${att[1]} !`, $("recomp"), 70), 1500);
      if (n2 === EVOLUTION) { setTimeout(() => evolution(129, 130, () => { dessinePk(130); $("rNom").textContent = "Léviator"; requestAnimationFrame(anim); }), 1800); return; } }
    requestAnimationFrame(anim); };
  setTimeout(() => requestAnimationFrame(anim), 600);
  $("rOk").onclick = () => { $("recomp").hidden = true; finSeance(); if (simule) { essai = false; auto = false; } SORTIES = lesSorties(); choix = SORTIES.find(s => s.cle === choix.cle) || SORTIES[0]; versMenu(); };
}
/* L'évolution : silhouettes qui s'échangent de plus en plus vite, éclair, nouvelle forme */
function evolution(de, vers, fini) {
  const ov = $("evo"), x = $("evoC").getContext("2d"); ov.hidden = false; $("evoTxt").textContent = `Quoi ? ${NOMS[de]} évolue !`; parle(`Quoi ? ${NOMS[de]} évolue !`);
  const a = teinte(pk(de), "#FFFFFF"), b = teinte(pk(vers), "#FFFFFF"), t0 = performance.now();
  const tic = now => { const t = (now - t0) / 1000; x.clearRect(0, 0, 64, 64);
    if (t < 5) { x.drawImage(Math.floor(t * (1.5 + t * t * 1.4)) % 2 ? b : a, 0, 0); requestAnimationFrame(tic); }
    else if (t < 5.6) { x.fillStyle = "#fff"; x.fillRect(0, 0, 64, 64); requestAnimationFrame(tic); }
    else { x.drawImage(pk(vers), 0, 0); const txt = `Félicitations ! Ton ${NOMS[de]} a évolué en ${NOMS[vers]} !`; $("evoTxt").textContent = txt; parle(txt); SONS.fanfare(); setTimeout(() => { ov.hidden = true; fini(); }, 3600); } };
  requestAnimationFrame(tic); SONS.turbo();
}

/* ======================= le menu ======================= */

    <div class="petit">Chaque objectif réussi : +1 000 d'expérience.</div>
    <h2 style="margin-top:8px">Carnet de bord</h2><div class="petit">${vus.length} Pokémon vu${vus.length > 1 ? "s" : ""} en mer${vus.length ? "" : " : ils sautent de l'eau pendant tes sorties"}</div><div class="carnet">${vus.slice(-12).map(v => `<img src="${SP(v)}" alt="${NOMS[v] || ""}" title="${NOMS[v] || ""}">`).join("")}</div>`;

    const st = s.stats || {}, et = `<span class="etoiles">${[0, 1, 2].map(k => `<span class="${k < (st.etoiles || 0) ? "on" : ""}">★</span>`).join("")}</span>`, ch = s.cle === choix.cle ? "choisie" : "";
    if (s.type === "route") return `<button class="boite sortie ${ch}" data-i="${i}"><div class="vig"><img src="${SP(T_ === THEMES.Johto ? 223 : 72)}" alt=""></div><div><b>${s.nom}</b><div class="info">${s.de} → ${s.a} · 2 000 m · 2 dresseurs, des vagues, ton fantôme</div></div><div class="droite">${et}<br>${st.record_s ? "Record " + fmt(st.record_s) : "Pas encore de record"}</div></button>`;

      <div><b>${cache ? "Arène verrouillée" : "Arène " + de(a.champion)}</b><div class="info">${cache ? `Arrive à ${a.lieu} dans Poké Fit pour la débloquer` : `${a.cible} min · ${a.texte}${a.etat === "defi" && a.valeur ? ` · déjà ${Math.round(a.valeur)} min` : ""}`}</div></div><div class="droite">${ok ? et : "🔒"}</div></button>`;
  }).join("");

function majAide() {
  const enCours = SEANCE.etat === "mesure" || SEANCE.etat === "lancee";
  $("aide").textContent = essai ? "Essai sans téléphone : touche l'écran ou la barre d'espace pour ramer ; A = ramer tout seul, X = accéléré."
    : enCours ? `Séance en cours sur le téléphone${SEANCE.t0 ? " depuis " + fmt((Date.now() - SEANCE.t0) / 1000) : ""} : choisis ta prochaine sortie.`
    : telOk ? "Téléphone relié ! Installe-toi, choisis ta sortie et pars quand tu es prêt." : "Sur le téléphone : Muscu → Rameur → « Avec la tablette ».";
  $("bPartir").disabled = !(telOk || essai || SEANCE.etat === "mesure") || !debloquee(choix);
  $("bEssai").hidden = essai || telOk || SEANCE.etat !== "aucune";
  const tel = $("mTel"); tel.textContent = essai ? "Essai sans téléphone" : telOk ? "Téléphone relié ✓" : TEL_TXT; tel.className = "pill " + (telOk ? "ok" : essai ? "" : "ko");
  if (SEANCE.etat === "mesure" && !essai) { const b = document.createElement("button"); b.className = "sec tenir"; b.style.cssText = "font-size:26px;margin-left:14px;text-shadow:none"; b.innerHTML = "<i></i>■ Terminer la séance (maintiens)"; $("aide").appendChild(b); tenir(b, terminerSeance); }
}
setInterval(() => { if (!$("menu").hidden && SEANCE.etat === "mesure") majAide(); }, 15000);

/* ======================= le téléphone sous le siège ======================= */
const vits = [];
function coupReel(m) {
  if (S.etat !== "course") return;
  const vit = +m.vit || 0; vits.push(vit); if (vits.length > 20) vits.shift();
  const tri = [...vits].sort((a, b) => a - b), med = tri[Math.floor(tri.length / 2)] || vit || 1;
  const force = vits.length < 3 ? .5 : .5 + (vit / med - 1) * 1.5;  // fort = plus vite que tes derniers coups
  const metres = D.modele ? Math.max(3, D.modele.a + D.modele.b * vit) : 6 + 4 * clamp(force, 0, 1);
  coup(force, metres, +m.dur || null);
}
let telOk = false, conn = null, TEL_TXT = "Je cherche ton téléphone…";
function envoyer(m) { if (conn && conn.open) { try { conn.send(m); } catch (e) {} } }
function recevoir(m) {
  if (!m || typeof m !== "object") return;
  if (m.type === "bonjour") {
    telOk = true; $("telPerdu").hidden = true;
    if (m.etat === "mesure" && SEANCE.etat !== "mesure") { SEANCE.etat = "mesure"; SEANCE.t0 = m.depuis || Date.now(); if (S.etat === "pret") partirVraiment(); }  // la tablette s'était fermée : la séance continue
    if (m.etat === "fini" && SEANCE.etat !== "saisie") { SEANCE.etat = "stop"; envoyer({type: "stop"}); if ($("saisie").hidden) ouvrirSaisie(); }
    if (m.etat === "attente" && SEANCE.etat === "lancee") envoyer({type: "lancer", s: 5});
    if (m.etat === "attente" && SEANCE.etat === "mesure") { SEANCE.etat = "aucune"; }  // le téléphone a été relancé : nouvelle séance
    if (!$("menu").hidden) { majAide(); SONS.bip(true); parle("Téléphone relié."); }
  }
  if (m.type === "decompte" && S.etat === "pret") { $("gros").innerHTML = `${m.s}<small>Mets-toi en position</small>`; SONS.bip(false); if (m.s <= 3) parle(String(m.s)); }
  if (m.type === "zero") { SEANCE.etat = "mesure"; SEANCE.t0 = SEANCE.t0 || Date.now(); if (S.etat === "pret") partirVraiment(); }
  if (m.type === "coup") coupReel(m);
  if (m.type === "bilan") { SEANCE.bilan = m; if (!$("saisie").hidden) dessinerSaisie(); }
  if (m.type === "garde") recompense(SEANCE.metres, false);
  if (m.type === "erreur") { SEANCE.etat = "stop"; dessinerSaisie(m.texte || "Le téléphone n'a pas pu enregistrer."); }
  if (m.type === "jete") { $("saisie").hidden = true; finSeance(); versMenu(); }
  if (m.type === "fin") { finSeance(); if (S.etat === "course") dire("Séance terminée sur le téléphone.", 5000); }
}
let peer = null;
function ecouter() {
  if (!D.lien || !window.Peer) { TEL_TXT = D.lien ? "Lien impossible : recharge la page" : "Pas de lien pour ce compte"; majAide(); return; }
  peer = new Peer("pokefit-rameur-" + D.lien);
  peer.on("open", () => { TEL_TXT = "En attente du téléphone"; majAide(); });
  peer.on("connection", c => {
    c.on("open", () => { if (conn && conn !== c) { try { conn.close(); } catch (e) {} } conn = c; });
    c.on("data", d => { conn = c; recevoir(d); });
    c.on("close", () => { if (conn !== c) return; conn = null; telOk = false; TEL_TXT = "Téléphone déconnecté"; majAide(); if (S.etat === "course") $("telPerdu").hidden = false; });
  });
  peer.on("disconnected", () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 3000));
  peer.on("error", e => {
    if (e.type === "unavailable-id") { TEL_TXT = "Cet écran est déjà ouvert ailleurs : je réessaie…"; majAide(); try { peer.destroy(); } catch (x) {} setTimeout(ecouter, 8000); }
    else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error") { TEL_TXT = "Pas de réseau pour le lien, je réessaie…"; majAide(); try { peer.destroy(); } catch (x) {} setTimeout(ecouter, 8000); }
  });
}
/* L'écran reste allumé ; le plein écran se demande à la page qui contient le jeu (le cadre de Streamlit), sinon au cadre lui-même */
async function allumer() { for (const w of [window, window.parent]) { try { await w.navigator.wakeLock.request("screen"); return; } catch (e) {} } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") allumer(); });
const docPlein = () => { try { if (window.parent.document.fullscreenElement) return window.parent.document; } catch (e) {} return document.fullscreenElement ? document : null; };
function pleinEcran() {
  if (docPlein()) return;
  for (const d of (() => { try { return [window.parent.document, document]; } catch (e) { return [document]; } })()) { try { const p = d.documentElement.requestFullscreen(); if (p) { p.catch(() => {}); return; } } catch (e) {} }
}

/* ======================= commandes ======================= */
$("bPartir").onclick = () => { if (!$("bPartir").disabled) demarrer(); };
$("bEssai").onclick = () => { essai = true; audio(); majAide(); };
$("bPlein").onclick = () => { audio(); const d = docPlein(); if (d) d.exitFullscreen(); else pleinEcran(); };
$("bSon").onclick = () => { audio(); son = !son; $("bSon").classList.toggle("off", !son); if (mer) mer.gain.value = son ? .05 : 0; if (!son) try { speechSynthesis.cancel(); } catch (e) {} };
$("bPause").onclick = () => { $("pauseTxt").textContent = `${COURSE ? COURSE.nom : ""} · ${fmt(S.t)} · ${fmtM(S.dist)}. ${essai ? "" : "Le téléphone continue de compter."}`; $("pause").hidden = false; };
$("pReprendre").onclick = () => { $("pause").hidden = true; };
$("pQuitter").onclick = () => { $("pause").hidden = true; quitterCourse(); };
tenir($("pTerminer"), terminerSeance);
$("ui").addEventListener("pointerdown", e => { audio(); allumer(); if (!essai || S.etat !== "course" || e.target.closest("button,.carte,.boite")) return; coup(SIM.force + Math.random() * .3); });
document.addEventListener("keydown", e => {
  if (!essai) return;
  if (e.code === "Space") { e.preventDefault(); coup(SIM.force + Math.random() * .3); }
  if (e.key === "a" || e.key === "A") { auto = !auto; prochAuto = 0; }
  if (e.key === "+") SIM.cad = Math.min(36, SIM.cad + 2);
  if (e.key === "-") SIM.cad = Math.max(16, SIM.cad - 2);
  if (e.key === "f") SIM.force = SIM.force > .7 ? .4 : .9;
  if (e.key === "x") ACC = ACC === 1 ? 8 : 1;
});
