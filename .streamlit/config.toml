[client]
toolbarMode = "minimal"

# Thème sombre (comme l'appli padel) : mêmes couleurs en clair et en sombre
[theme]
font = "Jersey 15:https://fonts.googleapis.com/css2?family=Jersey+15&display=swap"
baseRadius = "medium"

[theme.light]
primaryColor = "#6B8CFF"
backgroundColor = "#22315A"
secondaryBackgroundColor = "#1A2548"
textColor = "#EEF2FA"

[theme.dark]
primaryColor = "#6B8CFF"
backgroundColor = "#22315A"
secondaryBackgroundColor = "#1A2548"
textColor = "#EEF2FA"
